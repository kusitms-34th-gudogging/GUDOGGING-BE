# 테스트 프로필 (@ActiveProfiles("test")). application.yaml 위에 덮어씀.
# .env·MySQL 없이 @SpringBootTest 컨텍스트를 띄우기 위한 설정. 모든 값은 테스트 전용 더미 (실제 환경과 무관)
spring:
  datasource:
    url: jdbc:h2:mem:gudogging;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

google:
  client-ids: test-dummy-client-id
  gmail:
    client-id: test-dummy-gmail-client-id
    client-secret: test-dummy-gmail-client-secret

# 테스트는 로컬 .env에 키가 있어도 실제 FCM을 쓰지 않음 (LoggingPushSender)
firebase:
  credentials: ""

