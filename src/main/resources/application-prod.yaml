# 운영 프로필 (SPRING_PROFILES_ACTIVE=prod). application.yaml 위에 덮어씀.
spring:
  jpa:
    show-sql: false
    hibernate:
      # 운영 DB가 비어 있는 최초 1회만 JPA_DDL_AUTO=update 로 띄워 테이블 생성 후, validate 로 되돌릴 것
      ddl-auto: ${JPA_DDL_AUTO:validate}
  data:
    redis:
      password: ${REDIS_PASSWORD:}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

server-uri: ${SERVER_URI}

# 스크린샷 구독 분석 OCR 서버: 운영은 기본값 없이 필수 (누락 시 배포 전 check-env.sh에서 실패)
ocr:
  base-url: ${OCR_BASE_URL}
  api-key: ${OCR_API_KEY}

# Swagger는 운영에서 기본 비활성 (필요 시 SWAGGER_ENABLED=true)
swagger:
  enabled: ${SWAGGER_ENABLED:false}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
