spring:
  application:
    name: gudogging
  config:
    # 로컬 실행 시 프로젝트 루트의 .env 를 읽음 (없으면 무시 → CI/서버는 OS 환경변수 사용)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gudogging}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      # 스크린샷 구독 분석 (A-07): 1장당 10MB, 최대 5장. 기본값(1MB / 10MB)이면 여러 장 업로드가 실패한다
      max-file-size: 10MB
      max-request-size: 55MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  # Nginx(HTTPS) 뒤에서 X-Forwarded-* 인식 (개발·운영 공통). 없으면 https Origin 요청을 다른 출처로 오인해 CORS 403
  forward-headers-strategy: framework

server-uri: ${SERVER_URI:http://localhost:8080}

# 헬스체크 (배포 후 확인 / 롤백 기준). health 만 노출, 상세 정보는 숨김
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 스크린샷 구독 분석 OCR 서버 (AI_SERVER_GUIDE.md). API 키는 OCR 담당자에게 따로 받는다 — 커밋 금지
ocr:
  base-url: ${OCR_BASE_URL:http://localhost:18000}
  api-key: ${OCR_API_KEY:}
  connect-timeout: 2s
  read-timeout: 15s

google:
  client-ids: ${GOOGLE_CLIENT_IDS}
  # Gmail 연동용 웹 애플리케이션 OAuth 클라이언트. 모바일 서버용 인증 코드는 redirect-uri가 빈 값
  gmail:
    client-id: ${GOOGLE_GMAIL_CLIENT_ID}
    client-secret: ${GOOGLE_GMAIL_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_GMAIL_REDIRECT_URI:}

apple:
  client-id: ${APPLE_CLIENT_ID}
  team-id: ${APPLE_TEAM_ID}
  key-id: ${APPLE_KEY_ID}
  private-key: ${APPLE_PRIVATE_KEY}

# Gmail 결제 메일 분석 LLM. 비어 있으면 분석 API가 40806으로 실패한다 (배포는 가능)
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

# FCM 서비스 계정 키 JSON을 Base64로 인코딩한 값. 비어 있으면 푸시를 실제로 보내지 않고 로그만 남긴다
firebase:
  credentials: ${FIREBASE_CREDENTIALS:}

encryption:
  key: ${ENCRYPTION_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-seconds: 3600
  refresh-expiration-seconds: 1209600
