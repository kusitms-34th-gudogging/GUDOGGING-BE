# Feature Specification
# Status: Implemented
# Last Updated: 2026-11-20

meta:
  id: CHECK-004
  title: 구독 점검 유지/해지 결정
  type: Feature
  author: parkdo0918
  issue: "#34"
  depends_on:
    - CHECK-001   # SubscriptionCheck decided_at, keep(decidedAt) · cancel(text, decidedAt)
    - CHECK-003   # SubscriptionCheckGetService.findCheck(user, checkupId), CheckupNotFoundException(40503)
  sources:
    - "노션 API 명세서 Checkup — 구독 점검 유지/해지 결정 (2026-11-20 확인)"
    - "화면설계서 CHK-008 K-80 '해지하기 · 유지하기', CHK-009 K-90 해지 이유"

overview:
  summary: >
    점검 결과(K-80)에서 '유지하기'를 누르거나, '해지하기' → 해지 이유(K-90)에서 '해지 방법 보기' · '건너뛰기'를 누르면 결정을 저장한다.
    유지는 결정 · 결정 시각만, 해지는 해지 이유(복수 선택, 직접 입력 100자)를 함께 저장한다.
    같은 점검에 다시 결정하면 마지막 결정으로 덮어쓴다 (K-90 → 뒤로가기 → K-80).
  user_story: >
    As a 로그인한 회원, I want to 점검 결과를 보고 유지 또는 해지를 고르기를,
    so that 내 결정이 기록되고 해지할 때 이유가 남는다.
  goals:
    - KEEP · CANCEL 결정과 결정 시각 저장
    - 해지 이유 복수 저장, 직접 입력 텍스트 저장
    - 재결정 시 덮어쓰기 (해지 이유는 Soft Delete · 되살리기)

technical_spec:
  api:
    - method: PATCH
      path: /api/v1/checkups/{checkupId}/decision
      summary: 구독 점검 유지/해지 결정
      auth: Required (Authorization Bearer Access Token)
      request:
        user_id: "@CurrentUserId UUID userId"
        path_params:
          - name: checkupId
            type: UUID
            required: true
        body:
          dto: DecideCheckupRequest (record, @Valid)
          fields:
            - "decision (CheckDecision, 필수): @NotNull — KEEP / CANCEL"
            - "cancelReasons (List<CancelReason>, 선택): 요소 @NotNull — RARELY_USED / PRICE_BURDEN / LACKING / SWITCHING / GOAL_ACHIEVED / CUSTOM. 건너뛰기면 보내지 않음"
            - "cancelReasonText (String, 선택): @Size(max = 100) — CUSTOM을 고르고 입력한 경우"
          mock: |
            {
              "decision": "CANCEL",
              "cancelReasons": ["RARELY_USED", "CUSTOM"],
              "cancelReasonText": "요즘 잘 안 봐요"
            }
      response:
        http_status: 200 OK
        dto: CheckupDecisionResponse
        wrapper: CommonResponse<CheckupDecisionResponse>
        response_code: "CheckResponseCode.CHECKUP_DECIDED (200, HttpStatus.OK, \"점검 결정을 저장했습니다.\")"
        fields:
          - "checkupId (UUID)"
          - "decision (CheckDecision): KEEP / CANCEL"
        mock: |
          {
            "code": 200,
            "message": "점검 결정을 저장했습니다.",
            "data": { "checkupId": "b1d7a2c4-5a4d-4e7b-9c21-000000000001", "decision": "CANCEL" }
          }

  decision_rules:
    keep: "check.keep(now) — decision = KEEP, decidedAt = now, cancelReasonText = null. 기존 해지 이유는 모두 Soft Delete. 요청의 cancelReasons · cancelReasonText는 무시"
    cancel: >
      check.cancel(text, now) — decision = CANCEL, decidedAt = now.
      text = cancelReasons에 CUSTOM이 있고 cancelReasonText가 공백이 아니면 strip한 값, 아니면 null.
      해지 이유는 요청한 이유(중복 제거)로 맞춘다: 요청에 없는 기존 이유는 Soft Delete, 요청한 이유 중 기존 줄(삭제 포함)이 있으면 그 줄을 되살리고(restore), 없으면 새로 저장(saveAll)
    skip: "건너뛰기 — decision = CANCEL, cancelReasons 없음 → 해지 이유 0줄 (기존 이유는 Soft Delete)"
    lenient: "요청과 결정이 맞지 않으면 무시 (2026-11-20 합의): KEEP인데 이유를 보냄 / CUSTOM 없이 텍스트 / CUSTOM인데 텍스트 비어 있음(CUSTOM 줄만 저장, 텍스트 null)"
    re_decision: "같은 점검에 다시 결정하면 마지막 결정으로 덮어씀 (2026-11-20 합의)"
    target: "본인 점검이면 지난 점검 · 구독 종료 구독의 점검도 결정 가능 (2026-11-20 합의)"
    unique_constraint: >
      subscription_check_cancel_reasons는 UNIQUE(subscription_check_id, reason)이고 Soft Delete된 줄도 포함해 검사한다.
      그래서 재결정 때 같은 이유를 새 줄로 넣지 않고 기존 줄을 되살린다 (해지 → 유지 → 다시 해지에서 500 방지, 2026-11-20 합의)
    home_note: "'유지하기를 고른 구독'의 홈 사용 현황 제외는 홈 API에서 decision = KEEP으로 판단 — 이 API에서 별도 처리 없음. D-1 알림도 별도 등록 없음 (노션)"

  data_flow:
    - step: 1
      layer: Presentation (CheckController)
      action: "@CurrentUserId userId, @PathVariable checkupId, @RequestBody @Valid DecideCheckupRequest → CheckUseCase.decideCheckup(...) → CommonResponse.success(CHECKUP_DECIDED, response)"
    - step: 2
      layer: UseCase (CheckUseCase)
      action: >
        회원 확인 → 본인 점검 조회(없으면 40503) → 기존 해지 이유 전부(삭제 포함) 조회
        → KEEP: check.keep(now), 기존 이유 Soft Delete
        / CANCEL: check.cancel(text, now), 이유 맞추기(Soft Delete · restore · 새 줄 saveAll)
        → CheckupDecisionResponse.from(check)
      transaction: "@Transactional (쓰기)"
    - step: 3
      layer: Domain Service
      action: >
        SubscriptionCheckGetService.findCheck(user, checkupId) — CHECK-003 재사용 /
        SubscriptionCheckCancelReasonGetService.findAllCancelReasonsIncludingDeleted(check) — 신규 /
        SubscriptionCheckCancelReasonCreateService.createCancelReasons(reasons) — 신규, saveAll

  error_codes:
    - code: 40503
      name: CHECKUP_NOT_FOUND
      note: "CHECK-003 재사용"
    - code: 40001 / 40002
      note: "decision 누락 · 텍스트 100자 초과(40001), 잘못된 enum 값(40002)"
    - code: 40201
      name: USER_NOT_FOUND

package_structure:
  base: "com.subscribers.gudogging"
  files:
    - "global/common/entity/BaseEntity.java (수정 — restore(): deleted = false, deletedAt = null)"
    - "domain/check/presentation/CheckController.java (수정 — decideCheckup)"
    - "domain/check/presentation/response/CheckResponseCode.java (수정 — CHECKUP_DECIDED)"
    - "domain/check/application/usecase/CheckUseCase.java (수정 — decideCheckup)"
    - "domain/check/application/dto/request/DecideCheckupRequest.java (신규)"
    - "domain/check/application/dto/response/CheckupDecisionResponse.java (신규, record + from)"
    - "domain/check/domain/repository/SubscriptionCheckCancelReasonRepository.java (수정 — findAllBySubscriptionCheck)"
    - "domain/check/domain/service/SubscriptionCheckCancelReasonGetService.java (수정 — findAllCancelReasonsIncludingDeleted)"
    - "domain/check/domain/service/SubscriptionCheckCancelReasonCreateService.java (신규 — createCancelReasons, saveAll)"

testing_strategy:
  # CheckUseCaseTest — Mock 추가: SubscriptionCheckCancelReasonGetService, SubscriptionCheckCancelReasonCreateService
  happy_path:
    - "decideCheckup: KEEP이면 decision = KEEP, decidedAt을 저장하고 응답으로 checkupId · decision을 반환한다"
    - "decideCheckup: CANCEL이면 decision = CANCEL, decidedAt과 해지 이유들을 저장한다"
    - "decideCheckup: CUSTOM과 텍스트를 보내면 텍스트를 앞뒤 공백 제거해 저장한다"
  edge_cases:
    - "decideCheckup: 건너뛰기(CANCEL, 이유 없음)면 해지 이유를 저장하지 않는다"
    - "decideCheckup: KEEP인데 이유를 보내면 무시한다"
    - "decideCheckup: CUSTOM 없이 텍스트만 보내면 텍스트를 저장하지 않는다"
    - "decideCheckup: CUSTOM인데 텍스트가 비어 있으면 CUSTOM 이유만 저장하고 텍스트는 null"
    - "decideCheckup: 같은 이유가 중복으로 오면 한 번만 저장한다"
    - "decideCheckup: 해지 후 유지로 바꾸면 기존 해지 이유를 Soft Delete하고 텍스트를 지운다"
    - "decideCheckup: 해지 이유를 바꾸면 빠진 이유는 Soft Delete, 남은 이유는 유지, 새 이유만 새로 저장한다"
    - "decideCheckup: 지웠던 이유를 다시 고르면 새로 저장하지 않고 되살린다"
    - "decideCheckup: 점검이 없거나 다른 회원 것이면 CHECKUP_NOT_FOUND(40503)"
    - "decideCheckup: 회원이 없으면 USER_NOT_FOUND"
  test_files:
    - "test/.../domain/check/application/usecase/CheckUseCaseTest.java (수정 — @Nested DecideCheckup)"

notes:
  - "[결정] 재결정은 덮어쓰기, 요청 불일치는 무시, 본인 점검이면 모두 허용, 해지 이유는 되살리기 (2026-11-20 합의)"
  - "[변경] BaseEntity에 restore() 추가 — 공통 클래스. Soft Delete 규칙은 유지 (실제 삭제 없음)"
  - "[범위] 카테고리별 해지 이유 문구(K-90, ERD 5.3)는 클라이언트 표시 — 이 API는 코드만 주고받음"
