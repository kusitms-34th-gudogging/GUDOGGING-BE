# Feature Specification
# Status: Implemented
# Last Updated: 2026-11-21

meta:
  id: CHECK-005
  title: 점검 결과 절약 제안 (번들 추천)
  type: Feature
  author: parkdo0918
  issue: "#36"
  depends_on:
    - CHECK-003     # GET /api/v1/checkups/{checkupId} (bundles 빈 배열 → 채움)
    - CATALOG-002   # 서비스 목록 요금제 단위
    - CATALOG-003   # 번들 상품 데이터 (BundleGetService)
  sources:
    - "화면설계서 CHK-008 K-80 '같은 {서비스명}, 더 싸게' · '번들 추천 카드 · 유형별 예시' · 설명 4번 (최우선 기준)"
    - "기획 답변 (2026-11-21), 구글 시트 '번들 상품 목록'"
  priority: "화면설계서 기준 — 화면에 없는 응답 필드는 빼고, 화면에 필요한 값은 추가 (2026-11-21 합의)"

overview:
  summary: >
    점검 결과 조회(K-80)의 bundles를 채운다. 지금 점검한 구독의 요금제가 포함된 번들 중
    확정 절약 · 카드 · 통신 요금제를 화면 규칙대로 계산해 최대 4개 내려준다.
  goals:
    - 유형별 계산 (확정 절약 · 최대 절약 카드 · 혜택 소개 통신 요금제)
    - 정렬 · 개수 제한 (같은 제공사 유형 최대 2개, 전체 최대 4개)
    - 응답을 화면 카드 요소에 맞춤

technical_spec:
  api:
    method: GET
    path: /api/v1/checkups/{checkupId}
    note: "기존 API — bundles 필드만 바뀜, 나머지 필드 그대로"
    response_changes:
      removed:
        - "maxMonthlySaving — K-80에 표시하는 곳 없음"
        - "bundles[].condition — 카드에 표시 없음"
        - "bundles[].providerType — 카드에 표시 없음 (개수 제한은 서버에서 처리)"
      changed:
        - "bundles[].includes: Array<String> → String — 카드 둘째 줄 '포함 내용' 한 줄 (Bundle.includesSummary 자동 생성)"
        - "bundles[].priceType: FIXED / MAX + BENEFIT(통신 요금제) 추가"
      added:
        - "bundles[].savingRate (Integer, nullable): 절약 막대 % — 통신 요금제는 null(막대 없음)"
    bundle_fields:
      - "name (String): 상품명"
      - "includes (String): 포함 내용 한 줄 — 고정 포함 ' + ', 택1은 첫 번째 그룹만 ' · … 택1'(각 최대 2개, 남으면 '등'), 같은 서비스 요금제는 서비스 이름 하나로 (예: 'Netflix · YouTube Premium 등 택1'). 서비스 목록 이름이라 영어가 섞임"
      - "tags (List<String>): [태그1 제공사 · 상품군, 태그2 핵심 혜택] — 빈 태그는 빼고 최대 2개"
      - "priceType (BundleRecommendType — 번들 데이터의 유형 enum 재사용, EXCLUDED는 응답에 나오지 않음): FIXED(큰 숫자 '월 N원') / MAX(카드, '최대 N원') / BENEFIT(통신 요금제, 큰 숫자 대신 tags[1] 혜택)"
      - "monthlySaving (Integer, nullable): 큰 숫자 금액 — BENEFIT은 null"
      - "savingRate (Integer, nullable): 막대 0~100 — BENEFIT은 null"
      - "monthlyPrice (Integer, nullable): 아래 문구 — FIXED '월 N원에 이용', BENEFIT '{tags[0]} 가입 시 (요금제 월 N원)', MAX는 null('이 카드로 결제 시')"
    mock: |
      "bundles": [
        { "name": "유독 더블 스트리밍", "includes": "넷플릭스 + 유튜브 프리미엄", "tags": ["LG U+ 유독", "연간권"],
          "priceType": "FIXED", "monthlySaving": 9500, "savingRate": 33, "monthlyPrice": 18900 },
        { "name": "zgm.streaming카드", "includes": "넷플릭스 · 유튜브 등 OTT 택1", "tags": ["NH농협카드", "50% 할인"],
          "priceType": "MAX", "monthlySaving": 6750, "savingRate": 50, "monthlyPrice": null },
        { "name": "베스트 109(넷플릭스)", "includes": "넷플릭스 스탠다드 포함", "tags": ["SKT 요금제", "넷플릭스 월 1,000원"],
          "priceType": "BENEFIT", "monthlySaving": null, "savingRate": null, "monthlyPrice": 109000 }
      ]

  recommend_rules:
    candidate: >
      점검한 구독이 서비스 목록 요금제(service_id 있음)일 때만 — 직접 입력 구독 · 예전 서비스 단위 행(비활성)은 bundles = [].
      BundleGetService.findBundlesIncluding(점검한 구독의 요금제 이름) (EXCLUDED 제외)
    my_amount: >
      '구독 중인 포함 서비스 금액' = 회원의 구독 중(ACTIVE) 구독 중 요금제 이름이 같은 구독의 월 환산 금액(subscription.monthlyAmount(), 사용자가 등록한 금액).
      점검한 구독은 구독 종료여도 포함. 서비스 목록에 없는 포함 서비스 · 구독하지 않은 포함 서비스는 0원
    fixed:
      paid: "고정 포함 서비스 중 구독 중인 것 합 + 택1 A 중 구독 중인 가장 비싼 1개 + 택1 B 중 구독 중인 가장 비싼 1개"
      price: "상품 월 가격. 서비스별 적용가가 있으면 택1에서 고른(가장 비싼) 요금제의 적용가"
      saving: "paid − price. 0원 이하면 제외"
      rate: "saving ÷ paid × 100 (내림)"
    max_card:
      saving: >
        포함 서비스별 할인액 합 — 할인율이면 금액 × % (내림), 할인액이면 min(할인액, 금액).
        대상: ALL = 고정 포함 전부 + 택1 그룹마다 가장 비싼 1개 / FIXED = 고정 포함 / A · B = 그 그룹의 가장 비싼 1개 / CATEGORY = 고정 포함 중 그 카테고리
      zero: "할인액 0원이면 제외 (구독 중인 대상 서비스 없음)"
      rate: "적용된 할인이 모두 같은 할인율이면 그 %(화면 '할인율 그대로'), 아니면 saving ÷ 할인 대상 금액 합 × 100 (내림)"
    benefit:
      rule: "계산하지 않음 — 후보면 노출. monthlySaving · savingRate = null"
    order: "FIXED(절약액 큰 순) → MAX(절약액 큰 순) → BENEFIT(시트 순서). 같으면 시트 순서"
    limit: "앞에서부터 담되 같은 제공사 유형(PLATFORM / TELECOM / CARD) 최대 2개, 전체 최대 4개. 0개면 빈 배열(화면은 영역 숨김)"
    header: "'추천 n개'는 bundles 길이로 클라이언트 표시"

  data_flow:
    - step: 1
      layer: UseCase (CheckUseCase.getCheckupResult)
      action: "기존 흐름 + BundleGetService.findBundlesIncluding(점검한 요금제 이름) → BundleRecommender로 계산 · 정렬 · 제한 → CheckupResultResponse"
    - step: 2
      layer: Domain
      action: "domain/check/domain/bundle/BundleRecommender (신규, 정적 순수 계산 — CheckScore와 같은 방식) — 번들 목록 + 회원 구독 → 추천 결과(BundleRecommendation)"

  error_codes: "없음 (기존 그대로)"

package_structure:
  base: "com.subscribers.gudogging"
  files:
    - "domain/check/domain/bundle/BundleRecommender.java · BundleRecommendation.java (신규)"
    - "domain/check/application/dto/response/CheckupBundleResponse.java (수정 — 필드 변경)"
    - "domain/check/application/dto/response/CheckupResultResponse.java (수정 — maxMonthlySaving 삭제, bundles 채움)"
    - "domain/check/application/usecase/CheckUseCase.java (수정 — BundleGetService 주입)"
    - "domain/check/presentation/CheckController.java (수정 — Swagger 설명)"
    - ".claude/features/check/003_get_checkup_result.yaml (수정 — 응답 필드 동기화)"

testing_strategy:
  # CheckUseCaseTest @Nested GetCheckupResult — Mock 추가: BundleGetService
  fixed:
    - "결합 상품: 구독 중인 포함 서비스 합 − 상품 가격을 월 절약액으로, 절약액 ÷ 지금 내는 금액을 막대로 반환한다 (넷플릭스 13,500 + 유튜브 14,900 vs 18,900 → 9,500 · 33%)"
    - "포함 서비스 일부만 구독 중이면 구독 중인 것만 더한다"
    - "절약액이 0원 이하면 추천하지 않는다"
    - "택1은 구독 중인 것 중 가장 비싼 1개만 더하고 고정 포함 서비스는 함께 더한다"
    - "서비스별 적용가가 있으면 고른 요금제의 적용가를 상품 가격으로 쓴다"
  max_card:
    - "카드: 구독 중인 포함 서비스 금액 × 할인율을 최대 절약액으로, 할인율을 막대로 반환한다"
    - "택1 그룹은 가장 비싼 1개에만 할인을 적용하고, 그룹별 할인(A 50% / B 3,000원)을 각각 적용한다"
  benefit:
    - "통신 요금제: 계산 없이 monthlySaving · savingRate는 null, monthlyPrice는 요금제 가격으로 반환한다"
  order_limit:
    - "확정 절약(큰 순) → 카드 → 통신 요금제 순으로, 같은 제공사 유형은 2개까지, 전체 4개까지 반환한다"
  edge:
    - "직접 입력 구독의 점검이면 bundles는 빈 배열이다"
    - "후보 번들이 없으면 bundles는 빈 배열이다"

notes:
  - "[결정] 응답은 화면설계서 기준: maxMonthlySaving · condition · providerType 삭제, includes 문자열, priceType BENEFIT · savingRate 추가 (2026-11-21)"
  - "[결정] 내 구독 금액 = 사용자가 등록한 금액의 월 환산 (시트 가격 아님)"
  - "[결정] includes는 그룹 정보로 자동 생성 (2026-11-21 합의, Figma 예시처럼 한글 · 'OTT' 묶음 단어는 아님)"
  - "[해석] 카드 막대: 같은 할인율이면 그 %, 섞여 있거나 할인액이면 절약액 ÷ 대상 금액"
  - "[반영] 노션 응답 표 수정 완료 (2026-11-21). mock 코드 블록은 직접 교체 필요"
  - "[공유] 노션 '구독 점검 결과 조회'의 bundles · maxMonthlySaving을 이 스펙대로 고쳐 달라고 프론트 · 기획에 전달"
