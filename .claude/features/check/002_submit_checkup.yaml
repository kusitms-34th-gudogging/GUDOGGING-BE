  base: "com.subscribers.gudogging.domain.check"
  files:
    - "presentation/CheckController.java (수정 — submitCheckup 핸들러, @ResponseStatus(CREATED))"
    - "presentation/response/CheckResponseCode.java (수정 — CHECKUP_SUBMITTED)"
    - "application/usecase/CheckUseCase.java (수정 — submitCheckup, SubscriptionCheckCreateService 의존 추가)"
    - "application/dto/request/SubmitCheckupRequest.java (신규, record)"
    - "application/dto/request/CheckupAnswerRequest.java (신규, record)"
    - "application/dto/response/CheckupSubmissionResponse.java (신규, record + from — checkupId만)"
    - "application/exception/CheckErrorCode.java (수정 — 40502)"
    - "application/exception/InvalidCheckupAnswersException.java (신규)"
    - "domain/result/CheckScore.java (신규 — percentOf, 계획 1점 상한)"
    - "domain/result/CheckResultStage.java (수정 — of(scorePercent) 구간 매핑)"
    - "domain/service/SubscriptionCheckCreateService.java (신규 — createCheck)"
  other:
    - "coding-style.yaml — 40502 추가"
    - "references/data-model/domains/check/subscription_check.yaml — 제출 계산 위치 반영"

testing_strategy:
  # CheckUseCaseTest — Mock 추가: SubscriptionCheckCreateService
  happy_path:
    - "submitCheckup: 응답 · 메모 · 활용도 · 단계 · 점검 대상 결제일(다음 결제일) · 카테고리를 담아 점검을 저장한다"
    - "submitCheckup: 응답으로 저장한 점검 ID만 반환한다"
    - "submitCheckup: 활용도 공식대로 계산하고 반올림한다 (2 · 3 · 2 → 31)"
    - "submitCheckup: 활용도 구간별로 단계를 매핑한다 (80 · 79 · 60 · 59 · 40 · 39 경계)"
  edge_cases:
    - "submitCheckup: 계획이 1점이면 활용도를 59로 제한한다 (5 · 5 · 1 → 59, CANCEL_CONSIDER)"
    - "submitCheckup: 응답 순서가 달라도 type 기준으로 계산한다"
    - "submitCheckup: 메모가 공백뿐이면 null로 저장하고, 앞뒤 공백은 제거한다"
    - "submitCheckup: 꾸준히 쓰는 구독도 제출할 수 있다"
    - "submitCheckup: type이 중복되거나 빠지면 INVALID_CHECKUP_ANSWERS(40502) 예외를 던지고 저장하지 않는다"
    - "submitCheckup: 구독 종료 구독이면 CHECK_SUBSCRIPTION_NOT_ACTIVE(40501) 예외를 던지고 저장하지 않는다"
    - "submitCheckup: 구독이 없거나 다른 회원 것이면 SUBSCRIPTION_NOT_FOUND(40404)"
    - "submitCheckup: 회원이 없으면 USER_NOT_FOUND"
  test_files:
    - "test/.../domain/check/application/usecase/CheckUseCaseTest.java (수정 — @Nested SubmitCheckup 추가)"

notes:
  - "[가정] type 중복 · 누락은 새 에러 40502(400) — 노션 명세에 정의 없음"
  - "[변경] 노션 명세 변경 (2026-11-20): 응답이 checkupId · score · stage · yearlyCost → checkupId만 (화면설계서 K-70 '저장 후 K-80 이동', K-80은 결과 조회 API 사용). 꾸준히 쓰는 구독 제출 허용이 명세에 명시됨"
  - "[가정] 메모는 strip 후 저장, 비면 NULL"
  - "[범위] 결과 조회 · 결정 · 절약 제안은 후속 스펙"
