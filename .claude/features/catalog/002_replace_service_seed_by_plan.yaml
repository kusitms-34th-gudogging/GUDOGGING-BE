# Feature Specification
# Status: Implemented
# Last Updated: 2026-11-21

meta:
  id: CATALOG-002
  title: 서비스 목록을 요금제 단위로 교체 (서비스 시드)
  type: Feature (Seed)
  author: parkdo0918
  issue: "#36"
  depends_on:
    - CATALOG-001   # 서비스 목록 조회 · 검색 (응답 필드 변경 없음)
  sources:
    - "구글 시트 '서비스 DB' > '서비스 목록' 탭 (요금제 단위 195행, 2026-11-21 확인)"
    - "기획 답변 (2026-11-21): 서비스 목록은 요금제 단위, 번들은 요금제 이름까지 매칭"
    - "화면설계서 CHK-008 설명 4번: 서비스는 요금제 단위로 연결"

overview:
  summary: >
    서비스 시드를 서비스 단위 92행(예: Netflix)에서 시트의 요금제 단위 195행(예: Netflix 광고형 스탠다드 · 스탠다드 · 프리미엄)으로 바꾼다.
    번들 추천(CHECK-005 예정)이 사용자 구독의 요금제를 알아야 하므로, 구독은 지금처럼 service_id로 요금제 행을 가리키게 한다.
    원화 월 가격은 구독 정보 입력(A-03) 결제 금액 기본값(default_amount)으로 넣는다.
  goals:
    - services_seed.csv를 시트 '서비스 목록' 기준 195행으로 교체
    - 시드 동기화 때 CSV에 없는 기존 서비스는 비활성화(is_active = false), CSV에 다시 생기면 활성화
    - default_amount를 CSV에서 동기화

technical_spec:
  seed_csv:
    file: "src/main/resources/seed/services_seed.csv"
    header: "name,category,logo_url,cancel_url,default_amount,sort_order (default_amount 컬럼 추가)"
    mapping:
      name: "서비스명 그대로 (최대 35자, 컬럼 50자 이내)"
      category: "영상·OTT → VIDEO_OTT, 음악 → MUSIC, 쇼핑·배달 멤버십 → SHOPPING_DELIVERY, 교육·학습 → EDUCATION, 생산성·AI → PRODUCTIVITY_AI, 엔터테인먼트 → ENTERTAINMENT, 기타 → ETC"
      logo_url: "로고 파일 (빈칸 22개는 빈 값)"
      cancel_url: "해지 링크 (빈칸은 빈 값 → 해지 안내는 링크 없음 화면)"
      default_amount: "가격이 원화이고 결제 주기가 '월간' 또는 '월간 (연간약정)'이면 숫자, 그 밖(달러 46개 · 연간 4개 · 빈칸 1개)은 빈 값"
      sort_order: "시트 행 순서 (1부터)"
    source: "시트를 CSV로 내려받아 변환 (변환 스크립트는 레포에 두지 않음)"

  sync_rules:
    match: "name 기준 (기존과 동일)"
    new_row: "DB에 없는 이름 → 추가 (is_active = true)"
    existing_row: "category · logo_url · cancel_url · default_amount · sort_order 갱신 + 비활성 상태면 활성화 (updateFromSeed)"
    missing_row: "CSV에 없는 기존 서비스(예: Netflix, 티빙, ChatGPT) → is_active = false. 행은 지우지 않음"
    existing_subscription: "비활성 서비스에 연결된 기존 구독은 그대로 (조회 · 해지 안내 정상). 요금제 정보가 없어 번들 추천에는 걸리지 않음"
    untouched: "name_en · search_keywords · object_particle은 지금처럼 건드리지 않음"

  impact:
    catalog_api: "GET /api/v1/services 응답 필드는 그대로, 항목이 요금제 단위로 바뀜 (예: Netflix → Netflix 광고형 스탠다드 / 스탠다드 / 프리미엄). 검색도 요금제 이름 기준"
    registration: "구독 등록 때 요금제를 고르고, default_amount가 있으면 결제 금액 기본값으로 채워짐 (기존 동작)"
    db: "테이블 구조 변경 없음 — 마이그레이션 불필요. 운영 · 개발 모두 앱 기동 때 시드로 반영"

  data_flow:
    - step: 1
      layer: Presentation (ServiceCatalogSeedRunner)
      action: "앱 시작 시 CSV 읽기 (헤더 · 컬럼 6개 검증, default_amount 빈 값 → null) → CatalogUseCase.seedServices(rows)"
    - step: 2
      layer: UseCase (CatalogUseCase.seedServices)
      action: "이름 기준 추가 · 갱신, CSV에 없는 서비스 비활성화, saveAll"
      transaction: "@Transactional (쓰기, 기존)"

  error_codes: "없음"

package_structure:
  base: "com.subscribers.gudogging"
  files:
    - "src/main/resources/seed/services_seed.csv (교체 — 195행, default_amount 컬럼)"
    - "domain/catalog/presentation/ServiceCatalogSeedRunner.java (수정 — 헤더 · 컬럼 6개)"
    - "domain/catalog/application/dto/request/ServiceSeedRow.java (수정 — defaultAmount)"
    - "domain/catalog/application/usecase/CatalogUseCase.java (수정 — 비활성화 · 활성화)"
    - "domain/catalog/domain/entity/ServiceCatalog.java (수정 — updateFromSeed에 defaultAmount · 활성화, deactivate())"

testing_strategy:
  # CatalogUseCaseTest (seedServices)
  happy_path:
    - "seedServices: 새 요금제는 default_amount와 함께 추가한다"
    - "seedServices: 이미 있는 서비스는 카테고리 · 로고 · 해지 링크 · 기본 금액 · 순서를 갱신한다"
  edge_cases:
    - "seedServices: CSV에 없는 기존 서비스는 비활성화한다"
    - "seedServices: 비활성화된 서비스가 CSV에 다시 있으면 활성화한다"
    - "seedServices: default_amount가 없는 행은 null로 저장한다"

notes:
  - "[결정] 서비스 목록은 요금제 단위 (기획 답변 2026-11-21). ERD 10.1 #7 '요금제 단위 행 + default_amount' 방향과 같음"
  - "[제안] 달러 · 연간 가격은 default_amount를 비움 — 월 결제 기본값으로 넣으면 금액이 틀어짐"
  - "[제안] 시트 빈칸(로고 22 · 해지 링크 112)은 시트 그대로 빈 값. 예전 서비스 행의 값을 끌어오지 않음"
  - "[공유] 카탈로그 담당 · 프론트: 서비스 선택이 요금제 단위로 바뀜"
