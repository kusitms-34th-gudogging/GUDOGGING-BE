# Feature Specification
# Status: Draft
# Last Updated: 2026-11-17

meta:
  id: CATALOG-001
  title: 직접 등록 서비스 목록 조회·검색
  type: Feature
  author: 1winhyun
  source: "Figma 디자인 작업소 › 구독 등록(직접 등록 및 공통 화면) › SUB-001 (A-02, A-02s)"
  depends_on:
    - AUTH-001   # JWT 인증 필터, @CurrentUserId
    - USER-001   # UserErrorCode.USER_NOT_FOUND, UserNotFoundException

overview:
  summary: >
    직접 등록 서비스 선택 화면(A-02)의 '전체' 서비스 목록과 검색 결과(A-02s)를 반환한다.
    회원이 이미 구독 중(ACTIVE)인 서비스는 제외하고, 검색어가 있으면 부분 일치·초성·한/영·별칭·카테고리명으로
    매칭해 일치율이 높은 순으로 정렬한다.
  user_story: >
    As a 로그인한 회원, I want to 등록할 서비스를 목록에서 고르거나 검색하기를,
    so that 구독 중인 서비스를 빠르게 찾아 직접 등록할 수 있다.
  goals:
    - 검색어 없음 → 사전 등록 서비스 전체 목록 (sort_order 순)
    - 검색어 있음 → 서버에서 매칭·일치율 정렬 (글자 입력마다 호출)
    - 이미 등록한(ACTIVE) 서비스는 목록·검색 결과에서 제외

technical_spec:
  api:
    - method: GET
      path: /api/v1/services
      summary: 직접 등록 서비스 목록 조회·검색
      auth: Required (Authorization Bearer Access Token)
      request:
        dto: 없음 (userId는 Access Token에서 — @CurrentUserId UUID userId)
        query_params:
          - name: keyword
            type: String
            required: false
            validation: "없음. null·공백만 있으면 '전체' 목록으로 처리"
      response:
        dto: ServiceResponse
        http_status: 200 OK
        response_code: "CatalogResponseCode.SERVICES_FOUND (200, HttpStatus.OK, \"서비스 목록을 조회했습니다.\")"
        wrapper: CommonResponse<List<ServiceResponse>>
        fields:
          - name: serviceId
            type: UUID
            description: "services.id — 구독 등록(SUBSCRIPTION-001) 요청에 그대로 사용"
          - name: name
            type: String
          - name: category
            type: Category
            description: "enum 코드 (VIDEO_OTT 등). 표시명은 클라이언트 매핑"
          - name: logoUrl
            type: String (nullable)
            description: "NULL이면 클라이언트 기본 이미지"
        factory: "ServiceResponse.from(ServiceCatalog)"
        empty_result: "매칭 결과가 없으면 data = [] (200). 앱은 '직접 입력하기' 항목만 노출 (A-02s)"

  data_flow:
    - step: 1
      layer: Presentation (CatalogController)
      action: "@CurrentUserId UUID userId, @RequestParam(required = false) String keyword → CatalogUseCase.getServices(userId, keyword) → CommonResponse.success(CatalogResponseCode.SERVICES_FOUND, data)"
    - step: 2
      layer: UseCase (CatalogUseCase.getServices)
      action: "회원 조회 → 구독 중 서비스 ID 조회 → 노출 서비스 조회 후 제외 → 검색·정렬 → List<ServiceResponse>"
      transaction: false (class-level readOnly = true)
    - step: 3
      layer: Domain Service (UserGetService)
      action: "findUserById(userId) — deleted = false. 없으면 UserNotFoundException"
    - step: 4
      layer: Domain Service (SubscriptionGetService) — 신규
      action: "findActiveServiceIds(User user): Set<UUID> — 회원의 ACTIVE·미삭제 구독 중 service_id가 있는 것만"
    - step: 5
      layer: Domain Service (ServiceCatalogGetService) — 신규
      action: "findActiveServices(): List<ServiceCatalog> — is_active = true AND deleted = false, sort_order ASC, name ASC"
    - step: 6
      layer: Domain (ServiceSearchKeyword — 신규 VO)
      action: "ServiceSearchKeyword.from(keyword).search(candidates) — 아래 search_rules대로 필터·정렬 (UseCase는 결과를 ServiceResponse로 변환만)"
    - step: 7
      layer: Infrastructure (Repository)
      action: >
        ServiceCatalogRepository.findAllByIsActiveTrueAndDeletedFalseOrderBySortOrderAscNameAsc(),
        SubscriptionRepository.findActiveServiceIdsByUser(user) — JPQL:
        select s.serviceCatalog.id from Subscription s
        where s.user = :user and s.status = ACTIVE and s.deleted = false and s.serviceCatalog is not null

  search_rules:
    normalize: "검색어·비교 대상 모두 앞뒤 공백 제거 → 모든 공백 제거 → 소문자. 카테고리 표시명은 '·'도 제거 (예: '영상·OTT' → '영상ott')"
    empty_keyword: "정규화 결과가 빈 문자열이면 검색하지 않고 후보 전체를 조회 순서(sort_order ASC, name ASC) 그대로 반환 ('전체')"
    targets:
      - "name (서비스명)"
      - "name_en (영문 서비스명, nullable) — 한/영 매핑"
      - "search_keywords (별칭, 쉼표 구분, nullable) — 각 항목을 trim 후 개별 비교"
      - "category 표시명 (Category.displayName)"
      - "name의 초성 문자열 — 검색어가 초성(ㄱ~ㅎ 19자)으로만 이루어졌을 때만 비교"
    score: "서비스별로 아래 중 가장 높은 점수 1개. 0점이면 결과에서 제외"
    score_table:
      - "100: name / name_en / 별칭 중 하나와 정확히 일치"
      - "80: name / name_en / 별칭 중 하나가 검색어로 시작 (접두 일치)"
      - "60: name / name_en / 별칭 중 하나에 검색어 포함 (부분 일치)"
      - "50: 초성 검색 — name 초성 문자열이 검색어로 시작"
      - "40: 초성 검색 — name 초성 문자열에 검색어 포함"
      - "30: 카테고리 표시명에 검색어 포함"
    sort: "점수 DESC → sort_order ASC → name ASC"
    chosung: >
      한글 음절(가 U+AC00 ~ 힣 U+D7A3)은 (code - 0xAC00) / 588 인덱스로 초성 19자 중 하나로 변환,
      그 외 문자(영문·숫자 등)는 그대로 둔다. 예: '넷플릭스' → 'ㄴㅍㄹㅅ', '웨이브' → 'ㅇㅇㅂ'
    examples:
      - "'넷플' → 넷플릭스 (80, 접두)"
      - "'ㄴㅍ' → 넷플릭스 (50, 초성 접두)"
      - "'NETFLIX' → 넷플릭스 (100, name_en 정확 일치 — 대소문자 무시)"
      - "'음악' → 카테고리 MUSIC 서비스 전체 (30)"

  database:
    entities:
      - name: ServiceCatalog
        action: Read
        table: services
        notes: "is_active = true AND deleted = false. 서비스 수가 적어 전체 조회 후 메모리 검색 (ERD 4.3)"
      - name: Subscription
        action: Read
        table: subscriptions
        notes: "ACTIVE·미삭제 구독의 service_id만 조회 (idx_subscriptions_user_status 사용). ENDED 구독의 서비스는 다시 노출 (재등록 가능)"
      - name: User
        action: Read
        table: users

  error_codes:
    reused:
      - "40201 UserErrorCode.USER_NOT_FOUND (404) — 회원 없음·탈퇴 (USER-001)"
      - "40005 UNAUTHORIZED / 40103 EXPIRED_ACCESS_TOKEN / 40104 INVALID_ACCESS_TOKEN — 인증 실패 (AUTH-001)"
    new: "없음"

  changes_to_existing_code:
    - target: "Category (catalog/domain/entity)"
      change: >
        표시명 필드 displayName 추가 (@Getter @AllArgsConstructor) — 카테고리명 검색에 사용.
        VIDEO_OTT '영상·OTT', MUSIC '음악', SHOPPING_DELIVERY '쇼핑·배달 멤버십', EDUCATION '교육·학습',
        PRODUCTIVITY_AI '생산성·AI', ENTERTAINMENT '엔터테인먼트', ETC '기타' (ERD 5.1)
    - target: "ServiceCatalogRepository"
      change: "findAllByIsActiveTrueAndDeletedFalseOrderBySortOrderAscNameAsc() 추가"
    - target: "SubscriptionRepository"
      change: "findActiveServiceIdsByUser(User user) 추가 (@Query, 위 JPQL)"

  security_config:
    note: "변경 없음 — anyRequest().authenticated()로 보호됨"

  validation_rules:
    - "본인 기준 제외 — userId는 Access Token에서만 받는다"
    - "is_active = false 또는 삭제된 서비스는 노출하지 않는다"
    - "회원이 ACTIVE로 구독 중인 서비스는 '전체'와 검색 결과 모두에서 제외 (A-02 '이미 등록한 서비스는 추천 목록에서 제외')"
    - "ENDED(구독 종료)만 있는 서비스는 노출 (재등록 가능)"
    - "검색어 null·공백 → '전체' 목록"
    - "매칭 결과 없음 → 빈 배열 (에러 아님)"

package_structure:
  base: "com.subscribers.gudogging"
  catalog:
    - "domain/catalog/presentation/CatalogController.java (신규, @Tag(name = \"Catalog\"))"
    - "domain/catalog/presentation/response/CatalogResponseCode.java (신규)"
    - "domain/catalog/application/usecase/CatalogUseCase.java (신규)"
    - "domain/catalog/application/dto/response/ServiceResponse.java (신규, record + from())"
    - "domain/catalog/domain/service/ServiceCatalogGetService.java (신규)"
    - "domain/catalog/domain/search/ServiceSearchKeyword.java (신규 — 정규화·초성 변환·점수·정렬, 순수 도메인 객체)"
    - "domain/catalog/domain/entity/Category.java (수정 — displayName)"
    - "domain/catalog/domain/repository/ServiceCatalogRepository.java (수정)"
  subscription:
    - "domain/subscription/domain/service/SubscriptionGetService.java (신규 — findActiveServiceIds, SUBSCRIPTION-001에서도 사용)"
    - "domain/subscription/domain/repository/SubscriptionRepository.java (수정)"

testing_strategy:
  # CatalogUseCaseTest only (JUnit5 + Mockito)
  # Mock: UserGetService, SubscriptionGetService, ServiceCatalogGetService
  # ServiceSearchKeyword는 mock하지 않고 실제 로직으로 검증 (Entity/VO는 실제 객체 — testing-guide)
  # ServiceCatalog는 정적 팩토리가 없으므로 테스트 픽스처에서 ReflectionTestUtils로 필드 세팅
  happy_path:
    - "getServices: keyword가 null이면 노출 서비스 전체를 조회 순서 그대로 반환한다"
    - "getServices: keyword가 공백만 있으면 전체 목록을 반환한다"
    - "getServices: 회원이 ACTIVE로 구독 중인 서비스는 결과에서 제외한다"
    - "getServices: '넷플'로 검색하면 서비스명 접두 일치로 넷플릭스를 반환한다"
    - "getServices: 'ㄴㅍ'로 검색하면 초성 일치로 넷플릭스를 반환한다"
    - "getServices: 'NETFLIX'로 검색하면 대소문자를 무시하고 name_en 일치로 넷플릭스를 반환한다"
    - "getServices: search_keywords 별칭으로 검색하면 해당 서비스를 반환한다"
    - "getServices: '음악'으로 검색하면 MUSIC 카테고리 서비스를 반환한다"
  edge_cases:
    - "getServices: 정확 일치 > 접두 일치 > 부분 일치 > 초성 > 카테고리 순으로 정렬하고, 점수가 같으면 sort_order 순으로 정렬한다"
    - "getServices: 매칭되는 서비스가 없으면 빈 목록을 반환한다"
    - "getServices: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND 예외를 던진다"
  test_files:
    - "test/.../domain/catalog/application/usecase/CatalogUseCaseTest.java (신규)"

notes:
  - "결정 (2026-11-17): 검색은 서버 API에서 처리 (ERD 4.3 '애플리케이션 메모리 검색'). 클라이언트는 글자 입력마다 호출 — 디바운스는 클라이언트 재량"
  - "선택한 서비스 칩·체크 상태 유지, '직접 입력하기' 항목, 'N개 선택 완료' 버튼은 모두 클라이언트 처리 (서버 무관)"
  - "[가정] 검색 결과 보조 정보('유튜브 프리미엄·영상·OTT')는 클라이언트가 name + category 표시명으로 조합"
  - "[가정] 페이지네이션 없음 — 서비스 수가 적은 마스터 데이터"
  - "[가정] keyword 길이 검증 없음 — 메모리 비교라 비용이 작고, 긴 검색어는 결과가 비어 있을 뿐"
  - "[제안] 일치율 점수(100/80/60/50/40/30)는 Figma '일치율이 높은 순서'를 구체화한 값. 기획 확인 필요 시 조정"
  - "범위 외: 카테고리 목록 API — Category는 고정 enum 7종이라 클라이언트 상수로 처리"
  - "범위 외: 서비스 생성·수정 API — 운영자가 SQL로 관리 (service_catalog.yaml)"
