# Feature Specification
# Status: Implemented
# Last Updated: 2026-11-21

meta:
  id: CATALOG-003
  title: 번들 상품 데이터 (CSV, 메모리 보관)
  type: Feature (Reference Data)
  author: parkdo0918
  issue: "#36"
  depends_on:
    - CATALOG-002   # 서비스 목록 요금제 단위 (포함 서비스를 요금제 이름으로 연결)
  sources:
    - "구글 시트 '서비스 DB' > '번들 상품 목록' 탭 (260행, 2026-11-21 21:40 다운로드)"
    - "기획 답변 (2026-11-21), 화면설계서 CHK-008 설명 4번"

overview:
  summary: >
    번들 상품 260개를 DB 테이블 없이 CSV(TSV)로 두고, 앱이 뜰 때 읽어 메모리에 보관한다.
    포함 서비스는 요금제 이름(services.name)으로 들고 있고, 추천 계산(CHECK-005)에서 사용자 구독의 서비스 이름과 비교한다.
    시트를 바꾸면 TSV를 다시 만들어 재배포한다.
  goals:
    - 시트 → bundles_seed.tsv 변환 (계산에 필요한 값을 구조화)
    - 앱 시작 시 로드 · 형식 검증, 조회용 BundleGetService
  decision: "저장 방식 = DB 테이블 없이 CSV + 메모리 (2026-11-21 합의) — 읽기 전용 고정 데이터, 마이그레이션 · soft delete 누적 없음"

technical_spec:
  seed_file:
    path: "src/main/resources/seed/bundles_seed.tsv (탭 구분, 칸 안의 줄바꿈은 ', '로 바꿈)"
    columns:
      - "name: 상품명 (시트 '서비스명')"
      - "recommend_type: FIXED(확정 절약) / MAX(최대 절약 · 카드) / BENEFIT(혜택 소개 · 통신 요금제) / EXCLUDED(제외) — 시트 '추천 노출 방식'"
      - "provider_type: PLATFORM / TELECOM / CARD — 시트 '제공사 유형'"
      - "monthly_price: 상품 월 가격 (시트 '월 가격(숫자)', 카드는 빈 값)"
      - "includes_text: 화면 '포함 내용' 표시용 (시트 '포함된 서비스' 그대로)"
      - "condition: 적용 조건 (빈 값 가능)"
      - "tag1 · tag2: 카드 태그 (태그1 제공사 · 상품군, 태그2 핵심 혜택 — BENEFIT은 큰 숫자 대신 tag2 표시)"
      - "fixed_services: 고정 포함 서비스 (| 구분)"
      - "choice_a_services · choice_b_services: 택1 그룹 A · B (| 구분)"
      - "applied_prices: 서비스별 적용가 '서비스명=금액' (| 구분) — 요금제별로 상품 가격이 다른 상품 6개"
      - "discounts: 카드 할인 'ALL=30%' / 'A=50%|B=3000' / 'FIXED=10%|A=50%' / 'PRODUCTIVITY_AI=10%|SHOPPING_DELIVERY=50%' (금액은 원, %는 할인율)"
    conversion_rules:
      fixed_max: "고정 포함 · 택1 A/B 칸을 그대로 사용"
      benefit: "통신 요금제는 그룹 칸이 비어 있으므로 '포함된 서비스' 칸의 이름 중 서비스 목록에 있는 것을 fixed_services로 사용 (146개 중 130개 연결, 16개는 연결 서비스 없음 → 추천 후보가 되지 않음)"
      name_alias: "'Claude Max' → 'Claude Max 5x|Claude Max 20x' (시트 서비스 목록은 요금제로 나뉨)"
      card_discount: >
        '30%' · '10,000원' → ALL, 'A 50% / B 3,000원' → A · B 그룹, '고정 10% / A 50%' → FIXED · A,
        'AI 10% / 멤버십 50%' → 카테고리 PRODUCTIVITY_AI · SHOPPING_DELIVERY
      unknown_service: "서비스 목록에 없는 포함 서비스(모아진 · 교보문고 sam · 라이너 · 키네마스터 등)는 그대로 두고 계산에서 0원 (기획 규칙)"
    script: "변환 스크립트는 레포에 두지 않음 (시트 변경 시 같은 규칙으로 다시 변환)"

  model:
    Bundle: "record — name, recommendType, providerType, Integer monthlyPrice, includesText, condition, tag1, tag2, List<String> fixedServices, choiceAServices, choiceBServices, Map<String,Integer> appliedPrices, List<BundleDiscount> discounts"
    BundleDiscount: "record — target(BundleDiscountTarget: ALL / FIXED / A / B / CATEGORY), Category category(CATEGORY일 때), Integer percent, Integer amount (둘 중 하나)"
    enums: "BundleRecommendType(FIXED, MAX, BENEFIT, EXCLUDED), BundleProviderType(PLATFORM, TELECOM, CARD), BundleDiscountTarget"
    method: "Bundle.includes(serviceName): 고정 · 택1 A · 택1 B 중 하나라도 같은 이름이면 true"

  loading:
    repository: "BundleRepository (interface, domain/catalog/domain/repository) — findAll()"
    impl: "TsvBundleRepository (domain/catalog/infrastructure, @Repository) — 앱 시작 시(생성자) TSV를 읽어 불변 리스트로 보관"
    validation: "헤더 · 칸 개수 · enum · 숫자 형식이 틀리면 앱 시작 실패 (서비스 시드와 같은 방식)"
    service: "BundleGetService.findBundlesIncluding(serviceName): EXCLUDED 제외, includes(serviceName)인 상품 — CHECK-005에서 사용"

  db: "변경 없음 (테이블 · 마이그레이션 없음)"

package_structure:
  base: "com.subscribers.gudogging"
  files:
    - "src/main/resources/seed/bundles_seed.tsv (신규, 260행)"
    - "domain/catalog/domain/bundle/Bundle.java · BundleDiscount.java · BundleDiscountTarget.java · BundleRecommendType.java · BundleProviderType.java (신규)"
    - ".claude/references/data-model/domains/catalog/bundle.yaml (신규)"
    - "domain/catalog/domain/repository/BundleRepository.java (신규)"
    - "domain/catalog/infrastructure/TsvBundleRepository.java (신규)"
    - "domain/catalog/domain/service/BundleGetService.java (신규)"

testing_strategy:
  note: >
    테스트 규칙상 UseCase 테스트만 작성 — 이 단계는 UseCase가 없으므로 CHECK-005(추천 계산) UseCase 테스트에서 검증.
    TSV 형식은 앱 기동 테스트(contextLoads)에서 로드 실패 여부로 확인.

notes:
  - "[결정] 번들은 DB 없이 TSV + 메모리 (2026-11-21 합의). ERD에는 '번들은 테이블 없이 seed/bundles_seed.tsv로 관리' 메모"
  - "[결정] 통신 요금제는 '포함된 서비스' 칸으로 연결 (시트에 이미 요금제 이름이 있음)"
  - "[결정] 카드 할인 문구는 위 규칙으로 구조화 (11개 전부 해석 가능)"
  - "[확인 필요] '쿠팡 와우 멤버십'은 FIXED인데 포함 서비스 칸이 비어 있어 후보가 되지 않음"
  - "[다음] CHECK-005: 점검 결과 bundles · maxMonthlySaving 계산 + 응답 필드 변경"
