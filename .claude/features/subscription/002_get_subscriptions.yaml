# Feature Specification
# Status: Draft
# Last Updated: 2026-11-19

meta:
  id: SUBSCRIPTION-002
  title: 구독 목록 조회 (탭 · 정렬 · 요약)
  type: Feature
  author: 1winhyun
  source: "Figma 디자인 작업소 › 구독 관리 › MNG-001 (M-01, M-02, M-04)"
  api_doc: "Notion API 명세서 › 구독 목록 조회 (탭·정렬·요약) — https://app.notion.com/p/f17885ef282182e7951881a12cdf5dc7"
  depends_on:
    - AUTH-001      # JWT 인증 필터, @CurrentUserId
    - USER-001      # UserErrorCode.USER_NOT_FOUND, UserNotFoundException
    - SUBSCRIPTION-001  # SubscriptionResponseCode, SubscriptionErrorCode, SubscriptionGetService

overview:
  summary: >
    구독 관리 화면에서 탭(구독 중 ACTIVE / 구독 종료 ENDED)과 정렬 기준으로 회원의 구독 목록을 조회한다.
    탭 뱃지용 두 탭 개수, 선택한 탭의 월 환산 합계('월 N원' / '월 N원 절약')를 함께 반환한다.
    다음 결제일 · D-n · 월 환산 · 총 지출은 저장하지 않고 계산한다 (ERD 6장).
  user_story: >
    As a 로그인한 회원, I want to 구독 중인 구독과 해지한 구독을 결제일 · 금액 순으로 보기를,
    so that 한 달 구독 지출과 해지로 아낀 금액을 한눈에 파악할 수 있다.
  goals:
    - 탭(status) · 정렬(sort)별 목록 + 두 탭 개수 + 탭 월 환산 합계
    - 다음 결제일 · D-n · 월 환산 · 총 지출 계산 (billing_anchor_on 기준, ERD 6.1 · 6.2 · 6.3)

technical_spec:
  api:
    - method: GET
      path: /api/v1/subscriptions
      summary: 구독 목록 조회 (탭 · 정렬 · 요약)
      auth: Required (Authorization Bearer Access Token)
      request:
        dto: 없음 (Query Params)
        query_params:
          - name: status
            type: SubscriptionStatus
            required: false
            validation: "ACTIVE(구독 중) / ENDED(구독 종료), 없으면 ACTIVE"
          - name: sort
            type: SubscriptionSortType (신규 enum)
            required: false
            validation: >
              NEXT_BILLING_DATE(구독 중 기본) / CANCELED_AT(구독 종료 기본) / AMOUNT_DESC(금액 높은 순).
              없으면 status의 기본값. ACTIVE + CANCELED_AT, ENDED + NEXT_BILLING_DATE 조합은 INVALID_SUBSCRIPTION_SORT
      response:
        dto: SubscriptionListResponse
        http_status: 200 OK
        response_code: "SubscriptionResponseCode.SUBSCRIPTIONS_FOUND (200, HttpStatus.OK, \"구독 목록을 조회했습니다.\")"
        wrapper: CommonResponse<SubscriptionListResponse>
        fields:
          - "count (int): 선택한 탭의 구독 개수"
          - "activeCount (int): 구독 중 개수 — 탭 뱃지 '구독 중 N'"
          - "endedCount (int): 구독 종료 개수 — 탭 뱃지 '구독 종료 N'"
          - "monthlyTotal (long): 선택한 탭 구독의 월 환산 합계 — ACTIVE '월 N원' / ENDED '월 N원 절약'"
          - "subscriptions (List<SubscriptionSummaryResponse>): sort 순서"
        item_dto: SubscriptionSummaryResponse
        item_fields:
          - "subscriptionId (UUID)"
          - "serviceName (String)"
          - "logoUrl (String, nullable): 사전 등록 서비스의 services.logo_url. 직접 입력 · 로고 없음은 null → 클라이언트 기본 이미지"
          - "amount (int): 1회 결제 금액 — 구독 중 탭 우측 금액"
          - "monthlyAmount (long): 월 환산 금액 — 구독 종료 탭 우측 '월 금액' (노션에 없음, 피그마 기준 추가)"
          - "billingCycleValue (int), billingCycleUnit (BillingCycleUnit): '매월 17일' 문구 조합용"
          - "nextBillingDate (LocalDate, nullable): 다음 결제일 (오늘 포함 이후 첫 결제일). ENDED면 null"
          - "dDay (Integer, nullable): nextBillingDate − 오늘 (오늘이면 0). ENDED면 null"
          - "canceledAt (LocalDate, nullable): 해지일 (subscriptions.canceled_on). ACTIVE면 null"
          - "totalPaidAmount (Long, nullable): 총 지출 — 등록일 ~ 해지일 결제일마다 그때 조건의 금액 합계 (결제 조건 이력 포함, [변경 2026-11-19] ERD v1.7). ACTIVE면 null"
        factory: "SubscriptionListResponse.of(SubscriptionStatus, List<Subscription> tabSubscriptions, int activeCount, int endedCount, LocalDate today), SubscriptionSummaryResponse.from(Subscription, LocalDate today)"
        display_note: "'매월 17일 · D-1', '10월 16일 해지 · 총 지출 47,600원', 빈 상태(M-01) 문구는 클라이언트가 조합"
        example: |
          {
            "code": 200,
            "message": "구독 목록을 조회했습니다.",
            "data": {
              "count": 1, "activeCount": 1, "endedCount": 1, "monthlyTotal": 13500,
              "subscriptions": [
                { "subscriptionId": "3f2b...", "serviceName": "넷플릭스", "logoUrl": "https://.../netflix.png",
                  "amount": 13500, "monthlyAmount": 13500, "billingCycleValue": 1, "billingCycleUnit": "MONTH",
                  "nextBillingDate": "2026-12-01", "dDay": 14, "canceledAt": null, "totalPaidAmount": null }
              ]
            }
          }

  data_flow:
    - step: 1
      layer: Presentation (SubscriptionController)
      action: "@CurrentUserId UUID userId, @RequestParam(required = false) SubscriptionStatus status, @RequestParam(required = false) SubscriptionSortType sort → SubscriptionUseCase.getSubscriptions(userId, status, sort) → CommonResponse.success(SubscriptionResponseCode.SUBSCRIPTIONS_FOUND, data)"
    - step: 2
      layer: UseCase (SubscriptionUseCase.getSubscriptions)
      action: "status 기본값(ACTIVE) · sort 기본값 결정 → 조합 검사 → 회원 조회 → 회원 구독 전체 조회 → today = LocalDate.now() → status로 분리(두 탭 개수) → 선택 탭 정렬 · 월 환산 합계 → SubscriptionListResponse"
      transaction: "readOnly (클래스 기본)"
    - step: 3
      layer: UseCase
      action: "ACTIVE + CANCELED_AT 또는 ENDED + NEXT_BILLING_DATE면 InvalidSubscriptionSortException (회원 조회 전)"
    - step: 4
      layer: Domain Service (UserGetService)
      action: "findUserById(userId) — 없으면 UserNotFoundException"
    - step: 5
      layer: Domain Service (SubscriptionGetService)
      action: "findSubscriptions(User) — deleted = false, serviceCatalog fetch join (로고 N+1 방지). 두 탭 개수가 필요하므로 status 구분 없이 1회 조회"
    - step: 6
      layer: Domain (Subscription) — 계산 메서드 추가 (ERD 4.4 도메인 메서드)
      action: >
        monthlyAmount(): 월 환산 (ERD 6.1, 원 단위 반올림 HALF_UP) ·
        nextBillingOn(LocalDate base): 현재 조건 billing_anchor_on + k × 주기(k ≥ 0) 중 base 이상인 가장 이른 날짜 — 입력한 다음 결제일이 그대로 다음 결제일 ([변경 2026-11-19] ERD 6.2 v1.7, 음수 k · billing_anchor_changed_on 제거) ·
        startedOn(): createdAt 날짜 ·
        [변경 2026-11-19] 지금까지 결제(구독 종료 탭 totalPaidAmount)는 domain/subscription/domain/billing/BillingSchedule.of(subscription, 결제 조건 이력).totalPaidAmount(today) — 조건마다 등록일 ~ (ENDED면 canceledOn / ACTIVE면 today) 결제 횟수(BillingCycle.countBetween, 반복 없이 인덱스 차이) × 그때 금액의 합.
        결제 조건 이력은 구독 종료 탭일 때만 SubscriptionBillingHistoryGetService.findBillingHistoriesBySubscriptions(탭 구독)로 한 번에 조회해 구독 ID별로 묶는다 (N+1 방지)
    - step: 7
      layer: UseCase — 정렬
      action: >
        NEXT_BILLING_DATE: nextBillingOn(today) 오름차순 → amount 내림차순 /
        CANCELED_AT: canceledOn 내림차순(최근 해지 먼저) → monthlyAmount() 내림차순 /
        AMOUNT_DESC: ACTIVE는 amount 내림차순 → nextBillingOn 오름차순, ENDED는 monthlyAmount() 내림차순 → canceledOn 내림차순 (각 탭 우측에 보이는 금액 기준)

  database:
    entities:
      - name: Subscription
        action: Read
        table: subscriptions
        fields: "status, amount, billing_cycle_value, billing_cycle_unit, billing_anchor_on, canceled_on, created_at, name"
      - name: SubscriptionBillingHistory
        action: "Read — [변경 2026-11-19] 구독 종료 탭만, subscription_id IN (...) 1회"
        table: subscription_billing_histories
      - name: ServiceCatalog
        action: Read (fetch join)
        table: services
        fields: "logo_url"
      - name: User
        action: Read
        table: users

  error_codes:
    domain_range:
      subscription: "404xx (SUBSCRIPTION-001에서 할당)"
    codes:
      - code: 40403
        enum: SubscriptionErrorCode.INVALID_SUBSCRIPTION_SORT
        status: 400 Bad Request
        message: "구독 상태에 맞지 않는 정렬 기준입니다."
        trigger: "status=ACTIVE&sort=CANCELED_AT 또는 status=ENDED&sort=NEXT_BILLING_DATE"
    reused:
      - "40201 UserErrorCode.USER_NOT_FOUND (404)"
      - "40005 / 40103 / 40104 — 인증 실패 (AUTH-001)"
      - "잘못된 enum 값(status · sort) — MethodArgumentTypeMismatchException은 GlobalExceptionHandler에 핸들러가 없어 Spring 기본 400 (notes 참고)"
    exceptions:
      - "subscription/application/exception/InvalidSubscriptionSortException (신규)"

  changes_to_existing_code:
    - target: "SubscriptionRepository"
      change: "findAllWithServiceByUser(User) 추가 — @Query: select s from Subscription s left join fetch s.serviceCatalog where s.user = :user and s.deleted = false"
    - target: "SubscriptionGetService"
      change: "findSubscriptions(User) 추가"
    - target: "Subscription (엔티티)"
      change: "계산 메서드 추가: monthlyAmount(), nextBillingOn(LocalDate), startedOn(), billingDatesBetween(LocalDate, LocalDate), paidCount(LocalDate), totalPaidAmount(LocalDate) — 컬럼 변경 없음. [변경 2026-11-19] billingDatesBetween · paidCount · totalPaidAmount는 BillingSchedule로 이동, billingCycle() 추가 (ERD v1.7)"
    - target: "SubscriptionErrorCode"
      change: "INVALID_SUBSCRIPTION_SORT(40403) 추가 + system-design.yaml · coding-style.yaml 에러코드 목록 갱신"
    - target: "SubscriptionResponseCode"
      change: "SUBSCRIPTIONS_FOUND(200) 추가"

  security_config:
    note: "변경 없음 — anyRequest().authenticated()로 보호됨"

  validation_rules:
    - "본인 구독만 조회 — userId는 Access Token에서만 받는다"
    - "deleted = true 구독은 제외"
    - "월 환산: MONTH n → amount / n · YEAR n → amount / (12n) · WEEK n → amount × 52 / (12n) · DAY n → amount × 365 / (12n), 구독별로 원 단위 반올림 후 합산"
    - "다음 결제일: MONTH · YEAR는 anchor.plusMonths(k × n)으로 매번 기준일에서 계산해 1/31 → 2/28 → 3/31 유지"
    - "총 지출: 등록일(created_at 날짜) ~ canceled_on 양끝 포함 결제일 수 × amount"
    - "구독이 하나도 없으면 count · activeCount · endedCount · monthlyTotal 0, 빈 배열 (M-01은 클라이언트가 표시)"

package_structure:
  base: "com.subscribers.gudogging"
  subscription:
    - "domain/subscription/presentation/SubscriptionController.java (수정 — GET 추가)"
    - "domain/subscription/presentation/response/SubscriptionResponseCode.java (수정)"
    - "domain/subscription/application/usecase/SubscriptionUseCase.java (수정 — getSubscriptions)"
    - "domain/subscription/application/dto/request/SubscriptionSortType.java (신규, enum — 값만)"
    - "domain/subscription/application/dto/response/SubscriptionListResponse.java (신규, record + of())"
    - "domain/subscription/application/dto/response/SubscriptionSummaryResponse.java (신규, record + from(Subscription, LocalDate))"
    - "domain/subscription/application/exception/SubscriptionErrorCode.java (수정)"
    - "domain/subscription/application/exception/InvalidSubscriptionSortException.java (신규)"
    - "domain/subscription/domain/entity/Subscription.java (수정 — 계산 메서드)"
    - "domain/subscription/domain/service/SubscriptionGetService.java (수정)"
    - "domain/subscription/domain/repository/SubscriptionRepository.java (수정)"

testing_strategy:
  # SubscriptionUseCaseTest only (JUnit5 + Mockito) — @Nested GetSubscriptions
  # Mock: UserGetService, SubscriptionGetService
  # Subscription은 정적 팩토리로 생성, id · createdAt은 ReflectionTestUtils로 지정 (@PrePersist로 채워지는 값)
  # today는 LocalDate.now() 기준 상대 날짜로 픽스처 구성
  happy_path:
    - "getSubscriptions: status · sort가 없으면 구독 중 탭을 다음 결제일 순으로 반환하고, 두 탭 개수와 구독 중 월 환산 합계를 함께 반환한다"
    - "getSubscriptions: 구독 중 탭은 다음 결제일 오름차순, 같으면 금액 높은 순으로 정렬한다"
    - "getSubscriptions: 구독 종료 탭(sort 없음)은 해지일 최근 순으로 정렬하고 월 환산 합계를 '절약' 금액으로 반환한다"
    - "getSubscriptions: AMOUNT_DESC면 구독 중은 결제 금액, 구독 종료는 월 환산 금액이 높은 순으로 정렬한다"
    - "getSubscriptions: 기준일이 지난 구독은 오늘 이후 첫 결제일과 D-n을 반환하고, 오늘이 결제일이면 D-0이다"
    - "getSubscriptions: 월말 기준일(1월 31일) 매월 구독은 2월 말일, 3월 31일 순으로 결제일을 계산한다"
    - "getSubscriptions: 결제 주기별(DAY · WEEK · MONTH n · YEAR) 월 환산 금액을 원 단위 반올림해 합산한다"
    - "getSubscriptions: 구독 종료 항목은 해지일과 등록일부터 해지일까지(양끝 포함) 결제 횟수 × 금액을 총 지출로 반환하고 다음 결제일 · D-n은 null이다"
    - "getSubscriptions: 직접 입력 서비스는 logoUrl을 null로 반환한다"
    - "getSubscriptions: 구독이 없으면 개수 0, 합계 0, 빈 목록을 반환한다"
  edge_cases:
    - "getSubscriptions: 구독 중 탭에 CANCELED_AT, 구독 종료 탭에 NEXT_BILLING_DATE 정렬을 요청하면 INVALID_SUBSCRIPTION_SORT 예외를 던진다"
    - "getSubscriptions: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND 예외를 던진다"

notes:
  - "기준: Figma 우선, 그다음 Notion API 명세서 (2026-11-17 대조). 경로 · 쿼리 · 응답 필드명은 Notion을 따름"
  - "[Notion 수정 필요] 구독 종료 탭 우측 금액: Figma 설명은 '월 금액'(월 환산), Notion은 amount만 있음 → monthlyAmount 필드 추가, 구독 종료 탭 AMOUNT_DESC는 monthlyAmount 기준"
  - "[Notion 보완] 정렬과 탭 조합이 맞지 않을 때 동작이 Notion에 없음 → 40403 INVALID_SUBSCRIPTION_SORT(400)로 정의"
  - "결정 (2026-11-17): '오늘'은 LocalDate.now() (JVM 기본 시간대). 배포 서버가 UTC면 KST 00~09시에 하루 어긋남 → 배포 JVM 시간대를 Asia/Seoul로 맞추는 것은 별도 작업"
  - "[가정] '해지일 순'은 최근 해지가 먼저 (canceledOn 내림차순)"
  - "[가정] 결제일 계산은 Subscription 엔티티 메서드 (ERD 4.4 도메인 메서드, Rich Model). 엔티티 문서(subscription.yaml)는 구현 후 /docs로 갱신"
  - "[확인 필요] 쿼리 파라미터 enum 형식 오류(MethodArgumentTypeMismatchException)를 40001 INVALID_ARGUMENT로 통일하려면 GlobalExceptionHandler 핸들러 추가가 필요 — 별도 작업 (SUBSCRIPTION-004 · 005 공통)"
  - "탭 표기는 '구독 종료'로 통일 (Figma · Notion 공통: 기존 '지난 구독' 표기 대체)"
  - "범위 외: 탭 전환 · 정렬 드롭다운 · 플로팅 '+'(A-01 이동) · 더보기 → 삭제 모드 진입은 클라이언트 처리. 구독 삭제는 SUBSCRIPTION-003"
