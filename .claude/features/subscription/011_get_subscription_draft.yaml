# Feature Specification
# Status: Draft
# Last Updated: 2026-11-20 (A-03 / A-03s 복원 반영 — Figma A-01s '중단한 화면으로 이동')

meta:
  id: SUBSCRIPTION-011
  title: 구독 등록 임시저장 불러오기
  type: Feature
  author: 1winhyun
  source: >
    Figma 디자인 작업소 (9cBKdlwBBUqHndoKPsrDfX) › 구독 등록(직접 등록 및 공통 화면, section 1531:16132) —
    SUB-001 A-01 '5. 등록 중이던 정보 확인' (텍스트 1531:13435),
    SUB-004 A-01s '등록 중이던 구독 불러오기 팝업' 설명 1~6 (Description 1531:13705, 화면 1531:13733),
    SUB-002 A-04 '3. 선택한 구독 목록 — 사전 등록 서비스는 지정 이미지, 직접 입력 서비스는 기본 이미지',
    A-03 '※ 필수 정보 일부만 입력한 상태에서 임시 저장 불가능', A-03 / A-03s '1. 상단 헤더' (Description 1531:13550).
    Notion API 명세서 '구독 등록 임시저장 불러오기' (GET /api/v1/subscriptions/drafts)
  depends_on:
    - AUTH-001          # JWT 인증 필터, @CurrentUserId
    - USER-001          # UserErrorCode.USER_NOT_FOUND, UserNotFoundException
    - CATALOG-001       # ServiceCatalogGetService.findActiveServicesByIds, ServiceCatalog.logoUrl
    - SUBSCRIPTION-009  # SubscriptionDraft · SubscriptionDraftItem · SubscriptionDraftStep, SubscriptionDraftService, Redis key (이 스펙에서 저장 요청 확장)
    - SUBSCRIPTION-010  # '새로 등록하기' → DELETE (짝 API)

overview:
  summary: >
    구독 추가 화면(A-01) 진입 시 회원의 구독 등록 임시저장(Redis subscription-draft:{userId})을 조회한다.
    있으면 불러오기 팝업(A-01s)을 띄우고 '불러오기' 때 등록을 중단한 화면(A-02 / A-04 / A-03 / A-03s)으로 이동해
    저장된 목록 · 결제 정보로 복원하며, 없으면 data = null을 내려 A-01을 바로 표시한다.
    중단한 화면이 A-03 / A-03s여도 복원할 수 있도록 저장 API(SUBSCRIPTION-009)의 lastStep에 입력 화면 값과
    입력 · 수정 중이던 항목 순번(editingItemIndex)을 추가한다. 사전 등록 서비스 항목에는 A-04 표시용 logoUrl을 함께 내려준다.
  user_story: >
    As a 구독을 직접 등록하다 그만둔 회원, I want to 구독 추가 화면에 다시 들어왔을 때 등록 중이던 구독을 불러오기를,
    so that 선택한 서비스와 입력한 결제 정보를 다시 입력하지 않고 멈췄던 화면부터 이어서 등록할 수 있다.
  goals:
    - 회원당 1건인 임시저장을 저장한 그대로(lastStep · editingItemIndex · items 순서 · 결제 정보 · savedAt) 반환
    - 임시저장이 없으면 200 + data = null (Notion) → A-01 바로 표시 (Figma A-01 / A-01s '등록 중이던 정보가 없는 경우')
    - Figma A-01s '이전에 등록을 중단한 화면으로 이동하여 이어서 작성' — A-02 · A-04 · A-03 · A-03s 모두 복원 지점
    - Figma A-03 '필수 정보 일부만 입력한 상태에서 임시 저장 불가능' 유지 — A-03 / A-03s 복원 시 입력값은 저장된 항목 값만
    - A-04 복원 화면 그대로 — 사전 등록 서비스는 지정 이미지(logoUrl), 직접 입력 서비스는 기본 이미지(null) (Figma A-04)

technical_spec:
  restore_rule:
    # 클라이언트가 응답으로 화면을 복원하는 규칙 (Figma A-01s '4. 불러오기 버튼' · '6. 임시 등록 정보 처리')
    - "lastStep = SELECT_SERVICES → A-02, items의 사전 등록 서비스를 선택 칩 · 체크 상태로 복원 (editingItemIndex = null). 입력한 결제 정보 · 직접 입력 항목도 그대로 들고 있다가 A-04로 넘어갈 때 표시 — Figma A-02 'A-04에서 진입한 경우 이전 확인 목록과 입력값 유지', A-04 '뒤로가기 시 기존에 선택한 서비스 목록 및 입력한 결제 정보 유지'"
    - "lastStep = CONFIRM_SUBSCRIPTIONS → A-04, items를 선택한 구독 목록으로 복원 (editingItemIndex = null)"
    - "lastStep = INPUT_SUBSCRIPTION + editingItemIndex = n → A-04 목록을 items로 복원한 뒤 items[n]의 입력 화면으로 이동 — serviceId 있으면 A-03, null이면 A-03s. 입력 필드는 items[n]의 저장값(결제 정보 미입력이면 Figma 기본값)"
    - "lastStep = INPUT_SUBSCRIPTION + editingItemIndex = null → A-02를 items로 복원(SELECT_SERVICES와 같음)한 뒤 새 직접 입력(A-03s, 빈 서비스명)으로 이동 — A-02s '직접 입력하기'로 들어간 경우라 아래 화면은 A-02 (Figma A-02s '3. 직접 입력하기', A-03s '뒤로가기 시 이전 화면으로 이동', A-03s '저장 후 A-04로 이동')"
    - "A-03 / A-03s에서 저장하지 않은 입력값은 복원하지 않음 — Figma A-03 '필수 정보 일부만 입력한 상태에서 임시 저장 불가능'"

  api:
    - method: GET
      path: /api/v1/subscriptions/drafts
      summary: 구독 등록 임시저장 불러오기
      auth: Required (Authorization Bearer Access Token)
      request:
        dto: "없음 (Query · Path · Body 없음)"
      response:
        dto: SubscriptionDraftResponse
        http_status: 200 OK
        response_code: "SubscriptionResponseCode.SUBSCRIPTION_DRAFT_FOUND (200, HttpStatus.OK, \"임시저장을 조회했습니다.\")"
        wrapper: "CommonResponse<SubscriptionDraftResponse> — 임시저장이 없으면 CommonResponse.success(SUBSCRIPTION_DRAFT_FOUND, null) (data = null)"
        fields:
          - name: savedAt
            type: LocalDateTime
            description: "마지막 저장 시각 (ISO 8601, 예: 2026-11-07T16:30:00) — 저장값 그대로"
          - name: lastStep
            type: SubscriptionDraftStep
            description: >
              등록을 중단한 화면. SELECT_SERVICES(A-02 서비스 선택) / CONFIRM_SUBSCRIPTIONS(A-04 선택한 구독 확인) /
              INPUT_SUBSCRIPTION(A-03 · A-03s 구독 정보 입력 — 이 스펙에서 추가). 복원 규칙은 restore_rule
          - name: editingItemIndex
            type: Integer
            description: >
              [Notion에 없음 — Figma A-01s 기준 추가] lastStep = INPUT_SUBSCRIPTION일 때 입력 · 수정 중이던 항목의 items 순번(0부터).
              null이면 새 직접 입력(A-03s). lastStep이 SELECT_SERVICES / CONFIRM_SUBSCRIPTIONS면 항상 null
          - name: items
            type: List<SubscriptionDraftItemResponse>
            description: "임시저장한 구독 목록 — 저장한 순서 그대로 (A-02 칩 · A-04 목록 순서)"
        item_dto: SubscriptionDraftItemResponse
        item_fields:
          - name: serviceId
            type: UUID
            description: "사전 등록 서비스 ID. 직접 입력 서비스면 null"
          - name: serviceName
            type: String
            description: "서비스명 (저장값 그대로)"
          - name: logoUrl
            type: String
            description: >
              [Notion에 없음 — Figma A-04 기준 추가] 서비스 로고 URL. null이면 기본 이미지.
              직접 입력 서비스, 로고 미등록(logo_url NULL), 저장 후 비활성 · 삭제된 서비스는 null.
              기존 구독 응답(SubscriptionResponse · SubscriptionSummaryResponse · SubscriptionDetailResponse)의 logoUrl과 같은 의미
          - name: category
            type: Category
            description: "VIDEO_OTT / MUSIC / SHOPPING_DELIVERY / EDUCATION / PRODUCTIVITY_AI / ENTERTAINMENT / ETC. 결제 정보 미입력이면 null"
          - name: amount
            type: Integer
            description: "결제 금액 (원). 결제 정보 미입력이면 null"
          - name: billingCycleValue
            type: Integer
            description: "결제 주기 숫자. 결제 정보 미입력이면 null"
          - name: billingCycleUnit
            type: BillingCycleUnit
            description: "DAY / WEEK / MONTH / YEAR. 결제 정보 미입력이면 null"
          - name: nextBillingDate
            type: LocalDate
            description: "다음 결제일 (yyyy-MM-dd). 결제 정보 미입력이면 null. 저장 후 날짜가 지나 과거일 수 있음 (notes 참고)"
          - name: paymentMethod
            type: PaymentMethod
            description: "WEB_DIRECT / APP_STORE / GOOGLE_PLAY. 결제 정보 미입력이면 null"
        payment_info_rule: >
          결제 정보 6개(category, amount, billingCycleValue, billingCycleUnit, nextBillingDate, paymentMethod)는 저장 규칙(SUBSCRIPTION-009) 그대로 —
          사전 등록 서비스: 6개 모두 null(A-04 '결제 정보 입력 필요') 또는 모두 값 있음('입력 완료'), 직접 입력 서비스: 6개 모두 값 있음.
          불러오기는 검사 · 변환 없이 저장값을 그대로 내려준다
        factory: >
          SubscriptionDraftResponse.of(SubscriptionDraft subscriptionDraft, Map<UUID, String> logoUrlsByServiceId),
          SubscriptionDraftItemResponse.of(SubscriptionDraftItem item, String logoUrl)
          (추가 인자가 있어 of — SubscriptionDetailResponse.of · SubscriptionListResponse.of와 같은 규칙)
        example: |
          {
            "code": 200,
            "message": "임시저장을 조회했습니다.",
            "data": {
              "savedAt": "2026-11-20T16:30:00",
              "lastStep": "INPUT_SUBSCRIPTION",
              "editingItemIndex": 1,
              "items": [
                { "serviceId": "5e1c9a07-5a4d-4e7b-9c21-000000000001", "serviceName": "Netflix",
                  "logoUrl": "https://cdn.example.com/logos/netflix.png",
                  "category": "VIDEO_OTT", "amount": 17000, "billingCycleValue": 1, "billingCycleUnit": "MONTH",
                  "nextBillingDate": "2026-12-01", "paymentMethod": "WEB_DIRECT" },
                { "serviceId": "5e1c9a07-5a4d-4e7b-9c21-000000000002", "serviceName": "유튜브 프리미엄",
                  "logoUrl": null,
                  "category": null, "amount": null, "billingCycleValue": null, "billingCycleUnit": null,
                  "nextBillingDate": null, "paymentMethod": null },
                { "serviceId": null, "serviceName": "동네 헬스장",
                  "logoUrl": null,
                  "category": "ETC", "amount": 50000, "billingCycleValue": 1, "billingCycleUnit": "MONTH",
                  "nextBillingDate": "2026-11-25", "paymentMethod": "WEB_DIRECT" }
              ]
            }
          }
          (→ A-04 목록 3개 복원 후 '유튜브 프리미엄' A-03으로 이동, 입력 필드는 미입력 상태 = Figma 기본값)
        example_empty: |
          {
            "code": 200,
            "message": "임시저장을 조회했습니다.",
            "data": null
          }

  save_api_extension:
    # SUBSCRIPTION-009 PUT /api/v1/subscriptions/drafts 확장 (A-03 / A-03s 복원 지점 저장) — 이 스펙 구현 때 함께 반영
    request_dto: SaveSubscriptionDraftRequest
    changed_fields:
      - name: lastStep
        type: SubscriptionDraftStep
        required: true
        validation: "@NotNull. 값 추가: INPUT_SUBSCRIPTION (A-03 · A-03s 구독 정보 입력)"
      - name: editingItemIndex
        type: Integer
        required: false
        validation: >
          신규. lastStep = INPUT_SUBSCRIPTION일 때 입력 · 수정 중이던 항목의 items 순번(0부터), 새 직접 입력이면 null.
          @AssertTrue isEditingItemIndexValid() (@JsonIgnore, SubscriptionDraftItemRequest와 같은 방식),
          message "editingItemIndex는 구독 정보 입력 화면에서만 items 범위 안의 순번으로 보낼 수 있습니다." —
          lastStep != INPUT_SUBSCRIPTION이면 null이어야 하고, INPUT_SUBSCRIPTION이면 null 또는 0 ≤ editingItemIndex < items.size()
          (items가 null이면 true — @NotEmpty가 따로 검사)
    unchanged: "items 규칙 · 결제 정보 묶음 규칙 · serviceId 중복 검사(40402) · 응답 savedAt — 009 그대로"
    client_call_timing: >
      [가정] 009의 저장 시점에 A-03 / A-03s 이동을 추가 — A-04에서 항목을 눌러 A-03 / A-03s로 들어갈 때(INPUT_SUBSCRIPTION + 그 항목 순번),
      A-02s '직접 입력하기'로 A-03s에 들어갈 때(INPUT_SUBSCRIPTION + null),
      A-03 / A-03s에서 A-04로 돌아올 때 — '저장하기' · 미저장 입력 없이 뒤로가기 · A-03c '나가기' (CONFIRM_SUBSCRIPTIONS),
      새 직접 입력 A-03s에서 뒤로가기로 A-02 / A-02s에 돌아올 때(SELECT_SERVICES).
      A-03 / A-03s 키 입력마다 호출하지 않음 (일부 입력 저장 불가)
    example: |
      {
        "lastStep": "INPUT_SUBSCRIPTION",
        "editingItemIndex": 1,
        "items": [ ...009 예시와 같은 항목 3개... ]
      }

  data_flow:
    - step: 1
      layer: Presentation (SubscriptionController)
      action: >
        @GetMapping("/drafts") — @CurrentUserId UUID userId → SubscriptionUseCase.getSubscriptionDraft(userId)
        → CommonResponse.success(SubscriptionResponseCode.SUBSCRIPTION_DRAFT_FOUND, response) (response가 null이면 data = null)
    - step: 2
      layer: UseCase (SubscriptionUseCase.getSubscriptionDraft)
      action: >
        회원 확인 → 임시저장 조회 → 없으면 null 반환 →
        있으면 serviceId != null 인 항목의 serviceId 모아 로고 조회 → SubscriptionDraftResponse.of(draft, logoUrlsByServiceId)
      transaction: "false (조회 — 클래스 @Transactional(readOnly = true) 적용, 메서드 어노테이션 없음)"
    - step: 3
      layer: Domain Service (UserGetService)
      action: "findUserById(userId) — 없거나 탈퇴했으면 UserNotFoundException (SUBSCRIPTION-009 · 010과 같은 회원 확인)"
    - step: 4
      layer: Domain Service (SubscriptionDraftService — 수정)
      action: "findDraft(UUID userId) → Optional<SubscriptionDraft> (SubscriptionDraftRepository.findByUserId)"
    - step: 5
      layer: Infrastructure (RedisSubscriptionDraftRepository — 수정)
      action: >
        findByUserId: StringRedisTemplate.opsForValue().get('subscription-draft:{userId}') → null이면 Optional.empty(),
        있으면 jsonMapper.readValue(json, SubscriptionDraft.class) (save의 JsonMapper 직렬화와 짝).
        이 스펙 이전에 저장된 값(editingItemIndex 없음)은 editingItemIndex = null로 읽힘
    - step: 6
      layer: Domain Service (ServiceCatalogGetService — 변경 없음, 재사용)
      action: >
        findActiveServicesByIds(serviceIds) → Map<UUID, String> (ServiceCatalog::getId → getLogoUrl).
        serviceIds가 비어 있으면 조회하지 않음 (UseCase findServicesById와 같은 처리).
        개수가 달라도(저장 후 비활성 · 삭제) 예외 없음 — 해당 항목 logoUrl = null.
        logo_url이 NULL인 서비스는 Map에 넣지 않음 (Collectors.toMap은 null 값 불가) → 결과적으로 logoUrl = null
    - step: 7
      layer: "UseCase (SubscriptionUseCase.saveSubscriptionDraft — 수정, PUT)"
      action: "SubscriptionDraft.of(userId, request.lastStep(), request.editingItemIndex(), items, LocalDateTime.now()) — editingItemIndex 그대로 저장. 나머지 흐름은 009 그대로"

  database:
    entities: []
    note: "MySQL 변경 없음"
    redis:
      key: "subscription-draft:{userId}"
      value: "SubscriptionDraft JSON { userId, lastStep, editingItemIndex, items[], savedAt } — editingItemIndex 추가"
      action: "GET (불러오기는 읽기만 — 삭제 · 갱신 없음, 불러오기 후에도 임시저장 유지)"
    reads:
      - name: User
        action: Read
        table: users
      - name: ServiceCatalog
        action: Read
        table: services
        fields: "id, logo_url (is_active = true, deleted = false)"

  error_codes:
    new: "없음"
    reused:
      - "40201 UserErrorCode.USER_NOT_FOUND (404) — 회원이 없거나 탈퇴 (GET · PUT)"
      - "40001 INVALID_ARGUMENT (400) — PUT editingItemIndex 규칙 위반 (isEditingItemIndexValid)"
      - "40002 JSON_PARSE_ERROR (400) — PUT 잘못된 lastStep 값"
      - "40005 / 40103 / 40104 — 인증 실패 (AUTH-001)"
    not_error: "임시저장 없음은 에러가 아님 — 200 + data = null (Notion)"

  changes_to_existing_code:
    - target: "SubscriptionDraftStep"
      change: "INPUT_SUBSCRIPTION 추가 (A-03 · A-03s 구독 정보 입력). 클래스 주석에 값별 화면 갱신"
    - target: "SubscriptionDraft"
      change: "editingItemIndex(Integer) 필드 추가 — lastStep 다음 위치. of(userId, lastStep, editingItemIndex, items, savedAt)로 시그니처 변경. 클래스 주석 'A-04 목록과 마지막 화면' → '마지막 화면 · 입력 중이던 항목'"
    - target: "SaveSubscriptionDraftRequest (SUBSCRIPTION-009)"
      change: "editingItemIndex(Integer) 추가 + @AssertTrue @JsonIgnore isEditingItemIndexValid() (save_api_extension). 클래스 주석 갱신"
    - target: "SubscriptionUseCase.saveSubscriptionDraft (SUBSCRIPTION-009)"
      change: "SubscriptionDraft.of(...)에 request.editingItemIndex() 전달"
    - target: "SubscriptionController.saveSubscriptionDraft Swagger (PUT)"
      change: "요청값 lastStep에 INPUT_SUBSCRIPTION 추가, editingItemIndex 설명 추가, 호출 시점에 A-03 / A-03s 이동 추가"
    - target: "SubscriptionDraftRepository"
      change: "Optional<SubscriptionDraft> findByUserId(UUID userId) 추가 (SUBSCRIPTION-009 '조회는 불러오기 스펙에서 추가')"
    - target: "RedisSubscriptionDraftRepository"
      change: "findByUserId 구현 (opsForValue().get + jsonMapper.readValue)"
    - target: "SubscriptionDraftService"
      change: "findDraft(UUID userId) 추가 — Optional 반환 (UserGetService.findUserById와 같은 형식)"
    - target: "SubscriptionResponseCode"
      change: "SUBSCRIPTION_DRAFT_FOUND(200, HttpStatus.OK, \"임시저장을 조회했습니다.\") 추가"
    - target: "SubscriptionUseCase"
      change: "getSubscriptionDraft(UUID userId) 추가 — 조회 메서드라 @Transactional 없음. 반환 SubscriptionDraftResponse (임시저장이 없으면 null)"
    - target: "SubscriptionController"
      change: >
        @GetMapping("/drafts") getSubscriptionDraft 추가 (+ Swagger @Operation — 요청값 '없음', 응답값에 'data = null(임시저장 없음)' ·
        lastStep 3개 값 · editingItemIndex · logoUrl 명시). 기존 @GetMapping("/{subscriptionId}")와 겹치지 않음 — Spring은 리터럴 경로 '/drafts'를 패턴보다 우선 매칭
    - target: "SubscriptionUseCaseTest (기존 SaveSubscriptionDraft)"
      change: "SaveSubscriptionDraftRequest 생성자에 editingItemIndex 인자 추가 (기존 시나리오는 null)"
    - target: ".claude/features/subscription/009_save_subscription_draft.yaml (구현 시)"
      change: "lastStep 값 · editingItemIndex · 저장 시점 · notes의 'lastStep은 A-02 · A-04 두 값만' 결정을 SUBSCRIPTION-011로 변경했다고 갱신"
    - target: "SubscriptionDraftItem · ServiceCatalogGetService · SubscriptionDraftSaveResponse"
      change: "변경 없음"

  security_config:
    note: "변경 없음 — anyRequest().authenticated()로 보호됨"

  validation_rules:
    - "본인 임시저장만 조회 · 저장 — userId는 Access Token에서만 받는다 (경로 · 쿼리로 받지 않음)"
    - "GET: 임시저장이 없으면 200 + data = null (404 아님)"
    - "GET: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND"
    - "GET: 저장값을 검사 · 변환하지 않고 그대로 반환 — items 순서 유지, 결제 정보 null 그대로, 지난 nextBillingDate도 그대로"
    - "GET: logoUrl은 조회 시점의 서비스 로고 (임시저장에 저장하지 않음). 직접 입력 · 로고 없음 · 비활성 · 삭제 서비스는 null"
    - "GET: 불러오기는 임시저장을 지우거나 바꾸지 않음 — 삭제는 SUBSCRIPTION-010 · 등록 성공(SUBSCRIPTION-001)만"
    - "PUT: editingItemIndex는 lastStep = INPUT_SUBSCRIPTION일 때만 — null(새 직접 입력) 또는 items 범위 안 순번. 다른 lastStep이면 null"
    - "PUT: A-03 / A-03s의 저장하지 않은 입력값은 받지 않음 (요청 필드 없음) — Figma A-03 '필수 정보 일부만 입력한 상태에서 임시 저장 불가능'"

