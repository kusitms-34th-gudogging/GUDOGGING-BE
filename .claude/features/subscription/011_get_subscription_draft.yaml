    - "application/dto/request/SaveSubscriptionDraftRequest.java (수정 — editingItemIndex + isEditingItemIndexValid)"
    - "application/dto/response/SubscriptionDraftResponse.java (신규, record + of(SubscriptionDraft, Map<UUID, String>))"
    - "application/dto/response/SubscriptionDraftItemResponse.java (신규, record + of(SubscriptionDraftItem, String))"
