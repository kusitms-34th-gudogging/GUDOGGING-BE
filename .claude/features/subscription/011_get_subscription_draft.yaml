testing_strategy:
  # SubscriptionUseCaseTest only (JUnit5 + Mockito)
  # Mock: UserGetService, SubscriptionDraftService, ServiceCatalogGetService
  # SubscriptionDraft · SubscriptionDraftItem은 of()로 생성, ServiceCatalog는 ServiceCatalog.create(...)로 생성 (기존 테스트 방식)
  # editingItemIndex 범위 규칙은 DTO @AssertTrue라 테스트하지 않음 (UseCase 테스트만 — 009의 @AssertTrue와 같은 처리)
  happy_path:
    - "getSubscriptionDraft: 임시저장이 있으면 savedAt · lastStep과 사전 등록 입력 완료 · 사전 등록 미입력 · 직접 입력 항목을 저장한 순서대로 반환한다"
    - "getSubscriptionDraft: 사전 등록 서비스 항목은 서비스 로고 URL을, 직접 입력 서비스 항목은 logoUrl null을 반환한다"
    - "getSubscriptionDraft: 구독 정보 입력 화면에서 중단했으면 INPUT_SUBSCRIPTION과 입력 중이던 항목 순번을 반환한다"
    - "saveSubscriptionDraft: 구독 정보 입력 화면(INPUT_SUBSCRIPTION)과 입력 중이던 항목 순번을 함께 저장한다"
  edge_cases:
    - "getSubscriptionDraft: 임시저장이 없으면 null을 반환하고 서비스를 조회하지 않는다"
    - "getSubscriptionDraft: 저장 후 비활성 · 삭제되어 조회되지 않는 서비스 항목은 예외 없이 logoUrl null로 반환한다"
    - "getSubscriptionDraft: 직접 입력 항목만 있으면 서비스를 조회하지 않는다"
    - "getSubscriptionDraft: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND 예외를 던지고 임시저장을 조회하지 않는다"
  note: "Redis 직렬화 · 역직렬화 왕복(editingItemIndex 포함, 이전 형식 값 → null)은 UseCase 테스트 범위 밖 — 구현 시 임시 확인 (커밋 안 함, 009와 같은 방식)"
  test_files:
    - "test/.../domain/subscription/application/usecase/SubscriptionUseCaseTest.java (수정 — GetSubscriptionDraft @Nested 추가, SaveSubscriptionDraft에 시나리오 1개 추가 · 요청 생성자 인자 추가)"

notes:
  - "결정 (2026-11-20, 사용자 '무조건 피그마와 동일'): A-03 / A-03s에서 중단해도 그 화면으로 복원 — Figma A-01s '4. 불러오기 버튼 — 이전에 등록을 중단한 화면으로 이동하여 이어서 작성', '불러오기 후 복원할 화면 위치 및 입력 상태는 임시 저장된 정보를 기준으로 처리'. 009의 'lastStep은 A-02 · A-04 두 값만' 결정을 대체. Notion 설명 '입력 화면(A-03)을 채운다'와 A-01s 디자인(팝업 뒤 A-03 화면)도 같은 방향"
  - "A-03 / A-03s 복원 시 입력 상태 = 그 항목의 저장값 (없으면 Figma 기본값: 카테고리 = 서비스 지정 카테고리 / 직접 입력 '기타', 금액 = 요금제 가격(A-03) / 미입력(A-03s), 주기 1개월, 다음 결제일 오늘, 결제한 곳 웹·직접 결제). 저장하지 않은 입력은 Figma A-03 '※ 필수 정보 일부만 입력한 상태에서 임시 저장 불가능'에 따라 저장 · 복원하지 않음"
  - "A-03 / A-03s 구분은 lastStep 값 하나(INPUT_SUBSCRIPTION) + items[editingItemIndex].serviceId로 판단 (serviceId 있으면 A-03, null이면 A-03s) — 같은 정보를 두 번 저장하지 않도록 값을 나누지 않음. 순번은 serviceId로 찾을 수 없는 직접 입력 항목까지 가리키기 위해 사용"
  - "범위 = 직접 등록 흐름만 (Figma 확인): 스크린샷 · Gmail 흐름 설명(SUB-005~008)에는 임시저장 · 불러오기 규칙이 없고 반대로 'A-07 뒤로가기 시 등록한 스크린샷 저장하지 않고 이동', 'A-09 / A-13 이전 화면 이동 시 분석 결과 및 수정 정보 초기화'. [가정] A-09 / A-13 '구독 추가하기'로 들어간 A-02 · A-03(직접 등록한 구독이 분석 결과 목록에 추가되는 경우)은 임시저장하지 않음 — 저장하면 분석 결과 없이 직접 항목만 남아 '중단한 화면' 복원이 불가능 (클라이언트 공유 대상)"
  - "A-01 노출 조건 해석: A-01 '등록 중이던 정보가 있거나 이탈 팝업 없이 도중 이탈된 경우 불러오기 팝업 노출'과 A-01s '등록 중이던 정보가 존재하는 경우 노출 / 없는 경우 A-01 바로 표시' 중 팝업 화면 자체 설명인 A-01s 기준(A-01 '불러오기 팝업의 … 동작은 해당 화면 디자인 기준') → 임시저장이 있을 때만 팝업. 이탈 팝업(A-03c '나가기')으로 나간 경우도 임시저장이 남아 팝업이 뜸 (SUBSCRIPTION-010 결정)"
  - "[가정] A-02s '직접 입력하기'로 A-03s에 들어갔는데 items가 비어 있으면(아무 서비스도 안 고른 상태) 저장할 수 없음 (items @NotEmpty 유지) → 그 상태로 이탈하면 불러오기 팝업이 뜨지 않음. Figma A-03 '일부 입력 임시 저장 불가'와 같은 결과"
  - "불러오기 팝업 위치 = A-01 (Figma 기준): A-01 '5. 등록 중이던 정보 확인 — A-01 진입 시 확인, 팝업의 화면 ID는 해당 화면 디자인 기준', 팝업 화면 ID 'A-01s'(A-01 하위), A-01s '1. 팝업 노출 조건 — 구독 등록 화면(A-01) 진입 시'. A-01s 디자인 프레임(1531:13733)의 배경이 A-03인 것은 옆 A-03c 프레임(1531:13706)과 레이어 구조가 같아 복사한 배경으로 판단 — 호출 시점은 설명 기준 'A-01 진입 시 1회'"
  - "Figma 우선 결정 — logoUrl 추가: Figma A-04 '서비스 이미지는 좌측에 원형으로 표시, 사전 등록 서비스는 지정 이미지, 직접 입력 서비스는 기본 이미지 사용'. Notion 응답에는 없음 → 항목에 logoUrl(nullable) 추가. 이름 · 의미는 기존 구독 응답 3개의 logoUrl과 동일 (SUBSCRIPTION-009 notes의 '011에서 logoUrl 검토' 결론)"
  - "logoUrl을 임시저장(Redis)에 넣지 않고 조회 시 services에서 읽는 이유: PUT 요청에 로고가 없고, 로고는 S3 업로드 후 일괄 UPDATE 예정(services-seed 메모)이라 저장 시점 값이 낡을 수 있음"
  - "로고 조회에 기존 findActiveServicesByIds 재사용 — 저장 후 비활성 · 삭제된 서비스는 기본 이미지(null)로 보이고, 등록(SUBSCRIPTION-001) 때 40301 SERVICE_NOT_FOUND로 걸러짐. 비활성 서비스 로고까지 보여주려면 새 Repository 메서드가 필요해 추가하지 않음 (No Over-engineering)"
  - "'새로 등록하기' → SUBSCRIPTION-010 DELETE 후 A-01 (Figma A-01s '3. 새로 등록하기 버튼 — 기존 임시 등록 정보의 삭제'). 등록 완료 후 재노출 안 함은 SUBSCRIPTION-001 성공 시 서버 삭제로 보장"
  - "[가정] 지난 nextBillingDate: 저장 후 날짜가 지나면 과거 날짜가 그대로 내려감 (009가 과거 날짜 저장을 허용). 서버는 바꾸지 않음 — Figma A-03 '6. 다음 결제일 — 과거 날짜 선택 불가', 등록 때 SUBSCRIPTION-001 @FutureOrPresent가 거부하므로 클라이언트가 해당 항목을 다시 입력하게 안내 필요 (Figma에 불러오기 후 처리 규칙 없음, 클라이언트 공유 대상)"
  - "[가정] Redis 값 역직렬화 실패(나중에 Enum 값 변경 등)는 별도 처리하지 않음 → 500. 이 스펙 이전 형식(editingItemIndex 없음)은 null로 읽혀 문제없음"
  - "Figma 미확정 항목: A-01s '※ 임시 등록 정보의 저장 시점, 보관 기간, 삭제 정책은 확인 필요', A-03c '저장하지 않은 입력값의 삭제 또는 임시 저장 처리 방식은 확인 필요' — 디자인 확정 시 재검토"
  - "Notion 수정 필요 (Figma 우선): ① 호출 화면 '구독 등록 유도 화면(O-03)이나 구독 추가 화면(A-01)' · '(O-03, A-03)' → 'A-01 진입 시 (A-01, A-01s)' (Figma O-03은 '온보딩 알림 권한') ② '사용자가 멈췄던 화면(lastStep)으로 이동해 items 값으로 입력 화면(A-03)을 채운다' → 'lastStep(A-02 / A-04 / A-03 · A-03s)으로 이동해 items로 복원, A-03 · A-03s는 editingItemIndex 항목의 저장값으로 채움' ③ 응답에 editingItemIndex(Integer, nullable) · items[].logoUrl(String, nullable) 추가 ④ lastStep Enum에 INPUT_SUBSCRIPTION 추가 (GET · PUT 모두) ⑤ PUT 요청에 editingItemIndex 추가 ⑥ mock에 사전 등록 미입력 항목 예시 추가 권장"
  - "범위 외: 회원 탈퇴 시 임시저장 삭제는 여전히 제안 상태 (SUBSCRIPTION-009 notes)"
