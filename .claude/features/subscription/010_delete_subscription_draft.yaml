# Feature Specification
# Status: Draft
# Last Updated: 2026-11-20

meta:
  id: SUBSCRIPTION-010
  title: 구독 등록 임시저장 삭제
  type: Feature
  author: 1winhyun
  source: >
    Figma 디자인 작업소 (9cBKdlwBBUqHndoKPsrDfX) › 구독 등록(직접 등록 및 공통 화면) › SUB-004 —
    A-01s 불러오기 팝업 '등록 중이던 구독을 불러올까요?' [새로 등록하기 · 불러오기] — '새로 등록하기: 기존 임시 등록 정보의 삭제 · 구독 등록 방법 선택 화면(A-01) 표시',
    A-03c 이탈 팝업 '등록을 그만할까요?' [나가기 · 계속 작성하기] — 나가기 '이전 화면으로 이동', SUB-001 A-01 '등록 중이던 정보 확인'.
    Notion API 명세서 '구독 등록 임시저장 삭제' (DELETE /api/v1/subscriptions/drafts)
  depends_on:
    - AUTH-001          # JWT 인증 필터, @CurrentUserId
    - USER-001          # UserErrorCode.USER_NOT_FOUND, UserNotFoundException
    - SUBSCRIPTION-009  # SubscriptionDraftService.deleteDraft, SubscriptionDraftRepository.deleteByUserId, Redis key 재사용

overview:
  summary: >
    불러오기 팝업(A-01s)에서 '새로 등록하기'를 누르면 회원의 구독 등록 임시저장(Redis subscription-draft:{userId})을 삭제한다.
    임시저장이 없어도 성공으로 응답한다. 응답 데이터는 없다(data = null).
  user_story: >
    As a 등록 중이던 구독이 있는 회원, I want to 불러오기 팝업에서 '새로 등록하기'를 골라 이전 임시저장을 지우기를,
    so that 다음에 구독 추가 화면에 들어왔을 때 지난 등록 정보가 다시 뜨지 않고 새로 등록을 시작할 수 있다.
  goals:
    - 회원당 1건인 임시저장 삭제 — 없어도 성공 (Notion)
    - 삭제 후 A-01 진입 시 불러오기 팝업이 뜨지 않음 (Figma A-01 '등록 중이던 정보가 없으면 등록 방법 선택 화면 바로 표시')

technical_spec:
  api:
    - method: DELETE
      path: /api/v1/subscriptions/drafts
      summary: 구독 등록 임시저장 삭제
      auth: Required (Authorization Bearer Access Token)
      request:
        dto: "없음 (Query · Path · Body 없음)"
      response:
        dto: "없음"
        http_status: 200 OK
        response_code: "SubscriptionResponseCode.SUBSCRIPTION_DRAFT_DELETED (200, HttpStatus.OK, \"임시저장을 삭제했습니다.\")"
        wrapper: "CommonResponse<Void> — CommonResponse.success(ResponseCode), data = null (system-design no_content_rule, UserController.withdrawUser와 같은 형식)"
        example: |
          {
            "code": 200,
            "message": "임시저장을 삭제했습니다.",
            "data": null
          }

  data_flow:
    - step: 1
      layer: Presentation (SubscriptionController)
      action: "@DeleteMapping(\"/drafts\") — @CurrentUserId UUID userId → SubscriptionUseCase.deleteSubscriptionDraft(userId) → CommonResponse.success(SubscriptionResponseCode.SUBSCRIPTION_DRAFT_DELETED)"
    - step: 2
      layer: UseCase (SubscriptionUseCase.deleteSubscriptionDraft)
      action: "회원 확인 → 임시저장 삭제. 반환값 없음 (void)"
      transaction: "true (@Transactional — 쓰기 메서드 규칙, SUBSCRIPTION-009 saveSubscriptionDraft · AuthUseCase.reissueToken과 동일. Redis 삭제는 DB 트랜잭션과 묶이지 않음)"
    - step: 3
      layer: Domain Service (UserGetService)
      action: "findUserById(userId) — 없거나 탈퇴했으면 UserNotFoundException (SUBSCRIPTION-009 등 다른 구독 API와 같은 회원 확인)"
    - step: 4
      layer: Domain Service (SubscriptionDraftService — SUBSCRIPTION-009에서 구현, 재사용)
      action: "deleteDraft(userId) → SubscriptionDraftRepository.deleteByUserId"
    - step: 5
      layer: Infrastructure (RedisSubscriptionDraftRepository — SUBSCRIPTION-009에서 구현, 재사용)
      action: "StringRedisTemplate.delete('subscription-draft:{userId}') — key가 없어도 예외 없음 → 임시저장이 없어도 성공"

  database:
    entities: []
    note: "MySQL 변경 없음"
    redis:
      key: "subscription-draft:{userId}"
      action: "DEL (Soft Delete 대상 아님 — DB 엔티티가 아닌 Redis 임시 데이터, RefreshToken 삭제와 같은 방식)"
    reads:
      - name: User
        action: Read
        table: users

  error_codes:
    new: "없음"
    reused:
      - "40201 UserErrorCode.USER_NOT_FOUND (404) — 회원이 없거나 탈퇴"
      - "40005 / 40103 / 40104 — 인증 실패 (AUTH-001)"

  changes_to_existing_code:
    - target: "SubscriptionResponseCode"
      change: "SUBSCRIPTION_DRAFT_DELETED(200, HttpStatus.OK, \"임시저장을 삭제했습니다.\") 추가"
    - target: "SubscriptionUseCase"
      change: "deleteSubscriptionDraft(UUID userId) 추가 (@Transactional)"
    - target: "SubscriptionController"
      change: "@DeleteMapping(\"/drafts\") deleteSubscriptionDraft 추가 (+ Swagger @Operation, 요청값 '없음' 명시). 기존 @DeleteMapping(본문 subscriptionIds, 구독 선택 삭제)과 경로가 달라 충돌 없음"
    - target: "SubscriptionDraftService · SubscriptionDraftRepository · RedisSubscriptionDraftRepository"
      change: "변경 없음 — SUBSCRIPTION-009의 deleteDraft / deleteByUserId 재사용"
    - target: ".claude/features/subscription/009_save_subscription_draft.yaml"
      change: "notes · database.deleted_when의 후속 스펙 번호 정리 (삭제 = SUBSCRIPTION-010, 불러오기 = SUBSCRIPTION-011) — 스펙 작성 시 반영 완료"

  security_config:
    note: "변경 없음 — anyRequest().authenticated()로 보호됨"

  validation_rules:
    - "본인 임시저장만 삭제 — userId는 Access Token에서만 받는다 (경로 · 본문으로 받지 않음)"
    - "임시저장이 없어도 성공 (200) — Notion '저장된 임시저장이 없어도 성공으로 응답'"
    - "회원이 없거나 탈퇴했으면 USER_NOT_FOUND"

package_structure:
  base: "com.subscribers.gudogging.domain.subscription"
  files:
    - "presentation/SubscriptionController.java (수정 — DELETE /drafts)"
    - "presentation/response/SubscriptionResponseCode.java (수정 — SUBSCRIPTION_DRAFT_DELETED)"
    - "application/usecase/SubscriptionUseCase.java (수정 — deleteSubscriptionDraft)"

testing_strategy:
  # SubscriptionUseCaseTest only (JUnit5 + Mockito)
  # Mock: UserGetService, SubscriptionDraftService
  happy_path:
    - "deleteSubscriptionDraft: 회원의 임시저장을 삭제한다 (deleteDraft(userId) 호출)"
  edge_cases:
    - "deleteSubscriptionDraft: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND 예외를 던지고 임시저장을 삭제하지 않는다"
  note: "'임시저장이 없어도 성공'은 Redis DEL 동작(key 없으면 0 반환, 예외 없음)이라 UseCase 단에서는 위 성공 시나리오와 같음 — 별도 테스트 없음"
  test_files:
    - "test/.../domain/subscription/application/usecase/SubscriptionUseCaseTest.java (수정 — DeleteSubscriptionDraft @Nested 추가)"

notes:
  - "호출 시점 (Figma 기준): ① A-01s 불러오기 팝업 '새로 등록하기' (Figma '기존 임시 등록 정보의 삭제'). 등록 완료 시 삭제는 서버가 SUBSCRIPTION-001에서 처리하므로(SUBSCRIPTION-009) 앱이 따로 호출하지 않아도 됨"
  - "[가정] ② A-02로 돌아가 선택을 모두 해제해 A-04 목록이 0개가 되면 PUT(items 1개 이상) 대신 이 API 호출 — SUBSCRIPTION-009 notes의 가정과 같음. Figma에 명시 없음"
  - "결정 (2026-11-20, 사용자): A-03c 이탈 팝업 '나가기'는 임시저장을 삭제하지 않음 (Figma 설명 기준). 근거 — 설명 '이탈 후 이동할 화면은 이전 화면으로 이동'(A-03 → A-04, 등록 흐름 안), 노출 조건 '저장하지 않은 입력값이 존재하는 상태로 뒤로가기 클릭 시', '저장하지 않은 입력값의 삭제 또는 임시 저장 처리 방식은 확인 필요'(대상은 폼 입력값). 나가기 = A-03 폼의 미저장 입력만 버리고 A-04로 이동, 임시저장(A-04 목록)은 유지. Figma 안의 반대 신호(팝업 제목 '등록을 그만할까요?', A-01 '이탈 팝업 없이 도중 이탈된 경우' 문구)는 이 결정으로 정리 — 문구가 등록 전체 중단으로 읽히므로 디자인 문구 검토 요청 대상"
  - "Notion 수정 필요 (위 결정 반영): ① '구독 등록 이탈 팝업(A-03c)에서 나가기를 선택하면 삭제' 문장 삭제 ② '앱을 강제 종료하는 등 팝업 없이 이탈한 경우에만 임시저장이 남아…' → '새로 등록하기 · 등록 완료 전까지 임시저장이 남아 다음 A-01 진입 때 불러오기 팝업이 뜬다'로 수정"
  - "Figma에 규칙 없음 (현재 동작): A-02에서 뒤로가기로 A-01에 돌아가는 경우 삭제 규칙이 없어 임시저장 유지 — 다음 A-01 진입 때 불러오기 팝업 노출. Figma A-01s '※ 임시 등록 정보의 저장 시점, 보관 기간, 삭제 정책은 확인 필요'도 남아 있음"
  - "DTO는 Notion과 동일 (요청 없음, 응답 data = null) — 수정할 DTO 없음"
  - "Hard Delete 금지 규칙: 대상은 DB 엔티티(BaseEntity). 임시저장은 DB에 저장하지 않는 Redis 임시 데이터(ERD v1.8 9장)라 DEL로 지움 — 회원 탈퇴의 Refresh Token 삭제(USER-001)와 같은 방식"
  - "범위 외: 임시저장 불러오기 (GET /api/v1/subscriptions/drafts) → SUBSCRIPTION-011 (findByUserId 추가, logoUrl 검토). 회원 탈퇴 시 임시저장 삭제는 여전히 제안 상태"
