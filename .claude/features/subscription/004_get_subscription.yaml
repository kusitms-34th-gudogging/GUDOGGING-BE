testing_strategy:
  # SubscriptionUseCaseTest only (JUnit5 + Mockito) — @Nested GetSubscription
  # Mock: UserGetService, SubscriptionGetService, SubscriptionBillingHistoryGetService, SubscriptionCheckGetService, SubscriptionCheckCancelReasonGetService
  # Subscription · SubscriptionCheck는 정적 팩토리로 생성, id · createdAt은 ReflectionTestUtils로 지정
  happy_path:
    - "getSubscription: 구독 중이면 결제 금액 · 연 환산 · 다음 결제일 · D-n · 구독 시작일 · 지금까지 결제 횟수와 금액을 반환하고 해지일은 null이다 (기존)"
    - "getSubscription: 구독 종료면 해지일 · 해지일까지 결제 금액을 반환하고 다음 결제일 · D-n은 null이다 (기존)"
    - "getSubscription: baseDate를 주면 그 날짜 이후 첫 결제일과, 구독 시작일 ~ 해지일 범위로 판단한 상태를 반환한다 (기존)"
    - "getSubscription: 직접 입력 서비스는 logoUrl을 null로 반환한다 (기존)"
    - "[변경] getSubscription: 점검 기록이 없으면 latestCheckup · pastCheckupAverage는 null, pastCheckups는 빈 목록이고 해지 이유를 조회하지 않는다 (기존 '점검 필드 고정값' 테스트 대체)"
    - "getSubscription: 가장 최근 점검의 점검 ID · 점검일 · 결정 · 점검 당시 카테고리 선택지 문구 · 단계 · 활용도 · 메모 · 해지 이유 선택지(K-90 순서) · 직접 입력 해지 이유를 latestCheckup으로 반환한다"
    - "getSubscription: 해지 이유를 선택지로만 고르고 직접 입력하지 않았으면 cancelReasons만 담고 cancelReasonText는 null이다"
    - "getSubscription: 평균 기간 점검이 1건이면 pastCheckupAverage는 그 기록의 응답 문구 · 활용도 · 단계 그대로이고, 기간은 두 달 전 1일 ~ 오늘이다"
    - "getSubscription: 평균 기간 점검이 여러 건이면 문항별 평균을 반올림한 점수의 문구와, 소수 평균으로 계산한 활용도 · 단계를 반환한다"
    - "getSubscription: 평균 기간 점검을 최신순 그대로 pastCheckups로 반환한다"
  edge_cases:
    - "getSubscription: 반올림한 계획 평균이 1이면 활용도를 59%로 제한한다"
    - "getSubscription: 평균 기간에 카테고리가 다른 점검이 섞여 있으면 이용도 평균 문구는 가장 최근 점검의 카테고리 선택지로 반환한다"
    - "getSubscription: 유지/해지를 고르지 않은 점검은 decision을 null로 반환한다"
    - "getSubscription: 평균 기간 조회는 baseDate와 무관하게 오늘이 속한 달의 두 달 전 1일 00:00부터 한다"
    - "getSubscription: 평균 기간 밖 점검만 있으면 latestCheckup은 그 점검, pastCheckups는 빈 목록, pastCheckupAverage는 null이다"
    - "getSubscription: 없거나 다른 회원의 구독이면 SUBSCRIPTION_NOT_FOUND 예외를 던진다 (기존)"
    - "getSubscription: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND 예외를 던진다 (기존)"

