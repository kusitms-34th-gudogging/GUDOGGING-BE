# Feature Specification
# Status: Implemented (2026-11-21 점검 기록 실제 값 + 해지 이유 선택지 포함)
# Last Updated: 2026-11-21

meta:
  id: SUBSCRIPTION-004
  title: 구독 상세 조회 (구독 중 · 구독 종료 · 캘린더 기준일)
  type: Feature
  author: 1winhyun
  source: >
    Figma 디자인 작업소(9cBKdlwBBUqHndoKPsrDfX) › 화면 설계서 › 구독 관리 › MNG-003 (M-03 1745:6957 · M-05 1745:7010, Description 1745:6820),
    캘린더 › CAL-003 (C-03 1745:6323, Description 1745:6186), 구독 점검 › CHK-009 해지 이유 (K-90, Description 1239:4260)
  api_doc: "Notion API 명세서 › 구독 상세 조회 — https://app.notion.com/p/159885ef28218210b19f819c6e07130d"
  priority: "Figma → 코딩 규칙(ERD 포함) → Notion API 명세서"
  depends_on:
    - AUTH-001      # JWT 인증 필터, @CurrentUserId
    - USER-001      # UserErrorCode.USER_NOT_FOUND, UserNotFoundException
    - SUBSCRIPTION-002  # Subscription 계산 메서드 (monthlyAmount, nextBillingOn, startedOn)
    - SUBSCRIPTION-003  # SubscriptionErrorCode.SUBSCRIPTION_NOT_FOUND
    - CHECK-001     # SubscriptionCheckGetService.findLatestCheck, CheckupForm.answerOf (카테고리별 선택지 문구)
    - CHECK-002     # SubscriptionCheck 점수 · 활용도 · 단계 저장, CheckScore.percentOf, CheckResultStage.of
    - CHECK-004     # SubscriptionCheck.decision · cancelReasonText (유지/해지 결정)

overview:
  summary: >
    구독 1건의 기본 정보와 결제 계산 값, 점검 기록을 조회한다. 구독 중 상세(M-03) · 구독 종료 상세(M-05)에 함께 쓰고,
    캘린더에서 날짜를 눌러 들어온 구독 상세(C-03)는 baseDate 기준으로 상태와 다음 결제일을 계산한다.
    [변경 2026-11-21] 점검 기능(CHECK-001~004) 구현에 따라 점검 필드를 실제 값으로 채운다 —
    latestCheckup = 가장 최근 점검 1건(M-05 '마지막 점검', C-03 '최근 점검'),
    pastCheckups = 이번 달 포함 최근 3개월 점검 원본 기록, pastCheckupAverage = 그 기간 응답 평균(M-03 '지난 점검').
  user_story: >
    As a 로그인한 회원, I want to 구독 하나의 결제 정보와 점검 기록을 자세히 보기를,
    so that 이 구독을 유지할지 해지할지 판단할 수 있다.
  goals:
    - 구독 기본 정보 + 계산 값(다음 결제일 · D-n · 연 환산 · 지금까지 결제 금액/횟수) 반환 (ERD 6.1 · 6.2 · 6.3) — 구현됨
    - baseDate(선택)로 캘린더 C-03 상태 · 다음 결제일 계산 — 구현됨
    - "[변경 2026-11-21] latestCheckup: 기간 제한 없이 가장 최근 점검 1건 (점검일 · 결정 · 단계 · 활용도 · 응답 문구 · 메모 · 해지 이유 선택지 · 직접 입력 해지 이유)"
    - "[변경 2026-11-21] pastCheckups · pastCheckupAverage: 이번 달 포함 최근 3개월(두 달 전 1일 ~ 오늘) 점검 기록과 응답 평균. 1건이면 그 기록 그대로, 0건이면 pastCheckups [] · pastCheckupAverage null"

technical_spec:
  api:
    - method: GET
      path: /api/v1/subscriptions/{subscriptionId}
      summary: 구독 상세 조회
      auth: Required (Authorization Bearer Access Token)
      request:
        dto: 없음
        path_variables:
          - name: subscriptionId
            type: UUID
            required: true
        query_params:
          - name: baseDate
            type: LocalDate
            required: false
            validation: "yyyy-MM-dd. 캘린더 C-03에서 선택한 날짜. 없으면 오늘"
      response:
        dto: SubscriptionDetailResponse
        http_status: 200 OK
        response_code: "SubscriptionResponseCode.SUBSCRIPTION_FOUND (200, HttpStatus.OK, \"구독 상세를 조회했습니다.\")"
        wrapper: CommonResponse<SubscriptionDetailResponse>
        fields:
          - "subscriptionId (UUID)"
          - "status (SubscriptionStatus): baseDate가 없으면 저장된 상태, 있으면 baseDate가 구독 시작일 ~ 해지일(ACTIVE면 상한 없음) 사이일 때 ACTIVE, 아니면 ENDED (ERD 6.2 C-03 상태 칩)"
          - "serviceName (String)"
          - "logoUrl (String, nullable): 직접 입력 · 로고 없음은 null"
          - "category (Category): 카테고리 칩"
          - "amount (int): 1회 결제 금액 — M-03 '결제 예정'"
          - "billingCycleValue (int), billingCycleUnit (BillingCycleUnit): 결제 주기"
          - "nextBillingDate (LocalDate, nullable): 기준일(baseDate 또는 오늘) 이후(포함) 첫 결제일. 기준일이 구독 시작일 전이거나, 저장된 상태가 ENDED이고 그 날짜가 해지일 이후면 null"
          - "startedAt (LocalDate): 구독 시작일 = subscriptions.started_on (등록일, 재등록하면 재등록일 — SUBSCRIPTION-008)"
          - "paymentMethod (PaymentMethod): 결제한 곳 — 해지하기 분기(X-01/X-03/X-04/X-05)에도 사용"
          - "isSteady (boolean): '꾸준히 쓰는 구독' 토글 (subscriptions.is_steady_use, SUBSCRIPTION-012)"
          - "canceledAt (LocalDate, nullable): 해지일 (subscriptions.canceled_on). 저장된 상태가 ACTIVE면 null"
          - "yearlyAmount (long): 연 환산 = monthlyAmount() × 12"
          - "totalPaidAmount (long): 지금까지 결제 금액 = 결제일마다 그때 조건의 금액 합계 (결제 조건 이력 포함, ERD v1.7) — M-05 '지금까지 쓴 금액'"
          - "paidCount (int): 지금까지 결제 횟수 — 구독 시작일 ~ (ENDED면 해지일 / ACTIVE면 오늘) 양끝 포함 결제일 수 (결제 조건 이력 포함)"
          - "dDay (Integer, nullable): nextBillingDate − 기준일. nextBillingDate가 null이면 null"
          - "latestCheckup (LatestCheckupResponse, nullable): [변경 2026-11-21] 가장 최근 점검 1건 (기간 · baseDate · 구독 상태와 무관). 점검이 없으면 null"
          - "pastCheckups (List<PastCheckupResponse>): [변경 2026-11-21] 평균 기간(이번 달 포함 최근 3개월) 점검 원본 기록, 최신순. 없으면 빈 배열"
          - "pastCheckupAverage (PastCheckupAverageResponse, nullable): [변경 2026-11-21] 평균 기간 응답 평균 (M-03 '지난 점검'). 기간 안 점검이 없으면 null"
        checkup_dtos:
          note: >
            [변경 2026-11-21] 기존 record에 정적 팩토리를 추가한다. 응답 문구는 점검 당시 카테고리(subscription_checks.category 스냅샷)의
            선택지 문구 — CheckupForm.of(category).answerOf(type, score). 이용도만 카테고리별 선택지, 만족도 · 다음 달은 공통 선택지.
            점검일(checkedAt) = subscription_checks.created_at의 날짜.
          latest_checkup_fields:
            factory: "LatestCheckupResponse.of(SubscriptionCheck, List<SubscriptionCheckCancelReason>)"
            fields:
              - "checkupId (UUID): 점검 ID (점검 결과 조회 API에 사용)"
              - "checkedAt (LocalDate): 점검일 — M-05 · C-03 배지 '10월 3일 점검'"
              - "decision (CheckDecision, nullable): KEEP / CANCEL — M-05 배지 '· 해지'. 점검만 하고 유지/해지를 고르지 않았으면 null"
              - "usageAnswer, satisfactionAnswer, planAnswer (String): 응답 문구 — '이용도 · 만족도 · 다음 달'"
              - "stage (CheckResultStage): subscription_checks.stage — '점검 결과' 단계 (예: 해지 추천)"
              - "score (int): subscription_checks.score_percent — '점검 결과' % (예: 8%)"
              - "memo (String, nullable): 점검 메모 — C-03 '메모'"
              - "cancelReasons (List<CancelReason>): [복원 2026-11-21] K-90에서 고른 해지 이유 코드 (subscription_check_cancel_reasons, deleted = false). K-90 선택지 순서(enum 순서: RARELY_USED · PRICE_BURDEN · LACKING · SWITCHING · GOAL_ACHIEVED · CUSTOM)로 정렬. 없으면 빈 배열 (유지 결정 · 건너뛰기 · 결정 전). 카테고리별 문구는 클라이언트 표시 (CHECK-004와 동일)"
              - "cancelReasonText (String, nullable): K-90 직접 입력 해지 이유 (CUSTOM 선택 시). 없으면 null"
            m05_display: "M-05 '해지 이유' = cancelReasons 문구 + cancelReasonText를 클라이언트가 합쳐 표시. 둘 다 비면(건너뛰기) 표시 방법은 클라이언트"
          past_checkup_fields:
            factory: "PastCheckupResponse.from(SubscriptionCheck)"
            fields:
              - "checkedAt (LocalDate)"
              - "usageAnswer, satisfactionAnswer, planAnswer (String)"
              - "decision (CheckDecision, nullable)"
          past_checkup_average_fields:
            factory: "PastCheckupAverageResponse.of(CheckAverage, LocalDate periodFrom, LocalDate periodTo)"
            fields:
              - "periodFrom (LocalDate): 평균 기간 시작일 = 오늘이 속한 달의 두 달 전 1일 (예: 오늘 10/21 → 8/1). baseDate와 무관 — M-03 칩 '8월~10월 결과'"
              - "periodTo (LocalDate): 평균 기간 종료일 = 오늘. baseDate와 무관"
              - "usageAnswer, satisfactionAnswer, planAnswer (String): 문항별 평균을 반올림(HALF_UP)한 점수(1~5)의 선택지 문구. 이용도 문구는 기간 내 가장 최근 점검의 카테고리 선택지"
              - "score (int): 활용도(%) — 문항별 소수 평균을 활용도 공식에 그대로 넣어 계산(HALF_UP), 반올림한 계획 점수가 1이면 59% 상한 (ERD 6.4)"
              - "stage (CheckResultStage): CheckResultStage.of(score)"
          check_result_stage: "KEEP_RECOMMENDED(80% 이상) / KEEP_CONSIDER(60~79%) / CANCEL_CONSIDER(40~59%) / CANCEL_RECOMMENDED(40% 미만)"
        factory: >
          [변경 2026-11-21] SubscriptionDetailResponse.of(Subscription, List<SubscriptionBillingHistory>, Optional<SubscriptionCheck> latestCheck,
          List<SubscriptionCheckCancelReason> latestCancelReasons, List<SubscriptionCheck> recentChecks, LocalDate today, LocalDate baseDate) —
          latestCheckup = latestCheck.map(check -> LatestCheckupResponse.of(check, latestCancelReasons)).orElse(null),
          pastCheckups = recentChecks → PastCheckupResponse.from (순서 유지),
          pastCheckupAverage = recentChecks가 비면 null, 아니면 PastCheckupAverageResponse.of(CheckAverage.of(recentChecks), CheckAverage.periodFromOf(today), today)
        display_note: >
          화면별 사용 필드는 클라이언트가 고름 — M-03: pastCheckupAverage('지난 점검', null이면 영역 숨김) /
          M-05: latestCheckup('마지막 점검' — 점검 결과 · 이용도 · 만족도 · 다음 달 · 해지 이유(cancelReasons + cancelReasonText)) /
          C-03: latestCheckup('최근 점검' — 점검일 · 점검 결과 · 이용도 · 만족도 · 다음 달 · 메모).
          '점검 알림: 중단됨'(ENDED), 하단 버튼 · C-03 버튼 숨김, 기간 칩 문구('8월~10월 결과')는 클라이언트 처리
        example: |
          {
            "code": 200,
            "message": "구독 상세를 조회했습니다.",
            "data": {
              "subscriptionId": "3f2b8c1e-5a4d-4e7b-9c21-000000000001", "status": "ACTIVE", "serviceName": "넷플릭스",
              "logoUrl": "https://cdn.gudogging.app/logos/netflix.png", "category": "VIDEO_OTT", "amount": 17000,
              "billingCycleValue": 1, "billingCycleUnit": "MONTH", "nextBillingDate": "2026-12-15",
              "startedAt": "2025-03-15", "paymentMethod": "WEB_DIRECT", "isSteady": false, "canceledAt": null,
              "yearlyAmount": 204000, "totalPaidAmount": 255000, "paidCount": 15, "dDay": 24,
              "latestCheckup": {
                "checkupId": "b1d7a2c4-5a4d-4e7b-9c21-000000000012", "checkedAt": "2026-11-03",
                "decision": "KEEP", "usageAnswer": "6~10편", "satisfactionAnswer": "구독료만큼 가치 있어요",
                "planAnswer": "꼭 계속 쓸 거예요", "stage": "KEEP_RECOMMENDED", "score": 84,
                "memo": "가족과 같이 봄", "cancelReasons": [], "cancelReasonText": null
              },
              "pastCheckups": [
                { "checkedAt": "2026-11-03", "usageAnswer": "6~10편", "satisfactionAnswer": "구독료만큼 가치 있어요",
                  "planAnswer": "꼭 계속 쓸 거예요", "decision": "KEEP" },
                { "checkedAt": "2026-10-02", "usageAnswer": "3~5편", "satisfactionAnswer": "보통이에요",
                  "planAnswer": "아마 계속 쓸 것 같아요", "decision": "KEEP" }
              ],
              "pastCheckupAverage": {
                "periodFrom": "2026-09-01", "periodTo": "2026-11-21",
                "usageAnswer": "6~10편", "satisfactionAnswer": "구독료만큼 가치 있어요", "planAnswer": "꼭 계속 쓸 거예요",
                "score": 71, "stage": "KEEP_CONSIDER"
              }
            }
          }
        example_note: "VIDEO_OTT 선택지 기준 계산 예 — 최근 점검 4 · 4 · 5점 → 84%. 평균 (4,3) · (4,3) · (5,4) → 소수 평균 3.5 · 3.5 · 4.5 → 문구는 반올림 4 · 4 · 5점, 활용도 HALF_UP((2.5×40 + 2.5×25 + 3.5×35) / 4) = 71% (KEEP_CONSIDER)"

  data_flow:
    - step: 1
      layer: Presentation (SubscriptionController)
      action: "@CurrentUserId UUID userId, @PathVariable UUID subscriptionId, @RequestParam(required = false) LocalDate baseDate → SubscriptionUseCase.getSubscription(userId, subscriptionId, baseDate) → CommonResponse.success(SubscriptionResponseCode.SUBSCRIPTION_FOUND, data). [변경 2026-11-21] Swagger 설명의 점검 필드 문구 갱신"
    - step: 2
      layer: UseCase (SubscriptionUseCase.getSubscription)
      action: >
        회원 조회 → 본인 구독 조회 → 결제 조건 이력 조회(SubscriptionBillingHistoryGetService.findBillingHistoriesBySubscriptions(List.of(subscription)))
        → today = LocalDate.now()
        → [변경 2026-11-21] latestCheck = SubscriptionCheckGetService.findLatestCheck(subscription)
        → latestCancelReasons = latestCheck가 있으면 SubscriptionCheckCancelReasonGetService.findCancelReasonsByChecks(List.of(latestCheck)), 없으면 빈 목록 (조회 안 함)
        → recentChecks = SubscriptionCheckGetService.findChecksCreatedSince(subscription, CheckAverage.periodFromOf(today).atStartOfDay())
        → SubscriptionDetailResponse.of(subscription, billingHistories, latestCheck, latestCancelReasons, recentChecks, today, baseDate)
      transaction: "readOnly (클래스 기본)"
    - step: 3
      layer: Domain Service (UserGetService)
      action: "findUserById(userId) — 없으면 UserNotFoundException"
    - step: 4
      layer: Domain Service (SubscriptionGetService)
      action: "findSubscription(User, UUID subscriptionId) — user 일치 AND deleted = false, serviceCatalog fetch join. 없으면 SubscriptionNotFoundException"
    - step: 5
      layer: "Domain Service (SubscriptionCheckGetService) — [변경 2026-11-21]"
      action: >
        findLatestCheck(Subscription) — 기존 재사용 (deleted = false 중 created_at 최신 1건) /
        findChecksCreatedSince(Subscription, LocalDateTime from) — 신규. deleted = false AND created_at ≥ from, created_at 최신순
        (Repository: findAllBySubscriptionAndCreatedAtGreaterThanEqualAndDeletedFalseOrderByCreatedAtDesc)
        / SubscriptionCheckCancelReasonGetService.findCancelReasonsByChecks(Collection<SubscriptionCheck>) — 기존 재사용 (deleted = false), 최근 점검 1건만
    - step: 6
      layer: Domain (Subscription · BillingSchedule)
      action: "yearlyAmount(), startedOn(), statusOn(LocalDate base). nextBillingOn(base) · paidCount(today) · totalPaidAmount(today)는 BillingSchedule.of(subscription, billingHistories) (ERD 6.2 v1.7) — 변경 없음"
    - step: 7
      layer: "Domain (check/domain/result/CheckAverage) — [변경 2026-11-21] 신규"
      action: >
        record CheckAverage(Category category, int usageScore, int satisfactionScore, int planScore, int scorePercent, CheckResultStage stage).
        static periodFromOf(LocalDate today) = today.withDayOfMonth(1).minusMonths(2) (이번 달 포함 최근 3개월 시작일).
        static of(List<SubscriptionCheck> checks) — checks는 1건 이상, 최신순:
        1건이면 그 기록의 category · 점수 · score_percent · stage 그대로 (Figma '1건이면 그 기록 그대로');
        여러 건이면 category = 첫 번째(가장 최근) 점검의 카테고리, 문항별 점수 = 평균 HALF_UP 반올림,
        scorePercent = CheckScore.percentOfAverage(checks), stage = CheckResultStage.of(scorePercent)
    - step: 8
      layer: "Domain (check/domain/result/CheckScore) — [변경 2026-11-21] 메서드 추가"
      action: >
        percentOfAverage(List<SubscriptionCheck> checks): 문항별 소수 평균을 활용도 공식(ERD 6.4)에 그대로 넣은 값 — 정수 합계로 정확히 계산:
        HALF_UP((Σ(이용도−1)×40 + Σ(만족도−1)×25 + Σ(계획−1)×35) / (4 × n)).
        계획 평균을 HALF_UP 반올림한 값이 1이면 min(활용도, 59). 가중치 · 상한 상수는 기존 percentOf와 공유

  database:
    entities:
      - name: Subscription
        action: Read
        table: subscriptions
      - name: SubscriptionBillingHistory
        action: Read
        table: subscription_billing_histories
      - name: ServiceCatalog
        action: Read (fetch join)
        table: services
        fields: "logo_url"
      - name: User
        action: Read
        table: users
      - name: SubscriptionCheck
        action: "Read — [변경 2026-11-21] 최근 1건 + 평균 기간 목록 (2회 조회)"
        table: subscription_checks
        fields: "id, category, usage_score, satisfaction_score, plan_score, score_percent, stage, memo, decision, cancel_reason_text, created_at"
      - name: SubscriptionCheckCancelReason
        action: "Read — [복원 2026-11-21] 최근 점검 1건의 해지 이유 (점검이 없으면 조회 안 함)"
        table: subscription_check_cancel_reasons
        fields: "reason"
    schema_change: 없음

  error_codes:
    reused:
      - "40404 SubscriptionErrorCode.SUBSCRIPTION_NOT_FOUND (404) — 없음 · 삭제됨 · 다른 회원 구독 (SUBSCRIPTION-003에서 정의)"
      - "40201 UserErrorCode.USER_NOT_FOUND (404)"
      - "40005 / 40103 / 40104 — 인증 실패 (AUTH-001)"
      - "subscriptionId · baseDate 형식 오류 — MethodArgumentTypeMismatchException은 GlobalExceptionHandler에 핸들러가 없어 Spring 기본 400 (SUBSCRIPTION-002 notes 참고)"
    new: 없음

  changes_to_existing_code:
    implemented_2026_11_18:
