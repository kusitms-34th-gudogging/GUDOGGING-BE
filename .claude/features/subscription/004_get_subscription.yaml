# Feature Specification
# Status: Draft
# Last Updated: 2026-11-18

meta:
  id: SUBSCRIPTION-004
  title: 구독 상세 조회 (구독 중 · 구독 종료 · 캘린더 기준일)
  type: Feature
  author: 1winhyun
  source: "Figma 디자인 작업소 › 구독 관리 › MNG-003 (M-03, M-05)"
  api_doc: "Notion API 명세서 › 구독 상세 조회 — https://app.notion.com/p/159885ef28218210b19f819c6e07130d"
  depends_on:
    - AUTH-001      # JWT 인증 필터, @CurrentUserId
    - USER-001      # UserErrorCode.USER_NOT_FOUND, UserNotFoundException
    - SUBSCRIPTION-002  # Subscription 계산 메서드 (monthlyAmount, nextBillingOn, startedOn, paidCount, totalPaidAmount)
    - SUBSCRIPTION-003  # SubscriptionErrorCode.SUBSCRIPTION_NOT_FOUND

overview:
  summary: >
    구독 1건의 기본 정보와 결제 계산 값을 조회한다. 구독 중 상세(M-03) · 구독 종료 상세(M-05)에 함께 쓰고,
    캘린더에서 날짜를 눌러 들어온 구독 상세(C-03)는 baseDate 기준으로 상태와 다음 결제일을 계산한다.
    점검 기록(latestCheckup · pastCheckups · pastCheckupAverage)은 구독 점검 기능이 아직 없어 후속 스펙으로 미룬다 —
    이번 스펙에서는 응답 구조(Notion)만 유지하고 고정값(null · 빈 배열)을 반환한다.
  user_story: >
    As a 로그인한 회원, I want to 구독 하나의 결제 정보를 자세히 보기를,
    so that 이 구독을 유지할지 해지할지 판단할 수 있다.
  goals:
    - 구독 기본 정보 + 계산 값(다음 결제일 · D-n · 연 환산 · 지금까지 결제 금액/횟수) 반환 (ERD 6.1 · 6.2 · 6.3)
    - baseDate(선택)로 캘린더 C-03 상태 · 다음 결제일 계산
    - 점검 필드는 Notion 응답 구조 유지, 값은 고정 (latestCheckup null · pastCheckups [] · pastCheckupAverage null) — 점검 스펙에서 실제 값으로 채움

technical_spec:
  api:
    - method: GET
      path: /api/v1/subscriptions/{subscriptionId}
      summary: 구독 상세 조회
      auth: Required (Authorization Bearer Access Token)
      request:
        dto: 없음
        path_variables:
          - name: subscriptionId
            type: UUID
            required: true
        query_params:
          - name: baseDate
            type: LocalDate
            required: false
            validation: "yyyy-MM-dd. 캘린더 C-03에서 선택한 날짜. 없으면 오늘"
      response:
        dto: SubscriptionDetailResponse
        http_status: 200 OK
        response_code: "SubscriptionResponseCode.SUBSCRIPTION_FOUND (200, HttpStatus.OK, \"구독 상세를 조회했습니다.\")"
        wrapper: CommonResponse<SubscriptionDetailResponse>
        fields:
          - "subscriptionId (UUID)"
          - "status (SubscriptionStatus): baseDate가 없으면 저장된 상태, 있으면 baseDate가 등록일 ~ 해지일(ACTIVE면 상한 없음) 사이일 때 ACTIVE, 아니면 ENDED (ERD 6.2 C-03 상태 칩)"
          - "serviceName (String)"
          - "logoUrl (String, nullable): 직접 입력 · 로고 없음은 null"
          - "category (Category): 카테고리 칩"
          - "amount (int): 1회 결제 금액 — M-03 '결제 예정'"
          - "billingCycleValue (int), billingCycleUnit (BillingCycleUnit): 결제 주기"
          - "nextBillingDate (LocalDate, nullable): 기준일(baseDate 또는 오늘) 이후(포함) 첫 결제일. 저장된 상태가 ENDED이고 그 날짜가 해지일 이후면 null"
          - "startedAt (LocalDate): 구독 시작일 = 등록일 (created_at 날짜)"
          - "paymentMethod (PaymentMethod): 결제한 곳 — 해지하기 분기(X-01/X-03/X-04/X-05)에도 사용"
          - "isSteady (boolean): '꾸준히 쓰는 구독' 토글 (subscriptions.is_steady_use)"
          - "canceledAt (LocalDate, nullable): 해지일 (subscriptions.canceled_on). 저장된 상태가 ACTIVE면 null"
          - "yearlyAmount (int): 연 환산 = monthlyAmount() × 12"
          - "totalPaidAmount (int): 지금까지 결제 금액 = paidCount × amount — M-05 '지금까지 쓴 금액'"
          - "paidCount (int): 지금까지 결제 횟수 — 등록일 ~ (ENDED면 해지일 / ACTIVE면 오늘) 양끝 포함 결제일 수"
          - "dDay (Integer, nullable): nextBillingDate − 기준일. nextBillingDate가 null이면 null"
          - "latestCheckup (LatestCheckupResponse, nullable): [후속 스펙] 이번 스펙에서는 항상 null"
          - "pastCheckups (List<PastCheckupResponse>): [후속 스펙] 이번 스펙에서는 항상 빈 배열"
          - "pastCheckupAverage (PastCheckupAverageResponse, nullable): [후속 스펙] 이번 스펙에서는 항상 null"
        checkup_dtos:
          note: >
            Swagger 스키마 · Notion 응답 구조 유지를 위해 record 구조(필드)만 정의한다. 정적 팩토리(of/from)와 값 계산은 점검 후속 스펙에서 추가.
            stage 필드 타입용 CheckResultStage enum(값만)도 이번에 정의
          latest_checkup_fields:
            - "checkupId (UUID)"
            - "checkedAt (LocalDate)"
            - "decision (CheckDecision, nullable)"
            - "usageAnswer, satisfactionAnswer, planAnswer (String)"
            - "stage (CheckResultStage)"
            - "score (int)"
            - "memo (String, nullable)"
            - "cancelReasons (List<CancelReason>)"
            - "cancelReasonText (String, nullable)"
          past_checkup_fields:
            - "checkedAt (LocalDate)"
            - "usageAnswer, satisfactionAnswer, planAnswer (String)"
            - "decision (CheckDecision, nullable)"
          past_checkup_average_fields:
            - "periodFrom (LocalDate), periodTo (LocalDate)"
            - "usageAnswer, satisfactionAnswer, planAnswer (String)"
            - "score (int)"
            - "stage (CheckResultStage)"
          check_result_stage: "KEEP_RECOMMENDED / KEEP_CONSIDER / CANCEL_CONSIDER / CANCEL_RECOMMENDED"
        factory: "SubscriptionDetailResponse.of(Subscription, LocalDate today, LocalDate baseDate) — latestCheckup = null, pastCheckups = List.of(), pastCheckupAverage = null"
        display_note: "'점검 알림: 중단됨'(ENDED), 하단 버튼 · C-03 버튼 숨김, 점검 영역 숨김(값이 null · 빈 배열)은 클라이언트 처리"
        example: |
          {
            "code": 200,
            "message": "구독 상세를 조회했습니다.",
            "data": {
              "subscriptionId": "3f2b...", "status": "ACTIVE", "serviceName": "넷플릭스",
              "logoUrl": "https://.../netflix.png", "category": "VIDEO_OTT", "amount": 13500,
              "billingCycleValue": 1, "billingCycleUnit": "MONTH", "nextBillingDate": "2026-12-01",
              "startedAt": "2026-07-17", "paymentMethod": "APP_STORE", "isSteady": false, "canceledAt": null,
              "yearlyAmount": 162000, "totalPaidAmount": 67500, "paidCount": 5, "dDay": 14,
              "latestCheckup": null,
              "pastCheckups": [],
              "pastCheckupAverage": null
            }
          }

  data_flow:
    - step: 1
      layer: Presentation (SubscriptionController)
      action: "@CurrentUserId UUID userId, @PathVariable UUID subscriptionId, @RequestParam(required = false) LocalDate baseDate → SubscriptionUseCase.getSubscription(userId, subscriptionId, baseDate) → CommonResponse.success(SubscriptionResponseCode.SUBSCRIPTION_FOUND, data)"
    - step: 2
      layer: UseCase (SubscriptionUseCase.getSubscription)
      action: "회원 조회 → 본인 구독 조회 → today = LocalDate.now(), base = baseDate ?: today → SubscriptionDetailResponse.of(subscription, today, baseDate)"
      transaction: "readOnly (클래스 기본)"
    - step: 3
      layer: Domain Service (UserGetService)
      action: "findUserById(userId) — 없으면 UserNotFoundException"
    - step: 4
      layer: Domain Service (SubscriptionGetService)
      action: "findSubscription(User, UUID subscriptionId) — user 일치 AND deleted = false, serviceCatalog fetch join. 없으면 SubscriptionNotFoundException"
    - step: 5
      layer: Domain (Subscription)
      action: "yearlyAmount() (신규), nextBillingOn(base), startedOn(), paidCount(today), totalPaidAmount(today) — SUBSCRIPTION-002 계산 메서드 재사용. statusOn(LocalDate base) (신규): base가 startedOn() ~ canceledOn(없으면 무한) 사이면 ACTIVE"

  database:
    entities:
      - name: Subscription
        action: Read
        table: subscriptions
      - name: ServiceCatalog
        action: Read (fetch join)
        table: services
        fields: "logo_url"
      - name: User
        action: Read
        table: users

  error_codes:
    reused:
      - "40404 SubscriptionErrorCode.SUBSCRIPTION_NOT_FOUND (404) — 없음 · 삭제됨 · 다른 회원 구독 (SUBSCRIPTION-003에서 정의)"
      - "40201 UserErrorCode.USER_NOT_FOUND (404)"
      - "40005 / 40103 / 40104 — 인증 실패 (AUTH-001)"
      - "subscriptionId · baseDate 형식 오류 — MethodArgumentTypeMismatchException은 GlobalExceptionHandler에 핸들러가 없어 Spring 기본 400 (SUBSCRIPTION-002 notes 참고)"

  changes_to_existing_code:
    - target: "SubscriptionRepository"
      change: "findWithServiceByIdAndUser(UUID id, User user) 추가 — @Query: left join fetch s.serviceCatalog, s.deleted = false"
    - target: "SubscriptionGetService"
      change: "findSubscription(User, UUID) 추가 — Optional 반환 (UserGetService.findUserById 패턴), UseCase에서 orElseThrow"
    - target: "Subscription (엔티티)"
      change: "yearlyAmount(), statusOn(LocalDate) 추가"
    - target: "SubscriptionResponseCode"
      change: "SUBSCRIPTION_FOUND(200) 추가"

  security_config:
    note: "변경 없음 — anyRequest().authenticated()로 보호됨"

  validation_rules:
    - "본인 구독만 조회 — 다른 회원 구독 · 삭제된 구독은 SUBSCRIPTION_NOT_FOUND (존재 여부 노출 안 함)"
    - "지금까지 결제 금액 · 횟수는 baseDate와 무관하게 오늘(ENDED면 해지일)까지"

package_structure:
  base: "com.subscribers.gudogging"
  subscription:
    - "domain/subscription/presentation/SubscriptionController.java (수정 — GET /{subscriptionId} 추가)"
    - "domain/subscription/presentation/response/SubscriptionResponseCode.java (수정)"
    - "domain/subscription/application/usecase/SubscriptionUseCase.java (수정 — getSubscription)"
    - "domain/subscription/application/dto/response/SubscriptionDetailResponse.java (신규, record + of())"
    - "domain/subscription/application/dto/response/LatestCheckupResponse.java (신규, record — 필드만)"
    - "domain/subscription/application/dto/response/PastCheckupResponse.java (신규, record — 필드만)"
    - "domain/subscription/application/dto/response/PastCheckupAverageResponse.java (신규, record — 필드만)"
    - "domain/subscription/domain/entity/Subscription.java (수정 — yearlyAmount, statusOn)"
    - "domain/subscription/domain/service/SubscriptionGetService.java (수정)"
    - "domain/subscription/domain/repository/SubscriptionRepository.java (수정)"
  check:
    - "domain/check/domain/result/CheckResultStage.java (신규, enum — 값만)"

testing_strategy:
  # SubscriptionUseCaseTest only (JUnit5 + Mockito) — @Nested GetSubscription
  # Mock: UserGetService, SubscriptionGetService
  # Subscription은 정적 팩토리로 생성, id · createdAt은 ReflectionTestUtils로 지정
  happy_path:
    - "getSubscription: 구독 중이면 결제 금액 · 연 환산 · 다음 결제일 · D-n · 구독 시작일 · 지금까지 결제 횟수와 금액을 반환하고 해지일은 null이다"
    - "getSubscription: 구독 종료면 해지일 · 해지일까지 결제 금액을 반환하고 다음 결제일 · D-n은 null이다"
    - "getSubscription: baseDate를 주면 그 날짜 이후 첫 결제일과, 등록일 ~ 해지일 범위로 판단한 상태를 반환한다"
    - "getSubscription: 직접 입력 서비스는 logoUrl을 null로 반환한다"
    - "getSubscription: 점검 필드는 latestCheckup · pastCheckupAverage를 null로, pastCheckups를 빈 목록으로 반환한다"
  edge_cases:
    - "getSubscription: 없거나 다른 회원의 구독이면 SUBSCRIPTION_NOT_FOUND 예외를 던진다"
    - "getSubscription: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND 예외를 던진다"

notes:
  - "기준: Figma 우선, 그다음 Notion API 명세서 (2026-11-17 대조). 경로 · baseDate · 응답 구조 · 필드명은 Notion을 따름"
  - >
    결정 (2026-11-18): 점검 기록(latestCheckup · pastCheckups · pastCheckupAverage)은 구독 점검 기능 미구현으로 후속 스펙으로 분리.
    응답 필드는 Notion 구조대로 유지하고 고정값(null · 빈 배열) 반환 → 클라이언트는 점검 영역을 숨김 처리.
    후속 스펙 범위: SubscriptionCheckGetService 최근 1건 · 최근 90일 조회, SubscriptionCheckCancelReasonGetService 점검 1건 해지 이유 조회,
    CheckResult(check/domain/result, 활용도 · 단계 — ERD 6.4), CheckAnswer(check/domain/question, 카테고리별 선택지 문구 — ERD 5.5 = Figma CHK-001~007),
    점검 DTO 정적 팩토리, SubscriptionDetailResponse.of 시그니처 확장
  - >
    [후속 스펙 참고 — 2026-11-17 검토 내용] 점검 응답은 Notion대로 선택지 문구(String) 반환, 점검 당시 카테고리 스냅샷(subscription_checks.category) 기준.
    latestCheckup은 기간 제한 없이 최신 1건, cancelReasons는 항상 포함(없으면 빈 배열 — Notion mock data 누락 보완).
    pastCheckups · pastCheckupAverage는 오늘 기준 최근 90일(created_at ≥ (오늘 − 90일) 00:00, baseDate 무관), 평균은 상태와 무관하게 계산(가정).
    평균 문구는 문항별 평균 반올림(HALF_UP) 점수 기준, 활용도는 소수 평균 대입, 보정은 반올림한 계획 점수 기준.
    M-03 · M-05 목업 예시 문구는 점검 선택지와 달라 디자인 수정 요청 대상(Figma 확인 필요). 교육·학습(CHK-004) 설명 패널 미확인
  - "[가정] baseDate(C-03) 동작은 Notion 설명 + ERD 6.2 기준으로 정의. 캘린더 화면(C-03) Figma는 이번에 검토하지 않음 → 캘린더 스펙 작성 때 재확인"
  - "결정 (2026-11-17): '오늘'은 LocalDate.now() (JVM 기본 시간대) — SUBSCRIPTION-002와 동일"
  - "범위 외: 점검 기록 조회 · 활용도 계산(후속 스펙), '꾸준히 쓰는 구독' 토글 변경(Notion PATCH /{subscriptionId}/steady), 편집(SUBSCRIPTION-005), 해지 안내(Notion /cancel-guide), 해지 완료(/cancel), 재등록(/reactivate), 점검 결과 조회(/checkups/{checkupId})"
