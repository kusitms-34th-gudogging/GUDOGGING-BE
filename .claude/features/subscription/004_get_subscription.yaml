notes:
  - "기준: Figma 우선, 그다음 코딩 규칙(ERD 포함), 그다음 Notion API 명세서. 경로 · baseDate · 응답 구조 · 필드명은 Notion을 따름 (2026-11-17 대조, 2026-11-21 점검 필드 재대조)"
  - >
    [Figma 대조 2026-11-21]
    M-03 Description '4. 지난 점검': 기간은 최근 3개월 고정(칩은 기간 표시용, 탭 불가) 예: '8월~10월 결과' / 최근 3개월 점검 기록의 응답값 평균으로 표시 /
    이용도 · 만족도 · 다음 달: 문항별 응답 점수(1~5) 평균을 반올림한 점수의 선택지 문구 / 점검 결과: 평균 응답으로 계산한 활용도 % + 구간 단계(예: 유지 추천(92%)) /
    3개월 안 점검 기록이 1건이면 그 기록 그대로, 없으면 영역 숨김.
    M-05 Description '3. 마지막 점검': 이 구독의 가장 최근 점검 데이터 1건: 점검 결과 · 이용도 · 만족도 · 다음 달 · 해지 이유. 시안 배지 '10월 3일 점검 · 해지', 해지 이유는 글 상자 하나(직접 입력 문장).
    C-03 Description '4. 최근 점검': 이 서비스의 점검 결과 중 가장 최근 결과 — 점검일 · 점검 결과(단계 · %) · 이용도 · 만족도 · 다음 달 · 메모. 시안 배지 '10월 3일 점검'.
    K-90 '저장한 이유는 나중에 다시 구독을 고민할 때(재등록) 보여줌'
  - "[결정 2026-11-21 사용자] 평균 기간 = 이번 달 포함 최근 3개월(두 달 전 1일 ~ 오늘) — Figma 설명 예시 '8월~10월 결과' 기준. Notion(오늘 − 90일)과 ERD 6.4(최근 90일)는 이 결정으로 대체. pastCheckups도 같은 기간"
  - "[확인 필요 · 디자인] M-03 시안 배지는 '3월~6월 결과'(달 4개)로 설명 예시 '8월~10월 결과'(달 3개)와 다름 — 설명 문구('최근 3개월')를 기준으로 함"
  - "[결정 2026-11-21 사용자] 평균 기간에 카테고리가 다른 점검이 섞이면 이용도 평균 문구는 기간 내 가장 최근 점검의 카테고리 선택지 (Notion '점검 당시 카테고리 스냅샷 기준'을 평균에 적용한 방식). 만족도 · 다음 달은 공통 선택지라 영향 없음"
  - "[결정 변경 2026-11-21 사용자] 해지 이유는 선택지 코드(cancelReasons) + 직접 입력(cancelReasonText) 둘 다 내려줌 — Figma K-90 '선택지 복수 선택' · '저장한 이유는 나중에 다시 구독을 고민할 때(재등록) 보여줌' 흐름 기준. 같은 날 'cancelReasonText만'으로 정했다가 Figma 흐름 대조에서 선택지만 고른 해지는 M-05에 이유가 안 보이는 문제를 확인해 되돌림. 코드 → 카테고리별 문구는 클라이언트 (CHECK-004). 건너뛰기면 둘 다 비어 있음"
  - "[결정] 활용도 평균 계산은 ERD 6.4(코딩 규칙)대로 문항별 소수 평균을 공식에 그대로 대입, 보정은 반올림한 계획 점수 기준. Figma · Notion '평균 응답으로 계산한 활용도'는 계산 방식을 정하지 않아 ERD를 따름. 1건이면 저장된 score_percent · stage 그대로"
  - "[결정] 점검일(checkedAt) = subscription_checks.created_at 날짜 (점검 제출일). 결정일(decided_at)이 아님"
  - "[결정] latestCheckup은 기간 제한 없음 — M-05 · C-03 '가장 최근 점검 1건'. 구독 상태와 무관하게 세 필드 모두 내려주고 화면별 사용은 클라이언트가 고름 (Notion 구조)"
  - "[결정] 평균 · 원본 기록은 결정 여부(decision)와 무관하게 포함 (2026-11-17 검토의 '상태와 무관' 가정 유지)"
  - "[대체됨] 2026-11-17 검토 메모의 '최근 90일' · CheckResult / CheckAnswer 클래스명은 위 결정과 CHECK-001~004 구현(CheckScore · CheckResultStage · CheckupForm)으로 대체 ('cancelReasons 항상 포함'은 결과적으로 유지)"
  - >
    [Notion 수정 필요]
    ① pastCheckupAverage.periodFrom '오늘 − 90일, 예: 3월~6월' → 두 달 전 1일(예: 8월~10월), pastCheckups '최근 90일' → 같은 기간
    ② 표 'cancelReasonText … 선택지 코드는 내려주지 않는다' → latestCheckup.cancelReasons(코드 목록, K-90 순서) 표 항목 추가 (mock에는 이미 있음), mock data에 pastCheckupAverage 누락 추가
    ③ totalPaidAmount · paidCount '현재 금액 기준 근사값 · billing_anchor_on 기준' → 결제 조건 이력 기준 정확한 값 (ERD v1.7, 2026-11-19 구현)
    ④ isSteady 설명 '사용 현황에서 제외' → Figma M-03 기준 제외 범위(D-3 점검 알림 · 홈 점검 유도 · 결제 예정 점검 버튼) (SUBSCRIPTION-012)
    ⑤ latestCheckup.decision에 null(결정 전) 가능 명시
  - "[참고] M-03 · M-05 · C-03 시안의 응답 예시 문구('한 달 6~10편 봤어요' 등)는 CheckupForm 선택지와 다름 — 서버는 선택지 문구를 내려줌 (2026-11-17부터 디자인 수정 요청 대상)"
  - "결정 (2026-11-17): '오늘'은 LocalDate.now() (JVM 기본 시간대) — SUBSCRIPTION-002와 동일"
  - "범위 외: '꾸준히 쓰는 구독' 토글 변경(SUBSCRIPTION-012), 편집(SUBSCRIPTION-005), 해지 안내(SUBSCRIPTION-006), 해지 완료(SUBSCRIPTION-007), 재등록(SUBSCRIPTION-008), 점검 결과 조회(CHECK-003)"
