# Feature Specification
# Status: Implemented
# Last Updated: 2026-11-20 (구현 완료, SUBSCRIPTION-011에서 lastStep INPUT_SUBSCRIPTION · editingItemIndex 확장)

meta:
  id: SUBSCRIPTION-009
  title: 구독 등록 임시저장
  type: Feature
  author: 1winhyun
  source: >
    Figma 디자인 작업소 (9cBKdlwBBUqHndoKPsrDfX) › 구독 등록(직접 등록 및 공통 화면) —
    SUB-001 A-01 '등록 중이던 정보 확인', A-02 / A-02s 서비스 선택 · 직접 입력하기,
    SUB-002 A-04 미입력 / 입력 완료 상태 · A-03 / A-03s 저장하기('필수 정보 일부만 입력한 상태에서 임시 저장 불가능'),
    SUB-004 A-03c 이탈 팝업 · A-01s 불러오기 팝업 · A-05 '임시 등록 정보는 저장하지 않음'.
    Notion API 명세서 '구독 등록 임시저장' (PUT /api/v1/subscriptions/drafts)
  depends_on:
    - AUTH-001          # JWT 인증 필터, @CurrentUserId
    - USER-001          # UserErrorCode.USER_NOT_FOUND, UserNotFoundException
    - SUBSCRIPTION-001  # 등록 성공 시 임시저장 삭제 (changes_to_existing_code), DuplicateServiceInRequestException 재사용

overview:
  summary: >
    직접 등록 흐름(A-02 → A-04 ⇄ A-03 / A-03s)에서 사용자가 선택한 구독 목록과 저장한 결제 정보, 마지막 화면(lastStep)을
    서버(Redis)에 회원당 1건으로 덮어써 저장한다. 앱이 강제 종료되는 등 팝업 없이 이탈해도 다음 A-01 진입 때
    불러오기 팝업(A-01s)으로 이어서 작성할 수 있게 한다. 구독 등록(POST /api/v1/subscriptions)이 성공하면 임시저장을 삭제한다.
  user_story: >
    As a 구독을 직접 등록하던 회원, I want to 등록 도중 앱을 나가도 선택한 서비스와 입력한 결제 정보가 남아 있기를,
    so that 다시 들어왔을 때 처음부터 입력하지 않고 이어서 등록할 수 있다.
  goals:
    - A-04 목록 상태(선택한 서비스 + 항목별 미입력 / 입력 완료) 그대로 저장 — 회원당 1건, 덮어쓰기
    - Figma 규칙 보장 — 항목은 '결제 정보 전부 미입력' 또는 '필수 정보 전부 입력'만 허용 (일부 입력 저장 불가)
    - 등록 완료 후 임시저장 재노출 방지 — SUBSCRIPTION-001 성공 시 서버에서 삭제

technical_spec:
  api:
    - method: PUT
      path: /api/v1/subscriptions/drafts
      summary: 구독 등록 임시저장 (회원당 1건, 덮어쓰기)
      auth: Required (Authorization Bearer Access Token)
      request:
        dto: SaveSubscriptionDraftRequest
        fields:
          - name: lastStep
            type: SubscriptionDraftStep
            required: true
            validation: "@NotNull (SELECT_SERVICES = A-02 / CONFIRM_SUBSCRIPTIONS = A-04 / INPUT_SUBSCRIPTION = A-03 · A-03s — SUBSCRIPTION-011에서 추가). 불러오기 때 이 화면으로 복원"
          - name: editingItemIndex
            type: Integer
            required: false
            validation: "SUBSCRIPTION-011에서 추가. lastStep = INPUT_SUBSCRIPTION일 때 입력 · 수정 중이던 items 순번(0부터), 새 직접 입력이면 null. 다른 lastStep이면 null — @AssertTrue isEditingItemIndexValid()"
          - name: items
            type: List<SubscriptionDraftItemRequest>
            required: true
            validation: "@NotEmpty, @Size(max = 50), 요소 @Valid. 요청 순서대로 저장"
        item_dto: SubscriptionDraftItemRequest
        item_fields:
          - name: serviceId
            type: UUID
            required: false
            validation: "있으면 사전 등록 서비스(A-02에서 선택), null이면 직접 입력 서비스(A-03s). 서비스 존재 · 활성 여부는 검사하지 않음 (등록 시 SUBSCRIPTION-001이 검사)"
          - name: serviceName
            type: String
            required: true
            validation: >
              @NotBlank, @Size(max = 50) (services.name VARCHAR(50)). 앞뒤 공백 제거(strip) 후 저장.
              직접 입력 서비스(serviceId == null)는 strip 후 30자 이하 — @AssertTrue isCustomServiceNameValid() (A-03s '최소 1자, 최대 30자')
          - name: category
            type: Category
            required: false
            validation: "결제 정보 묶음 (아래 '결제 정보 묶음 규칙')"
          - name: amount
            type: Integer
            required: false
            validation: "@Positive (원 단위). 결제 정보 묶음"
          - name: billingCycleValue
            type: Integer
            required: false
            validation: "@Min(1), @Max(31). 결제 정보 묶음"
          - name: billingCycleUnit
            type: BillingCycleUnit
            required: false
            validation: "DAY / WEEK / MONTH / YEAR. 결제 정보 묶음"
          - name: nextBillingDate
            type: LocalDate
            required: false
            validation: "yyyy-MM-dd. 과거 날짜 검사 안 함 (아래 validation_rules 참고). 결제 정보 묶음"
          - name: paymentMethod
            type: PaymentMethod
            required: false
            validation: "WEB_DIRECT / APP_STORE / GOOGLE_PLAY. 결제 정보 묶음"
        payment_info_group_rule: >
          결제 정보 묶음 = category, amount, billingCycleValue, billingCycleUnit, nextBillingDate, paymentMethod.
          (1) 사전 등록 서비스: 6개 전부 null(A-04 '결제 정보 미입력') 또는 6개 전부 값 있음('입력 완료')
          — @AssertTrue isPaymentInfoAllOrNone(), message "결제 정보는 모두 입력하거나 모두 비워 두어야 합니다."
          (2) 직접 입력 서비스: 6개 전부 값 있음 (A-03s 저장하기를 눌러야 A-04 목록에 추가되므로 미입력 상태가 없음)
          — @AssertTrue isCustomPaymentInfoComplete(), message "직접 입력 서비스는 결제 정보를 모두 입력해야 합니다."
          @AssertTrue 메서드는 기존 SubscriptionItemRequest처럼 @JsonIgnore
        example: |
          {
            "lastStep": "CONFIRM_SUBSCRIPTIONS",
            "items": [
              { "serviceId": "5e1c9a07-5a4d-4e7b-9c21-000000000001", "serviceName": "Netflix",
                "category": "VIDEO_OTT", "amount": 17000, "billingCycleValue": 1, "billingCycleUnit": "MONTH",
                "nextBillingDate": "2026-12-01", "paymentMethod": "WEB_DIRECT" },
              { "serviceId": "5e1c9a07-5a4d-4e7b-9c21-000000000002", "serviceName": "유튜브 프리미엄",
                "category": null, "amount": null, "billingCycleValue": null, "billingCycleUnit": null,
                "nextBillingDate": null, "paymentMethod": null },
              { "serviceId": null, "serviceName": "동네 헬스장",
                "category": "ETC", "amount": 50000, "billingCycleValue": 1, "billingCycleUnit": "MONTH",
                "nextBillingDate": "2026-11-25", "paymentMethod": "WEB_DIRECT" }
            ]
          }
      response:
        dto: SubscriptionDraftSaveResponse
        http_status: 200 OK
        response_code: "SubscriptionResponseCode.SUBSCRIPTION_DRAFT_SAVED (200, HttpStatus.OK, \"임시저장했습니다.\")"
        wrapper: CommonResponse<SubscriptionDraftSaveResponse>
        fields:
          - name: savedAt
            type: LocalDateTime
            description: "서버 저장 시각 (ISO 8601 초 단위, 예: 2026-11-07T16:30:00 — 2026-11-20 /fix로 초 미만 절삭) — 임시저장에 함께 저장"
        factory: "SubscriptionDraftSaveResponse.from(SubscriptionDraft)"
        example: |
          {
            "code": 200,
            "message": "임시저장했습니다.",
            "data": { "savedAt": "2026-11-20T16:30:00" }
          }

  data_flow:
    - step: 1
      layer: Presentation (SubscriptionController)
      action: "@PutMapping(\"/drafts\") — @CurrentUserId UUID userId, @Valid @RequestBody SaveSubscriptionDraftRequest → SubscriptionUseCase.saveSubscriptionDraft(userId, request) → CommonResponse.success(SubscriptionResponseCode.SUBSCRIPTION_DRAFT_SAVED, response)"
    - step: 2
      layer: UseCase (SubscriptionUseCase.saveSubscriptionDraft)
      action: "회원 확인 → 요청 내 serviceId 중복 검사 → SubscriptionDraft 생성(savedAt = LocalDateTime.now().truncatedTo(ChronoUnit.SECONDS)) → 저장 → SubscriptionDraftSaveResponse.from(draft)"
      transaction: "true (@Transactional — 쓰기 메서드 규칙, AuthUseCase.reissueToken과 동일. Redis 저장은 DB 트랜잭션과 묶이지 않음)"
    - step: 3
      layer: Domain Service (UserGetService)
      action: "findUserById(userId) — 없거나 탈퇴했으면 UserNotFoundException"
    - step: 4
      layer: UseCase
      action: "serviceId != null 인 항목의 serviceId가 중복되면 DuplicateServiceInRequestException (A-02 '동일 서비스 중복 선택 불가', SUBSCRIPTION-001과 같은 검사)"
    - step: 5
      layer: Domain (SubscriptionDraft · SubscriptionDraftItem, record — 신규)
      action: >
        항목마다 SubscriptionDraftItem.of(serviceId, serviceName.strip(), category, amount, billingCycleValue,
        billingCycleUnit, nextBillingDate, paymentMethod) (UseCase private toDraftItem) →
        SubscriptionDraft.of(userId, lastStep, editingItemIndex, items, savedAt) (editingItemIndex는 SUBSCRIPTION-011). 순수 값 객체 (JPA 엔티티 아님)
    - step: 6
      layer: Domain Service (SubscriptionDraftService — 신규)
      action: "saveDraft(SubscriptionDraft) → SubscriptionDraftRepository.save (RefreshTokenService 패턴)"
    - step: 7
      layer: Infrastructure (RedisSubscriptionDraftRepository — 신규, implements SubscriptionDraftRepository)
      action: >
        key 'subscription-draft:{userId}', value = SubscriptionDraft JSON (JsonMapper 직렬화).
        StringRedisTemplate.opsForValue().set — TTL 없음, 기존 값이 있으면 덮어씀 (회원당 1건)

  database:
    entities: [ ]
    note: "MySQL 변경 없음 (엔티티 · 테이블 추가 없음)"
    redis:
      key: "subscription-draft:{userId}"
      value: "SubscriptionDraft JSON { userId, lastStep, editingItemIndex, items[], savedAt } (editingItemIndex는 SUBSCRIPTION-011)"
      ttl: "없음 (Notion '임시저장은 따로 만료되지 않음')"
      deleted_when: "SUBSCRIPTION-001 등록 성공 (이 스펙), DELETE /api/v1/subscriptions/drafts (SUBSCRIPTION-010)"
    reads:
      - name: User
        action: Read
        table: users

  error_codes:
    new: "없음"
    reused:
      - "40402 SubscriptionErrorCode.DUPLICATE_SERVICE_IN_REQUEST (400) — 같은 serviceId가 2번 이상"
      - "40001 INVALID_ARGUMENT (400) — DTO 검증 실패 (결제 정보 묶음 규칙 · 서비스명 · 금액 · 주기 범위 등, data = List<ErrorResponse>)"
      - "40002 JSON_PARSE_ERROR (400) — 잘못된 enum(lastStep 포함) · 날짜 형식 · int 범위 초과"
      - "40201 UserErrorCode.USER_NOT_FOUND (404)"
      - "40005 / 40103 / 40104 — 인증 실패 (AUTH-001)"

  changes_to_existing_code:
    - target: "SubscriptionUseCase.createSubscriptions (SUBSCRIPTION-001)"
      change: >
        subscriptionCreateService.createSubscriptions(...) 성공 후 subscriptionDraftService.deleteDraft(userId) 호출
        (Figma A-05 '임시 등록 정보는 저장하지 않음', A-01s '등록 완료 후 재노출하지 않음'). source와 무관하게 삭제.
        등록 실패(예외)면 호출되지 않아 임시저장 유지 ('등록 실패 시 기존 입력 정보 유지')
    - target: "SubscriptionResponseCode"
      change: "SUBSCRIPTION_DRAFT_SAVED(200, HttpStatus.OK, \"임시저장했습니다.\") 추가"
    - target: "SubscriptionController"
      change: "@PutMapping(\"/drafts\") saveSubscriptionDraft 추가 (+ Swagger @Operation · @ApiResponses, 기존 메서드 형식)"
    - target: "docs/ERD.md (구현 시, v1.8)"
      change: >
        9장 '구독 등록 중 임시 정보' 처리를 '클라이언트 로컬' → 'Redis subscription-draft:{userId} (회원당 1건, TTL 없음, 등록 성공 · 삭제 API로 삭제)'로,
        10.1 #1을 '구독 등록 임시 정보는 서버(Redis), 점검 중 응답은 클라이언트 로컬'로 변경 + 변경 이력 추가
    - target: ".claude/features/subscription/001_create_subscriptions.yaml (구현 시)"
      change: "notes의 '[보류] 등록 성공 시 서버 임시저장 삭제' → SUBSCRIPTION-009에서 결정 · 반영으로 갱신, '임시 등록 정보는 클라이언트 로컬' 문장 수정"

  security_config:
    note: "변경 없음 — anyRequest().authenticated()로 보호됨"

  validation_rules:
    - "본인 임시저장만 저장 — userId는 Access Token에서만 받는다"
    - "회원당 1건 — 기존 임시저장은 새 요청으로 통째로 덮어씀 (부분 병합 없음)"
    - "items 1~50개 (Notion '1개 이상', 상한은 SUBSCRIPTION-001과 동일)"
    - "lastStep 필수 — SELECT_SERVICES / CONFIRM_SUBSCRIPTIONS / INPUT_SUBSCRIPTION (SUBSCRIPTION-011)"
    - "editingItemIndex는 lastStep = INPUT_SUBSCRIPTION일 때만 — null 또는 items 범위 안 순번 (SUBSCRIPTION-011)"
    - "serviceName 필수(strip 후 저장), 직접 입력 서비스는 strip 후 1~30자"
    - "사전 등록 서비스: 결제 정보 6개 전부 null 또는 전부 입력 (일부 입력 저장 불가 — Figma A-03)"
    - "직접 입력 서비스: 결제 정보 6개 전부 입력"
    - "값이 있으면 amount > 0, billingCycleValue 1~31 (A-03 입력 조건과 동일)"
    - "nextBillingDate는 과거 날짜도 허용 — 어제 저장한 '오늘' 결제일이 다음 날 그대로 다시 저장될 수 있으므로. 과거 날짜는 등록(SUBSCRIPTION-001 @FutureOrPresent) 때 거부"
    - "같은 serviceId 중복 불가 (A-02 '동일 서비스 중복 선택 불가')"
    - "serviceId의 존재 · 활성 · 이미 구독 중 여부는 검사하지 않음 — 등록 시점에 SUBSCRIPTION-001이 검사"

package_structure:
  base: "com.subscribers.gudogging.domain.subscription"
  files:
    - "presentation/SubscriptionController.java (수정 — PUT /drafts)"
    - "presentation/response/SubscriptionResponseCode.java (수정 — SUBSCRIPTION_DRAFT_SAVED)"
    - "application/usecase/SubscriptionUseCase.java (수정 — saveSubscriptionDraft, createSubscriptions에 deleteDraft)"
    - "application/dto/request/SaveSubscriptionDraftRequest.java (신규, record)"
    - "application/dto/request/SubscriptionDraftItemRequest.java (신규, record + @AssertTrue 3개)"
    - "application/dto/response/SubscriptionDraftSaveResponse.java (신규, record + from(SubscriptionDraft))"
    - "domain/draft/SubscriptionDraft.java (신규, record + of())"
    - "domain/draft/SubscriptionDraftItem.java (신규, record + of())"
    - "domain/draft/SubscriptionDraftStep.java (신규, enum 값만: SELECT_SERVICES, CONFIRM_SUBSCRIPTIONS — INPUT_SUBSCRIPTION은 SUBSCRIPTION-011에서 추가)"
    - "domain/repository/SubscriptionDraftRepository.java (신규, interface: save, deleteByUserId — findByUserId는 SUBSCRIPTION-011에서 추가)"
    - "domain/service/SubscriptionDraftService.java (신규: saveDraft, deleteDraft)"
    - "infrastructure/RedisSubscriptionDraftRepository.java (신규, StringRedisTemplate + JsonMapper)"

testing_strategy:
  # SubscriptionUseCaseTest only (JUnit5 + Mockito)
  # Mock: UserGetService, SubscriptionDraftService (+ createSubscriptions 기존 mock)
  # saveDraft 인자는 ArgumentCaptor<SubscriptionDraft>로 검증
  happy_path:
    - "saveSubscriptionDraft: 사전 등록 입력 완료 · 사전 등록 미입력(결제 정보 null) · 직접 입력 항목을 요청 순서대로 userId · lastStep과 함께 저장하고, 저장한 savedAt을 응답한다"
    - "saveSubscriptionDraft: 서비스명은 앞뒤 공백을 제거해 저장한다"
    - "createSubscriptions: 등록에 성공하면 회원의 임시저장을 삭제한다 (deleteDraft(userId) 호출)"
  edge_cases:
    - "saveSubscriptionDraft: 같은 serviceId가 두 번 있으면 DUPLICATE_SERVICE_IN_REQUEST 예외를 던지고 저장하지 않는다"
    - "saveSubscriptionDraft: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND 예외를 던지고 저장하지 않는다"
    - "createSubscriptions: 이미 구독 중인 서비스가 있어 등록에 실패하면 임시저장을 삭제하지 않는다"
  test_files:
    - "test/.../domain/subscription/application/usecase/SubscriptionUseCaseTest.java (수정 — SaveSubscriptionDraft @Nested 추가, CreateSubscriptions에 삭제 검증 추가)"

notes:
  - "결정 (2026-11-20, 사용자 위임 '앱에서 이탈 시 임시저장하는 가장 좋은 방법'): 서버 Redis 저장. 이유 — ① 회원당 1건을 화면 전환마다 통째로 덮어쓰는 임시 데이터라 key-value SET이 맞고, MySQL이면 Hard Delete 금지 때문에 삭제 · 재저장마다 Soft Delete 행 되살리기 규칙이 필요함 ② 이력 · 조회 조건이 없어 테이블 · ERD 엔티티가 늘 필요 없음 ③ RefreshToken(domain 인터페이스 + infrastructure 어댑터) 선례가 있어 구조가 같음. 감수: Redis 재시작 · 유실 시 임시저장이 사라짐 → 불러오기 팝업이 안 뜰 뿐 등록 기능에는 영향 없음"
  - "결정 (2026-11-20, 사용자): 등록 성공 시 임시저장 삭제는 서버가 보장 (이 스펙에 포함). 클라이언트가 DELETE를 빠뜨려도 재노출되지 않음"
  - "ERD 10.1 #1(2026-11-16 '구독 등록 임시 정보는 클라이언트 로컬')을 이 스펙으로 대체 — 점검 중 임시 응답은 클라이언트 로컬 유지"
