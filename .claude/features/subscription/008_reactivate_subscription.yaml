  - "[주의] ERD 10.1 #2 '시작일 = created_at' 결정을 바꿈 — startedOn()을 쓰는 feat/#28(승현님) 계산이 재등록일 기준으로 바뀌므로 공유 필요"
  - "[결정] 구독 중인 구독 재등록은 신규 에러 40407 (2026-11-18 합의)"
