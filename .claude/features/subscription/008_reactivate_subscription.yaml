# Feature Specification
# Status: Implemented
# Last Updated: 2026-11-18

meta:
  id: SUBSCRIPTION-008
  title: 구독 종료 구독 재등록
  type: Feature
  author: parkdo0918
  issue: "#31"
  depends_on:
    - AUTH-001   # JWT 인증 필터, @CurrentUserId
    - SUBSCRIPTION-001~005   # feat/#28 — SubscriptionUseCase/Controller/GetService/ErrorCode 재사용
    - SUBSCRIPTION-007   # 해지 완료 처리 (ENDED가 되는 경로)
  base_branch: "feat/#31 ← origin/feat/#28"

overview:
  summary: >
    구독 종료 상세(M-05)에서 '재등록하기'를 누르면 같은 구독 행을 다시 구독 중(ACTIVE)으로 바꾼다.
    새 다음 결제일을 입력받아 결제 기준일(billing_anchor_on)로 저장하고 해지일을 지우며, 구독 시작일(started_on)을 재등록일(오늘)로 바꾼다.
    기존 점검 기록은 그대로 유지한다. 시작일을 다시 잡으므로 '지금까지 결제 횟수·금액'과 캘린더에 쉬었던 기간이 들어가지 않는다.
  user_story: >
    As a 로그인한 회원, I want to 해지했던 구독을 다시 구독 중으로 돌리기를,
    so that 처음부터 다시 등록하지 않고 결제일만 새로 입력해 관리를 이어갈 수 있다.
  goals:
    - 본인 구독(ENDED)을 같은 행 그대로 ACTIVE로 변경 (subscriptionId 유지)
    - billing_anchor_on = 요청 nextBillingDate, canceled_on = NULL, started_on = 오늘
    - subscriptions.started_on 컬럼 추가 (노션 ERD 반영) — 구독 시작일을 created_at 대신 이 컬럼으로 계산
    - 같은 서비스가 이미 구독 중이면 중복 에러

technical_spec:
  api:
    - method: PATCH
      path: /api/v1/subscriptions/{subscriptionId}/reactivate
      summary: 구독 종료 구독 재등록
      auth: Required (Authorization Bearer Access Token)
      request:
        user_id: "@CurrentUserId UUID userId"
        path_params:
          - name: subscriptionId
            type: UUID
            required: true
        body:
          dto: ReactivateSubscriptionRequest (record, @Valid)
          fields:
            - "nextBillingDate (LocalDate, yyyy-MM-dd): @NotNull @FutureOrPresent — 새 다음 결제일 (구독 편집과 같은 규칙: 과거 불가)"
          mock: |
            {
              "nextBillingDate": "2026-12-15"
            }
      response:
        http_status: 200 OK
        dto: SubscriptionReactivationResponse
        wrapper: CommonResponse<SubscriptionReactivationResponse>
        response_code: "SubscriptionResponseCode.SUBSCRIPTION_REACTIVATED (200, HttpStatus.OK, \"구독을 재등록했습니다.\")"
        fields:
          - "subscriptionId (UUID): 구독 ID (요청과 같음)"
          - "status (Enum): ACTIVE"
        mock: |
          {
            "code": 200,
            "message": "구독을 재등록했습니다.",
            "data": {
              "subscriptionId": "3f2b8c1e-5a4d-4e7b-9c21-000000000001",
              "status": "ACTIVE"
            }
          }

  data_flow:
    - step: 1
      layer: Presentation (SubscriptionController)
      action: "@CurrentUserId userId, @PathVariable subscriptionId, @RequestBody @Valid ReactivateSubscriptionRequest → SubscriptionUseCase.reactivateSubscription(userId, subscriptionId, request) → CommonResponse.success(SUBSCRIPTION_REACTIVATED, response)"
    - step: 2
      layer: UseCase (SubscriptionUseCase)
      action: >
        회원 확인 → 본인 구독 조회 → status가 ACTIVE면 SubscriptionNotEndedException(40407)
        → 사전 등록 서비스(serviceCatalog != null)이고 그 서비스 ID가 findActiveServiceIds(user)에 있으면 DuplicateSubscriptionException(40401)
        → subscription.reactivate(request.nextBillingDate(), LocalDate.now()) → SubscriptionReactivationResponse.from(subscription)
      transaction: "@Transactional (쓰기) — 변경 감지로 저장"
    - step: 3
      layer: Domain Service
      action: >
        UserGetService.findUserById(userId) — 없으면 UserNotFoundException /
        SubscriptionGetService.findSubscription(user, subscriptionId) — 없거나 삭제·다른 회원 것이면 SubscriptionNotFoundException(40404) /
        SubscriptionGetService.findActiveServiceIds(user) — 중복 검사 (기존 메서드 재사용)
    - step: 4
      layer: Domain (Subscription)
      action: "reactivate(billingAnchorOn, today): status = ACTIVE, canceledOn = null, billingAnchorOn = 새 다음 결제일, startedOn = today (신규 메서드)"

  entity_change:
    target: "Subscription (subscriptions)"
    add_column:
      name: started_on
      type: DATE
      nullable: false
      description: "구독 시작일. 등록 시 = 등록일, 재등록 시 = 재등록일 (노션 ERD의 started_on)"
    set_on_create: >
      @PrePersist에서 startedOn이 null이면 LocalDate.now() — BaseEntity.createdAt과 같은 방식.
      팩토리(createFromCatalog · createCustom) 시그니처는 바꾸지 않음
    calc_change: >
      startedOn()이 created_at 날짜 대신 started_on을 반환. 이를 쓰는 paidCount · totalPaidAmount · statusOn(캘린더) ·
      상세 응답 startedAt이 모두 재등록일 기준이 됨 (각 메서드 코드는 그대로)
    migration: |
      -- 구버전 · 새 버전이 함께 동작하는 동안에도 구독 등록이 실패하지 않도록 3단계로 나눈다 (구버전 INSERT에는 started_on이 없음).
      -- 1) 새 버전 배포 전: NULL 허용 컬럼만 추가 → 구버전 INSERT는 started_on = NULL로 계속 성공
      ALTER TABLE subscriptions ADD COLUMN started_on DATE NULL;
      -- 2) 새 버전 배포 (엔티티는 nullable = false지만 ddl-auto=update는 기존 컬럼을 바꾸지 않고, validate는 NULL 허용 여부를 검사하지 않음)
      -- 3) 구버전 인스턴스가 모두 종료된 뒤: 구버전이 만든 NULL 행까지 등록일로 채우고 NOT NULL 적용
      UPDATE subscriptions SET started_on = DATE(created_at) WHERE started_on IS NULL;
      ALTER TABLE subscriptions MODIFY started_on DATE NOT NULL;
      -- 운영은 아직 subscriptions 테이블이 없어 해당 없음 — 최초 생성(JPA_DDL_AUTO=update 1회) 시 started_on NOT NULL로 만들어짐

  error_codes:
    - code: 40401
      name: DUPLICATE_SUBSCRIPTION
      status: 409
      message: "이미 구독 중인 서비스가 포함되어 있습니다."
      note: 기존 재사용 — 같은 서비스는 ACTIVE 하나만 (등록 때와 같은 규칙)
    - code: 40404
      name: SUBSCRIPTION_NOT_FOUND
      status: 404
      message: "구독을 찾을 수 없습니다."
      note: 기존 재사용
    - code: 40407
      name: SUBSCRIPTION_NOT_ENDED
      status: 409 CONFLICT
      message: "구독 종료된 구독만 재등록할 수 있습니다."
      note: 신규 (2026-11-18 합의)
    - code: "공통 400"
      name: 요청 검증 실패
      note: "nextBillingDate 누락 또는 과거 날짜 (@Valid)"

  validation_rules:
    - "본인 구독만 — 다른 회원 구독·삭제된 구독은 SUBSCRIPTION_NOT_FOUND (40404)"
    - "ENDED 구독만 재등록 가능 — ACTIVE면 SUBSCRIPTION_NOT_ENDED (40407)"
    - "사전 등록 서비스는 같은 회원의 같은 service_id ACTIVE 구독이 있으면 DUPLICATE_SUBSCRIPTION (40401). 직접 입력 구독(service_id NULL)은 검사하지 않음"
    - "변경 컬럼은 status · canceled_on · billing_anchor_on · started_on 4개뿐 — 금액·주기·결제 경로·카테고리·is_steady_use는 그대로"

  side_effects:
    - "점검 기록(subscription_checks)·해지 이유는 유지 (API 명세)"
    - "점검 알림 재개: status = ACTIVE로 결정되는 규칙이라 이 API에서 별도 처리 없음"

package_structure:
  base: "com.subscribers.gudogging.domain.subscription"
  files:
    - "presentation/SubscriptionController.java (수정 — reactivateSubscription 핸들러)"
    - "presentation/response/SubscriptionResponseCode.java (수정 — SUBSCRIPTION_REACTIVATED)"
    - "application/usecase/SubscriptionUseCase.java (수정 — reactivateSubscription)"
    - "application/dto/request/ReactivateSubscriptionRequest.java (신규, record)"
    - "application/dto/response/SubscriptionReactivationResponse.java (신규, record + from)"
    - "application/exception/SubscriptionErrorCode.java (수정 — SUBSCRIPTION_NOT_ENDED 40407)"
    - "application/exception/SubscriptionNotEndedException.java (신규)"
    - "domain/entity/Subscription.java (수정 — startedOn 필드(started_on) · @PrePersist · reactivate(billingAnchorOn, today) 추가, startedOn()이 필드 반환)"
    - "domain/service/SubscriptionGetService.java (변경 없음 — findSubscription · findActiveServiceIds 재사용)"

testing_strategy:
  # SubscriptionUseCaseTest — Mock: UserGetService, SubscriptionGetService
  happy_path:
    - "reactivateSubscription: ENDED 구독을 ACTIVE로 바꾸고 canceledOn을 null, billingAnchorOn을 요청 nextBillingDate, startedOn을 오늘로 저장한다"
    - "reactivateSubscription: 재등록 후 지금까지 결제 횟수는 재등록일부터 센다 (쉬었던 기간의 결제일을 세지 않음)"
    - "reactivateSubscription: 재등록 후 재등록일 전 날짜(baseDate)로 상세를 조회하면 ENDED, 다음 결제일 · D-n은 null (코드래빗 리뷰 반영)"
    - "reactivateSubscription: 응답에 같은 subscriptionId와 status(ACTIVE)를 담는다"
    - "reactivateSubscription: 금액 · 주기 · 결제 경로 · 꾸준히 쓰는 구독 여부는 바뀌지 않는다"
  edge_cases:
    - "reactivateSubscription: 직접 입력 구독(serviceCatalog = null)은 중복 검사 없이 재등록한다"
    - "reactivateSubscription: 같은 서비스를 이미 구독 중이면 DUPLICATE_SUBSCRIPTION(40401) 예외를 던지고 상태를 바꾸지 않는다"
    - "reactivateSubscription: 이미 ACTIVE인 구독이면 SUBSCRIPTION_NOT_ENDED(40407) 예외를 던진다"
    - "reactivateSubscription: 구독이 없거나 다른 회원 것이면 SUBSCRIPTION_NOT_FOUND(40404) 예외를 던진다"
    - "reactivateSubscription: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND 예외를 던진다"
  test_files:
    - "test/.../domain/subscription/application/usecase/SubscriptionUseCaseTest.java (수정 — @Nested 추가. 기존 persisted() 헬퍼 2곳은 createdAt과 함께 startedOn도 지정)"

docs_to_update:
  - "references/data-model/domains/subscription/subscription.yaml — started_on 컬럼, reactivate, startedOn() 설명 반영"
  - "core/system-design.yaml — 404xx 에러코드 목록에 40407 추가 (목록이 있으면)"

