# Feature Specification
# Status: Implemented
# Last Updated: 2026-11-21

meta:
  id: USER-002
  title: 내 정보 조회 (마이페이지 계정)
  type: Feature
  author: 1winhyun
  source: >
    Figma 디자인 작업소(9cBKdlwBBUqHndoKPsrDfX) › 화면 설계서 › 마이페이지 › 마이페이지 및 계정 연동(MYP-001, 1854:15283) —
    E-01 마이페이지(1854:14428), E-02 Gmail 연동 미연결(1854:14506), E-03 Gmail 연동 연결됨(1854:14557), Description 1854:15289
  api_doc: "Notion API 명세서 › 내 정보 조회 (마이페이지 계정) — https://app.notion.com/p/0e7885ef282183229d2c01cd1ac9551e (GET /api/v1/users/me, 도메인 User)"
  priority: "Figma → 코딩 규칙(ERD 포함) → Notion API 명세서"
  depends_on:
    - AUTH-001   # JWT 인증 필터, @CurrentUserId
    - AUTH-003   # Apple 로그인 — users.email이 null일 수 있음
    - USER-001   # UserController(/api/v1/users), UserUseCase, UserErrorCode.USER_NOT_FOUND

overview:
  summary: >
    마이페이지(E-01) 진입 시 로그인한 회원의 계정 정보를 조회한다. 로그인 계정 이메일과 로그인 방식(Apple로 로그인 / Google로 로그인)을 내려주고,
    서비스 로그인 계정과 별개인 Gmail 연동 여부 · 연동 계정을 따로 내려준다 (E-01 'Gmail 연동' 메뉴 → 미연동 E-02 / 연동 E-03 분기, E-03 연동 Gmail 주소 표시).
  user_story: >
    As a 로그인한 회원, I want to 마이페이지에서 내 로그인 계정과 Gmail 연동 상태를 확인하기를,
    so that 어떤 계정으로 로그인했는지와 결제 메일 연동 여부를 알 수 있다.
  goals:
    - 로그인 회원의 userId · 로그인 방식(provider) · 로그인 이메일 반환
    - 활성 Gmail 연결(gmail_connections, deleted = false) 여부와 Gmail 주소 반환
    - 탈퇴했거나 없는 회원은 USER_NOT_FOUND

technical_spec:
  api:
    - method: GET
      path: /api/v1/users/me
      summary: 내 정보 조회
      auth: Required (Authorization Bearer Access Token)
      request:
        user_id: "@CurrentUserId UUID userId"
        query_params: 없음
        path_params: 없음
        body: 없음
      response:
        http_status: 200 OK
        dto: UserAccountResponse (record + static of(User, Optional<GmailConnection>))
        wrapper: CommonResponse<UserAccountResponse>
        response_code: "UserResponseCode.USER_ACCOUNT_FOUND (200, HttpStatus.OK, \"내 정보를 조회했습니다.\")"
        fields:
          - "userId (UUID): 회원 ID = users.id"
          - "provider (Enum SocialProvider): APPLE / GOOGLE = users.social_provider — E-01 'Apple로 로그인' / 'Google로 로그인'"
          - "email (String, nullable): 로그인 계정 이메일 = users.email — E-01 계정 이메일. Apple 이메일 숨김 등으로 없으면 null"
          - "gmailLinked (boolean): 활성 Gmail 연결이 있으면 true — E-01 'Gmail 연동' 메뉴 분기(E-02 / E-03)"
          - "gmailEmail (String, nullable): 연동된 Gmail 주소 = gmail_connections.gmail_address — E-03 표시. 미연동이면 null"
        mock: |
          {
            "code": 200,
            "message": "내 정보를 조회했습니다.",
            "data": {
              "userId": "7c9e6679-5a4d-4e7b-9c21-000000000001",
              "provider": "GOOGLE",
              "email": "user@gmail.com",
              "gmailLinked": true,
              "gmailEmail": "payments@gmail.com"
            }
          }

  data_flow:
    - step: 1
      layer: Presentation (UserController)
      action: "@CurrentUserId userId → UserUseCase.getUserAccount(userId) → CommonResponse.success(USER_ACCOUNT_FOUND, response)"
    - step: 2
      layer: UseCase (UserUseCase)
      action: >
        회원 확인(없으면 UserNotFoundException) → GmailConnectionGetService.findGmailConnection(user)
        → UserAccountResponse.of(user, gmailConnection)
      transaction: "없음 — 클래스 @Transactional(readOnly = true) 그대로 (조회)"
    - step: 3
      layer: Domain Service
      action: >
        UserGetService.findUserById(userId) — 기존 재사용 (deleted = false) /
        GmailConnectionGetService.findGmailConnection(User) → Optional<GmailConnection> — 신규 (gmail 도메인 첫 Domain Service)
    - step: 4
      layer: Infrastructure (Repository)
      action: "GmailConnectionRepository.findByUserAndDeletedFalse(User) → Optional<GmailConnection> — 신규 쿼리 메서드 (엔티티 문서의 조회 규칙 예시와 같은 이름)"

  database:
    entities:
      - name: User (users)
        action: Read
        fields: "id, social_provider, email"
      - name: GmailConnection (gmail_connections)
        action: Read
        fields: "gmail_address (deleted = false 활성 연결만)"
    schema_change: 없음

  error_codes:
    - code: 40201
      name: USER_NOT_FOUND
      status: 404
      note: "기존 재사용 — 탈퇴했거나 없는 회원"
    - code: 40005
      name: UNAUTHORIZED
      status: 401
      note: "전역 — 토큰 없음 · 만료 (JWT 필터)"

  validation_rules:
    - "로그인 회원 본인 정보만 — userId는 토큰에서만 (@CurrentUserId)"
    - "탈퇴(Soft Delete)한 회원은 USER_NOT_FOUND (40201)"
    - "Gmail 연동 여부는 deleted = false인 gmail_connections 행 유무 — 해제(E-03b, Soft Delete)된 연결은 미연동"
    - "회원당 활성 Gmail 연결은 최대 1개 (gmail_connection.yaml constraints, 연동 기능에서 보장)"

package_structure:
  base: "com.subscribers.gudogging.domain"
  files:
    - "user/presentation/UserController.java (수정 — getUserAccount 핸들러 GET /me + Swagger 설명)"
    - "user/presentation/response/UserResponseCode.java (수정 — USER_ACCOUNT_FOUND)"
    - "user/application/usecase/UserUseCase.java (수정 — getUserAccount, GmailConnectionGetService 의존 추가)"
    - "user/application/dto/response/UserAccountResponse.java (신규, record + of)"
    - "gmail/domain/service/GmailConnectionGetService.java (신규 — findGmailConnection(User))"
    - "gmail/domain/repository/GmailConnectionRepository.java (수정 — findByUserAndDeletedFalse)"
    - "user/domain/service/UserGetService.java (변경 없음 — findUserById 재사용)"

testing_strategy:
  # UserUseCaseTest only — Mock: UserGetService, GmailConnectionGetService (기존 AppleAuthClient, RefreshTokenService 유지)
  happy_path:
    - "getUserAccount: Gmail을 연동한 Google 회원이면 userId · provider(GOOGLE) · 로그인 email · gmailLinked(true) · gmailEmail(연동 Gmail 주소)을 반환한다"
    - "getUserAccount: Gmail을 연동하지 않았으면 gmailLinked(false) · gmailEmail(null)을 반환한다"
  edge_cases:
    - "getUserAccount: 로그인 이메일이 없는 Apple 회원이면 provider(APPLE) · email(null)을 반환한다"
    - "getUserAccount: 로그인 email과 다른 Gmail 계정을 연동했으면 두 값을 각각 반환한다 (L-01 로그인 · Gmail 계정 분리)"
    - "getUserAccount: 회원이 없거나 탈퇴했으면 USER_NOT_FOUND(40201) 예외를 던지고 Gmail 연결을 조회하지 않는다"
  test_files:
    - "test/.../domain/user/application/usecase/UserUseCaseTest.java (수정 — @Nested GetUserAccount 추가)"

