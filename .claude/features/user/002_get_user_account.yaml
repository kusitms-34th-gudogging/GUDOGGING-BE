notes:
  - "[Figma 대조] E-01 '2. 로그인 계정 정보 영역': 원형 프로필 이미지 · 로그인 계정 이메일 · 이메일 하단 'Apple로 로그인' 또는 'Google로 로그인' → email · provider. '3-1. Gmail 연동 메뉴 클릭 시': 미연동 → E-02, 연동 → E-03 → gmailLinked. E-03 '2. 메인 텍스트 하단에 연동된 Gmail 이메일 주소 표시, 실제 연동된 계정 정보를 기준으로 표시' → gmailEmail(gmail_connections.gmail_address). E-02 · E-03 '로그인 계정과 별도로 연결' → email과 gmailEmail 분리. Notion 응답 필드와 충돌 없음"
  - "[결정 2026-11-21 사용자] 프로필 이미지(E-01 '좌측에 원형 프로필 이미지 표시')는 모든 회원 같은 기본 이미지를 클라이언트가 표시 — 응답 · DB에 필드 추가 없음 (Notion · ERD에 없고 시안도 회색 기본 원)"
  - "[결정] 경로 · 메서드는 Notion(GET /api/v1/users/me) — 기존 회원 탈퇴 DELETE /api/v1/users/me와 같은 리소스"
  - "[결정] DTO 이름은 규칙({Resource}Response)대로 UserAccountResponse (E-01 '로그인 계정 정보'), UseCase 메서드 getUserAccount. 회원 + Gmail 연결 두 객체로 만들므로 from 대신 of(user, gmailConnection) — SubscriptionDetailResponse.of(...) · SubscriptionDraftItemResponse.of(...)와 같은 방식"
  - "[결정] Gmail 조회는 gmail 도메인 Domain Service(GmailConnectionGetService)로 — UseCase는 Repository를 직접 쓰지 않음. UserUseCase가 다른 도메인 Domain Service를 쓰는 것은 SubscriptionUseCase → ServiceCatalogGetService와 같은 방식 (UseCase 간 의존 아님)"
  - "[가정] E-01 '7. 예외 처리 — 로그인 계정 정보 조회 실패 시 오류 안내' · E-03 '5. Gmail 연동 계정 정보 조회 실패 시 E-04'는 클라이언트 처리 — 서버는 실패 시 기존 에러 응답(40201 · 401 · 500)만 반환. 오류 안내 방식은 Figma에도 '확인 필요'로 표시됨"
  - "[가정] email이 null인 Apple 회원의 E-01 표시 방법은 Figma에 없음 — 서버는 null 그대로 반환 (Notion 명세)"
  - "[참고] Gmail 연동(E-02 'Gmail 연결하기') · 해제(E-03b) API는 아직 없어 현재는 항상 gmailLinked = false. 회원 탈퇴 시 Gmail 연결 Soft Delete(ERD 8장)도 Gmail 연동 기능 구현 때 추가"
