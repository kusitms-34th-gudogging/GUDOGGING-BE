# Feature Specification
# Status: Draft
# Last Updated: 2026-11-05

meta:
  id: AUTH-002
  title: 토큰 재발급
  type: Feature
  author: 1winhyun
  depends_on: AUTH-001 (구글 로그인 — JwtProvider, RefreshTokenService, Redis 설정)

overview:
  summary: >
    Access Token이 만료되면 앱이 Refresh Token으로 새 Access/Refresh Token을 발급받는다.
    앱을 다시 열어도 로그인 세션이 유지되도록 한다. (S-01)
  user_story: >
    As a 앱 사용자, I want to 앱을 다시 열어도 로그인이 유지되기를,
    so that 매번 Google 로그인을 다시 하지 않아도 된다.
  goals:
    - Refresh Token 검증 후 Access/Refresh Token 재발급
    - Refresh Token Rotation (재발급 시 이전 Refresh Token 무효)

technical_spec:
  api:
    - method: POST
      path: /api/v1/auth/reissue
      summary: 토큰 재발급
      auth: None (공개 — Access Token 만료 상태에서 호출)
      request:
        dto: ReissueTokenRequest
        fields:
          - name: refreshToken
            type: String
            required: true
            validation: "@NotBlank"
      response:
        dto: TokenResponse
        http_status: 200 OK
        wrapper: CommonResponse<TokenResponse>
        response_code: AuthResponseCode.TOKEN_REISSUED (200, "토큰이 재발급되었습니다.")
        fields:
          - name: accessToken
            type: String
          - name: refreshToken
            type: String
            description: "Refresh Token Rotation — 재발급 시 새 Refresh Token으로 교체"

  data_flow:
    - step: 1
      layer: Presentation (AuthController)
      action: "@Valid ReissueTokenRequest 검증 → AuthUseCase.reissueToken(request)"
    - step: 2
      layer: UseCase (AuthUseCase)
      action: "Refresh Token 파싱 → 저장값 비교 → 회원 확인 → 새 토큰 발급 → Refresh 교체 → TokenResponse.of(tokens)"
      transaction: true
    - step: 3
      layer: Global (JwtProvider)
      action: "서명·만료·type = REFRESH 확인 후 userId 추출. 실패 시 InvalidRefreshTokenException"
    - step: 4
      layer: Domain Service (RefreshTokenService) → Infrastructure (RedisRefreshTokenRepository)
      action: "refresh:{userId} 조회 → 없거나 요청 토큰과 다르면 InvalidRefreshTokenException"
    - step: 5
      layer: Domain Service (UserGetService)
      action: "findUserById(userId) deleted = false 확인. 없으면(탈퇴) InvalidRefreshTokenException"
    - step: 6
      layer: Global (JwtProvider) + Domain Service (RefreshTokenService)
      action: "Access/Refresh 새로 발급 → refresh:{userId} 덮어쓰기 (TTL = Refresh 만료시간)"

  database:
    entities:
      - name: User
        action: Read
        table: users
        fields:
          - column: id (deleted = false 확인용)
    redis:
      - key: "refresh:{userId}"
        action: Read / Update

  error_codes:
    domain_range: "401xx (auth)"
    codes:
      - code: 40102
        enum: AuthErrorCode.INVALID_REFRESH_TOKEN
        status: 401 Unauthorized
        message: "유효하지 않거나 만료된 리프레시 토큰입니다."
        trigger: "Refresh 파싱 실패·만료·type 불일치, Redis 저장값 없음/불일치, 탈퇴 회원"
    reused_global:
      - "40001 INVALID_ARGUMENT — refreshToken blank (@Valid)"

  security_config:
    permit_urls_add:
      - /api/v1/auth/reissue

  validation_rules:
    - "refreshToken: blank 불가"
    - "type = REFRESH인 토큰만 허용 (Access Token으로 재발급 불가)"
    - "Redis 저장값과 정확히 일치해야 함 (이미 교체된 토큰 재사용 거절)"
    - "탈퇴(deleted = true) 회원은 재발급 불가"

package_structure:
  base: "com.subscribers.gudogging"
  auth:
    - "domain/auth/presentation/AuthController.java (메서드 추가)"
    - "domain/auth/presentation/response/AuthResponseCode.java (TOKEN_REISSUED 추가)"
    - "domain/auth/application/usecase/AuthUseCase.java (reissueToken 추가)"
    - "domain/auth/application/dto/request/ReissueTokenRequest.java"
    - "domain/auth/application/dto/response/TokenResponse.java"
    - "domain/auth/application/exception/AuthErrorCode.java (INVALID_REFRESH_TOKEN 추가)"
    - "domain/auth/application/exception/InvalidRefreshTokenException.java"
  user:
    - "domain/user/domain/service/UserGetService.java (findUserById 추가)"

testing_strategy:
  # AuthUseCaseTest only (JUnit5 + Mockito)
  # Mock: UserGetService, RefreshTokenService, JwtProvider
  happy_path:
    - "reissueToken: 유효한 Refresh Token이면 새 Access/Refresh Token을 반환하고 저장값을 교체한다"
  edge_cases:
    - "reissueToken: 파싱 실패·만료·type이 ACCESS인 토큰이면 INVALID_REFRESH_TOKEN 예외를 던진다"
    - "reissueToken: Redis에 저장값이 없으면 INVALID_REFRESH_TOKEN 예외를 던진다"
    - "reissueToken: 저장값과 다른(이미 교체된) 토큰이면 INVALID_REFRESH_TOKEN 예외를 던진다"
    - "reissueToken: 회원이 탈퇴(deleted)했으면 INVALID_REFRESH_TOKEN 예외를 던진다"
  test_files:
    - "test/.../domain/auth/application/usecase/AuthUseCaseTest.java"

notes:
  - "AUTH-001 구현 후 진행 (JwtProvider, RefreshTokenService, Redis 설정 재사용)"
  - "[가정] 응답 HTTP 상태는 200 OK. 리소스 생성이 아니라 토큰 발급이므로 POST 기본값(201) 대신 200 사용"
  - "[가정] 탈퇴 회원은 별도 에러 코드 없이 INVALID_REFRESH_TOKEN으로 처리 (앱 입장에서는 세션 만료와 동일 → 로그인 화면)"
