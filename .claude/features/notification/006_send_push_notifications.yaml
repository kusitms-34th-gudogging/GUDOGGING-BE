# Feature Specification
# Status: Implemented
# Last Updated: 2026-11-21

meta:
  id: NOTIFICATION-006
  title: 푸시 발송 배치 (D-3 점검 알림 · D-1 결제 알림 · 해지 확인)
  type: Feature (Batch)
  author: parkdo0918
  issue: "#43"
  depends_on:
    - NOTIFICATION-001   # users.push_token
    - NOTIFICATION-003   # users.is_check_notification_enabled (D-3 수신 여부)
    - NOTIFICATION-004   # 발송한 알림 = 알림 목록 행
    - CHECK-002          # subscription_checks.target_billing_on (이번 주기 점검 여부)
    - CHECK-004          # subscription_checks.decision (해지 확인)
  sources:
    - "노션 API 명세서 Notification — 푸시 토큰 등록 [푸시 발송 규칙] (2026-11-21 확인)"
    - "이슈 #43 (2026-11-21 최신화)"
    - "notification.yaml 푸시 문구"

overview:
  summary: >
    매일 09:00(한국 시간)에 D-3 점검 알림과 D-1 결제 알림 · 해지 확인 알림을 만들어 알림 테이블에 저장하고 FCM으로 보낸다.
    FCM 발송은 인터페이스(PushSender)로 분리하고, 지금은 Firebase 서비스 계정 키가 없어 로그만 남기는 구현을 기본으로 둔다.
  goals:
    - D-3 점검 알림 (회원별 1건 묶음), D-1 결제 알림 · 해지 확인 (구독마다 1건)
    - 발송 이력 저장 + (구독, 종류, 결제일) 중복 발송 방지
    - PushSender 인터페이스 + LoggingPushSender (키를 받으면 Firebase Admin SDK 구현으로 교체)

technical_spec:
  schedule:
    cron: "@Scheduled(cron = \"0 0 9 * * *\", zone = \"Asia/Seoul\")"
    enable: "global/config/SchedulingConfig — @EnableScheduling"
    base: "today = LocalDate.now() (JVM Asia/Seoul), sentAt = LocalDateTime.now()"
    note: "운영 앱 서버 1대라 분산 락 없음"

  common:
    receiver: "삭제되지 않은 회원 중 push_token이 있는 회원의 구독 중(ACTIVE) · 삭제되지 않은 구독"
    next_billing: "subscription.nextBillingOn(today)"
    latest_check: "구독별 가장 최근 점검 (created_at 기준, 홈과 같은 방식)"
    checked_this_cycle: "가장 최근 점검의 target_billing_on = 다음 결제일이면 이번 주기 점검 완료 (홈과 동일)"
    amount_format: "천 단위 쉼표 (예: 63,400원)"

  d3_check_reminder:
    type: CHECK_REMINDER
    member_condition: "users.is_check_notification_enabled = true (OFF면 이 회원은 D-3만 보내지 않음)"
    target: "구독 중 · 꾸준히 쓰는 구독 아님 · 이번 주기 점검 안 함"
    trigger: "회원의 대상 구독 중 다음 결제일이 today + 3인 구독이 하나라도 있으면 발송"
    bundle: "대상 구독 중 today + 1 ~ today + 7 사이 결제일이 있는 구독을 묶어 1건 ('7일 안'에 오늘은 포함하지 않음, 2026-11-21 합의)"
    bundle_amount: "구독마다 today + 1 ~ today + 7 사이 결제 횟수 × 현재 금액을 합산 (매일 · 매주 결제처럼 7일 안에 여러 번 결제되는 구독 포함)"
    main_subscription: "묶음에서 현재 금액이 가장 큰 구독 (같으면 기간 내 첫 결제일 빠른 순 → 이름 순). 알림 행의 subscription · target_billing_on(그 구독의 기간 내 첫 결제일) · payload subscriptionId"
    title: "1건: '{서비스명} {합계}원 결제 예정' / 여러 건: '{대표 서비스명} 외 {N-1}건, {합계}원 결제 예정'"
    body: "7일 안에 빠져나갈 구독료를 확인하세요."
    duplicate: "같은 (대표 구독, CHECK_REMINDER, 결제일) 알림이 이미 있으면 그 회원은 그날 보내지 않음 (결정 1 A, 2026-11-21 합의 — 이미 앞 묶음에 들어간 구독)"

  d1_billing_reminder:
    target: "구독 중 구독 중 다음 결제일이 today + 1인 모든 구독 (꾸준히 쓰는 구독 포함, 알림 설정과 무관)"
    type_rule: "가장 최근 점검의 target_billing_on = 내일이고 decision = CANCEL이면 CANCEL_CONFIRM, 아니면 BILLING_REMINDER"
    billing_reminder: "제목 '내일 {서비스명} {금액}원이 결제돼요' / 본문 '해지 안 했다면 오늘이 마지막 해지 기회예요.'"
    cancel_confirm: "제목 '{서비스명}, 해지하셨나요?' / 본문 '아직이라면 내일 {금액}원이 결제돼요. 오늘 해지하세요.'"
    amount: "현재 금액"
    duplicate: "같은 구독 · 같은 결제일에 BILLING_REMINDER 또는 CANCEL_CONFIRM이 이미 있으면 보내지 않음 (구독마다 1건)"
    canceled: "해지 완료(CANCELED) 구독은 대상 아님"

  sending:
    order: "알림 행을 모두 만든 뒤 saveAll → 행마다 PushSender.send(PushMessage) 호출"
    payload_data: "type, subscriptionId, notificationId (문자열)"
    failure: "한 건 발송이 실패해도(예외) 로그만 남기고 나머지는 계속 보냄. 저장한 알림 행은 그대로 둠 (알림 목록에는 보임)"
    invalid_token: "없는 토큰(UNREGISTERED) 정리는 Firebase 구현으로 교체할 때 함께 처리 — 이번 범위 아님"
    push_sender:
      interface: "domain/notification/domain/PushSender — void send(PushMessage message)"
      message: "PushMessage(String token, String title, String body, Map<String, String> data) record"
      default_impl: "domain/notification/external/LoggingPushSender (@Component) — 토큰 앞부분 · 제목 · data만 INFO 로그"
      later: "Firebase 키를 받으면 FirebasePushSender로 교체 (firebase-admin 의존성 · 환경변수 · .env.example · GitHub Secret 갱신)"

  data_flow:
    - step: 1
      layer: Scheduler (NotificationScheduler, @Component)
      action: "매일 09:00 → NotificationUseCase.sendScheduledNotifications(LocalDate.now())"
    - step: 2
      layer: UseCase (NotificationUseCase)
      action: >
        푸시 받을 구독 조회 → 점검 일괄 조회(구독별 최근) → 이미 보낸 알림 조회(target_billing_on >= today, 삭제 포함)
        → 회원별 D-3 1건 + 구독별 D-1 알림 생성 → saveAll → PushSender.send
      transaction: "@Transactional (쓰기)"
    - step: 3
      layer: Domain Service / Repository
      action: >
        SubscriptionGetService.findActiveSubscriptionsOfPushUsers() — 신규, 회원 · 서비스 fetch join (user.deleted = false, user.pushToken is not null, status = ACTIVE, deleted = false) /
        SubscriptionCheckGetService.findChecksBySubscriptions — 기존 재사용 /
        NotificationGetService.findNotificationsFrom(subscriptions, today) — 신규, findAllBySubscriptionInAndTargetBillingOnGreaterThanEqual (UNIQUE 제약이 삭제된 행도 포함하므로 deleted 조건 없음) /
        NotificationCreateService.createNotifications(list) — 신규, saveAll

  performance:
    - "쿼리 4번 고정 (구독+회원+서비스 · 점검 IN · 알림 IN · saveAll) — 회원 · 구독 수와 무관, N+1 없음"

package_structure:
  base: "com.subscribers.gudogging"
  files:
    - "global/config/SchedulingConfig.java (신규 — @EnableScheduling)"
    - "domain/notification/application/scheduler/NotificationScheduler.java (신규)"
    - "domain/notification/application/usecase/NotificationUseCase.java (수정 — sendScheduledNotifications)"
    - "domain/notification/domain/PushSender.java · PushMessage.java (신규)"
    - "domain/notification/external/LoggingPushSender.java (신규)"
    - "domain/notification/domain/service/NotificationCreateService.java (신규)"
    - "domain/notification/domain/service/NotificationGetService.java (수정 — findNotificationsFrom)"
    - "domain/notification/domain/repository/NotificationRepository.java (수정)"
    - "domain/subscription/domain/service/SubscriptionGetService.java · repository/SubscriptionRepository.java (수정 — findActiveSubscriptionsOfPushUsers)"

testing_strategy:
  # NotificationUseCaseTest — Mock 추가: SubscriptionGetService, SubscriptionCheckGetService, NotificationCreateService, PushSender
  d3:
    - "결제 3일 전 점검 안 한 구독이 있으면 7일 안 결제 구독을 묶어 '{대표} 외 N건, {합계}원 결제 예정'으로 1건 보낸다 (대표 = 금액 가장 큰 구독)"
    - "묶을 구독이 1건이면 '{서비스명} {금액}원 결제 예정'으로 보낸다"
    - "결제 3일 전 구독이 없으면 7일 안 결제 구독이 있어도 보내지 않는다"
    - "꾸준히 쓰는 구독 · 이번 주기 점검한 구독은 대상에서 뺀다"
    - "알림 설정이 OFF인 회원에게는 D-3을 보내지 않는다"
    - "7일 안에 여러 번 결제되는 구독은 횟수만큼 합계에 더한다"
    - "같은 대표 구독 · 결제일 알림이 이미 있으면 그 회원은 보내지 않는다"
  d1:
    - "내일 결제되는 구독마다 '내일 {서비스명} {금액}원이 결제돼요'로 보낸다 (꾸준히 쓰는 구독 · 알림 설정 OFF 회원 포함)"
    - "이번 주기 점검에서 해지를 골랐으면 해지 확인 문구(CANCEL_CONFIRM)로 보낸다"
    - "이미 같은 구독 · 결제일 D-1 알림이 있으면 보내지 않는다"
  sending:
    - "저장한 알림마다 type · subscriptionId · notificationId를 담아 발송한다"
    - "한 건 발송이 실패해도 나머지는 발송한다"
    - "보낼 알림이 없으면 저장 · 발송하지 않는다"

notes:
  - "[결정] D-3 묶음 중복은 같은 (대표 구독, 종류, 결제일) 알림이 있으면 그날 그 회원은 건너뜀 (2026-11-21 합의)"
  - "[결정] 알림 설정 OFF = D-3만 안 보냄, 꾸준히 쓰는 구독은 항상 D-3 제외, D-1 · 해지 확인은 항상 발송 (이슈 #43 최신화)"
  - "[결정] '7일 안' = 내일 ~ 7일 뒤, 오늘 결제는 제외 (2026-11-21 합의)"
  - "[범위] 실제 FCM 연동 · 없는 토큰 정리는 Firebase 키를 받은 뒤 별도 작업"
