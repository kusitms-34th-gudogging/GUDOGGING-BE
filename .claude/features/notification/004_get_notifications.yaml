# Feature Specification
# Status: Implemented
# Last Updated: 2026-11-21

meta:
  id: NOTIFICATION-004
  title: 알림 목록 조회
  type: Feature
  author: parkdo0918
  issue: "#43"
  depends_on:
    - NOTIFICATION-001   # NotificationController, NotificationUseCase
  sources:
    - "노션 API 명세서 Notification — 알림 목록 조회 (2026-11-21 확인)"
    - "화면설계서 H-04 알림 목록 (NOT-001)"

overview:
  summary: >
    홈 알림 아이콘으로 들어가는 알림 목록(H-04)을 조회한다. 발송한 푸시(결제 3일 전 · 결제 1일 전 · 해지 확인)를
    최근 30일 동안 최신순으로 내려준다. '오늘' · '이전 알림' 구분은 클라이언트가 sentAt으로 나눈다.
  user_story: >
    As a 로그인한 회원, I want to 받은 푸시 알림을 다시 보기를,
    so that 놓친 결제 알림을 확인하고 해당 구독으로 이동할 수 있다.
  goals:
    - 최근 30일 · 삭제 제외 알림을 sent_at 최신순으로 반환
    - 서비스 로고 URL (직접 입력 구독 null, 묶음 알림은 금액이 가장 큰 구독 = 저장된 구독의 로고)

technical_spec:
  api:
    - method: GET
      path: /api/v1/notifications
      summary: 알림 목록 조회
      auth: Required (Authorization Bearer Access Token)
      request:
        user_id: "@CurrentUserId UUID userId"
        params: "없음"
      response:
        http_status: 200 OK
        dto: NotificationListResponse (record + from(List<Notification>))
        wrapper: CommonResponse<NotificationListResponse>
        response_code: "NotificationResponseCode.NOTIFICATIONS_FOUND (200, HttpStatus.OK, \"알림 목록을 조회했습니다.\")"
        fields:
          - "notifications (List<NotificationResponse>): 최신순, 최근 30일, 없으면 빈 배열"
          - "notifications[].notificationId (UUID)"
          - "notifications[].type (NotificationType): CHECK_REMINDER / BILLING_REMINDER / CANCEL_CONFIRM — 화면에 표시하지 않고 탭 시 이동 분기에만 사용"
          - "notifications[].title (String) / body (String): 받은 푸시 문구 그대로"
          - "notifications[].subscriptionId (UUID): 이동할 구독 (묶음이면 금액이 가장 큰 구독)"
          - "notifications[].logoUrl (String, nullable): 저장된 구독의 서비스 로고. 직접 입력 구독이면 null"
          - "notifications[].sentAt (LocalDateTime): 발송 시각"
          - "notifications[].read (boolean): 읽음 여부"
        mock: |
          {
            "code": 200,
            "message": "알림 목록을 조회했습니다.",
            "data": {
              "notifications": [
                {
                  "notificationId": "9a1d3c52-5a4d-4e7b-9c21-000000000001",
                  "type": "CHECK_REMINDER",
                  "title": "넷플릭스 외 2건, 63,400원 결제 예정",
                  "body": "7일 안에 빠져나갈 구독료를 확인하세요.",
                  "subscriptionId": "3f2b8c1e-5a4d-4e7b-9c21-000000000001",
                  "logoUrl": "https://cdn.gudogging.com/logos/netflix.png",
                  "sentAt": "2026-11-16T09:00:00",
                  "read": false
                }
              ]
            }
          }

  rules:
    range: "회원 본인 · deleted = false · sent_at >= now − 30일 (NotificationGetService.RETENTION_DAYS 재사용 — 홈 hasUnreadNotification과 같은 조건)"
    order: "sent_at 내림차순"
    logo: "notification.subscription.serviceCatalog.logoUrl, serviceCatalog가 없으면(직접 입력) null. 묶음 알림은 발송 때 금액이 가장 큰 구독을 저장하므로 별도 계산 없음"
    deleted_subscription: "구독 삭제 · 회원 탈퇴 때 알림도 Soft Delete되므로(기존 구현) 목록에 나오지 않음"
    no_type_tag: "종류 태그 문구(결제 3일 전 등)는 내려주지 않음 (노션 명세, 2026-11-21 합의)"

  data_flow:
    - step: 1
      layer: Presentation (NotificationController)
      action: "@CurrentUserId userId → NotificationUseCase.getNotifications(userId) → CommonResponse.success(NOTIFICATIONS_FOUND, response)"
    - step: 2
      layer: UseCase (NotificationUseCase)
      action: "회원 확인(없으면 40201) → NotificationGetService.findRecentNotifications(user, now) → NotificationListResponse.from(...)"
      transaction: "@Transactional(readOnly = true) (클래스)"
    - step: 3
      layer: Domain Service / Repository
      action: >
        NotificationGetService.findRecentNotifications(user, now) — 신규 /
        NotificationRepository: @Query 구독 · 서비스 fetch join (left join fetch s.serviceCatalog), user · deleted = false · sentAt >= from, order by sentAt desc

  error_codes:
    - code: 40201
      name: USER_NOT_FOUND

  performance:
    - "쿼리 2번 (회원 · 알림+구독+서비스 fetch join) — 로고 조회 N+1 없음"

package_structure:
  base: "com.subscribers.gudogging"
  files:
    - "domain/notification/domain/repository/NotificationRepository.java (수정 — findRecentWithSubscriptionByUser)"
    - "domain/notification/domain/service/NotificationGetService.java (수정 — findRecentNotifications)"
    - "domain/notification/application/usecase/NotificationUseCase.java (수정 — getNotifications, NotificationGetService 추가)"
    - "domain/notification/application/dto/response/NotificationListResponse.java · NotificationResponse.java (신규)"
    - "domain/notification/presentation/NotificationController.java (수정 — getNotifications)"
    - "domain/notification/presentation/response/NotificationResponseCode.java (수정 — NOTIFICATIONS_FOUND)"

testing_strategy:
  # NotificationUseCaseTest — Mock 추가: NotificationGetService
  happy_path:
    - "getNotifications: 알림을 받은 순서대로(서비스에서 받은 최신순) 종류 · 문구 · 구독 ID · 로고 · 발송 시각 · 읽음 여부를 반환한다"
  edge_cases:
    - "getNotifications: 직접 입력 구독의 알림이면 logoUrl이 null이다"
    - "getNotifications: 알림이 없으면 빈 배열을 반환한다"
  error_cases:
    - "getNotifications: 회원이 없으면 USER_NOT_FOUND"
