# Notification Entity
# Last Updated: 2026-11-21 (NOTIFICATION-004 알림 목록, NOTIFICATION-005 읽음 처리, NOTIFICATION-006 발송 배치)
# Source: docs/ERD.md v1.1 §4.7 notifications, §5.7 NotificationType, §7 배치

entity: NOTIFICATION
description: 발송한 푸시 알림 이력. 받은 푸시 문구를 그대로 저장해 알림 목록(H-04)에 보여주고, 탭하면 읽음 처리합니다.
table: notifications
domain: Notification
extends: BaseEntity

relationships:
  - user:
      type: "@ManyToOne(fetch = FetchType.LAZY)"
      target: User
      join_column: user_id
      nullable: false
  - subscription:
      type: "@ManyToOne(fetch = FetchType.LAZY)"
      target: Subscription
      join_column: subscription_id
      nullable: false
      description: "탭했을 때 이동할 대상 구독. D-3 묶음 알림은 금액이 가장 큰 구독"

columns:
  - user_id:
      type: BINARY(16)
      nullable: false
      fk: users.id
      description: "수신 회원 FK"
  - subscription_id:
      type: BINARY(16)
      nullable: false
      fk: subscriptions.id
      description: "대상 구독 FK"
  - type:
      type: VARCHAR(30)
      nullable: false
      enum: NotificationType
      description: "알림 종류. @Enumerated(EnumType.STRING)"
  - target_billing_on:
      type: DATE
      nullable: false
      description: "알림 기준 결제일 (대상 구독의 결제일). 중복 발송 방지 키"
  - title:
      type: VARCHAR(100)
      nullable: false
      description: "푸시 제목 (발송 문구 그대로)"
  - body:
      type: VARCHAR(255)
      nullable: false
      description: "푸시 본문 (발송 문구 그대로)"
  - is_read:
      type: BOOLEAN
      nullable: false
      default: false
      description: "읽음 여부. 탭하면 true. 홈 알림 아이콘의 점 표시"
  - sent_at:
      type: DATETIME
      nullable: false
      description: "발송 일시"

enums:
  NotificationType:
    - CHECK_REMINDER: "결제 3일 전 점검 알림 (N-01). 탭 → 구독 점검 1/4"
    - BILLING_REMINDER: "결제 1일 전 알림 (N-02 기본). 탭 → 구독 상세(M-03)"
    - CANCEL_CONFIRM: "결제 1일 전 해지 확인 알림 (N-02). 탭 → 구독 상세 + 해지 완료 확인 모달(X-06)"

indexes:
  - "idx_notifications_user_sent (user_id, sent_at)"

constraints:
  - "UNIQUE (subscription_id, type, target_billing_on) — uk_notifications_subscription_type_billing (배치 재실행 시 중복 발송 방지)"
  - "조회는 항상 deleted = false AND sent_at >= now − 30일 조건"

business_logic:
  - "create(user, subscription, type, targetBillingOn, title, body, sentAt): 정적 팩토리. isRead = false"
  - "read(): isRead = true (알림 목록에서 탭, NOTIFICATION-005). 이미 읽은 알림이어도 성공"
  - "알림 목록(NOTIFICATION-004): NotificationGetService.findRecentNotifications(user, now) — 삭제 제외 · 최근 30일 · sent_at 최신순, 구독 · 서비스 fetch join. logoUrl = 저장된 구독의 서비스 로고(직접 입력 null)"
  - "읽음 대상 조회: NotificationGetService.findNotification(user, id) — 본인 · 삭제 제외, 없으면 NOTIFICATION_NOT_FOUND(40701)"
  - "홈 읽지 않은 점(HOME-001): NotificationGetService.hasUnreadNotification(user, now) — is_read = false · 삭제 제외 · 최근 30일 존재 여부 (exists 쿼리)"
  - "softDelete(): 구독 삭제·회원 탈퇴 시 → BaseEntity 위임"

notes:
  - "30일 보관은 조회 조건으로만 처리, 정리 배치 없음 (ERD 10.1 #15)"
  - "'오늘' / '이전 알림' 구분은 sent_at 기준으로 클라이언트에서 처리"
  - "발송 배치 (NOTIFICATION-006, 매일 09:00 Asia/Seoul): 대상 = push_token 있는 회원(탈퇴 제외)의 구독 중 구독. D-3 = users.is_check_notification_enabled = true 회원의 '꾸준히 쓰는 구독 아님 · 이번 주기 미점검' 구독 중 결제 3일 전 구독이 있으면, 내일 ~ 7일 뒤 결제될 대상 구독을 묶어 회원별 1건 (대표 = 현재 금액이 가장 큰 구독, 합계 = 기간 내 결제 횟수 × 금액). D-1 = 내일 결제인 모든 구독 · 알림 설정 무관, 서비스마다 1건 (이번 주기 최근 점검이 CANCEL이면 CANCEL_CONFIRM)"
  - "중복 발송 방지: D-3은 같은 (대표 구독, CHECK_REMINDER, 결제일) 알림이 있으면 그 회원은 그날 건너뜀, D-1은 같은 구독 · 결제일에 BILLING_REMINDER · CANCEL_CONFIRM이 있으면 건너뜀. UNIQUE가 삭제 행도 포함하므로 삭제된 알림도 확인"
  - "발송: 저장(saveAll) 후 PushSender.send — payload data = type, subscriptionId, notificationId. 한 건 실패해도 나머지 계속. 지금은 LoggingPushSender(로그만), Firebase 키를 받으면 Firebase Admin SDK 구현으로 교체 (없는 토큰 정리 포함)"
  - "문구 — D-3 여러 건: '{서비스명} 외 N건, {합계}원 결제 예정' / 1건: '{서비스명} {금액}원 결제 예정', 본문 '7일 안에 빠져나갈 구독료를 확인하세요.' · BILLING_REMINDER: '내일 {서비스명} {금액}원이 결제돼요' / '해지 안 했다면 오늘이 마지막 해지 기회예요.' · CANCEL_CONFIRM: '{서비스명}, 해지하셨나요?' / '아직이라면 내일 {금액}원이 결제돼요. 오늘 해지하세요.'"
  - "종류 태그 문구는 응답하지 않음 — type은 탭 시 이동 분기에만 사용 (노션 명세)"
