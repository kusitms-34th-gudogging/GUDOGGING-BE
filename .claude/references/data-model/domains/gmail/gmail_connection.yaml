# GmailConnection Entity
# Last Updated: 2026-11-22
# Source: docs/ERD.md v1.1 §4.2 gmail_connections

entity: GMAIL_CONNECTION
description: 로그인 계정과 별도로 연결하는 Gmail 계정. 결제 메일에서 구독 정보를 불러오는 데 사용합니다 (O-05, A-11, E-02~E-04).
table: gmail_connections
domain: Gmail
extends: BaseEntity

relationships:
  - user:
      type: "@ManyToOne(fetch = FetchType.LAZY)"
      target: User
      join_column: user_id
      nullable: false
      description: "연동한 회원. 해제 후 재연동하면 새 행이 생기므로 1:1이 아니라 N:1로 매핑"

columns:
  - user_id:
      type: BINARY(16)
      nullable: false
      fk: users.id
      description: "회원 FK"
  - google_sub:
      type: VARCHAR(255)
      nullable: false
      description: "연동한 Google 계정 식별자 (sub)"
  - gmail_address:
      type: VARCHAR(255)
      nullable: false
      description: "연동된 Gmail 주소 (E-03 표시)"
  - refresh_token:
      type: VARCHAR(720)
      nullable: false
      converter: EncryptedStringConverter (AES-256-GCM)
      description: "gmail.readonly 범위 Google OAuth refresh token. 암호화 저장. Google refresh token 최대 512바이트 → 저장값 Base64(IV 12 + 암호문 512 + 태그 16) = 720자"
  - last_synced_at:
      type: DATETIME
      nullable: true
      description: "마지막으로 결제 메일을 조회한 일시"

indexes:
  - "idx_gmail_connections_user_id (user_id)"

constraints:
  - "회원당 활성(deleted = false) 연결 최대 1개 — 애플리케이션에서 보장 (MySQL은 부분 UNIQUE 미지원)"
  - "조회는 항상 deleted = false 조건 — GmailConnectionRepository.findByUserAndDeletedFalse(User) → Optional (USER-002)"

business_logic:
  - "create(user, googleSub, gmailAddress, refreshToken): 정적 팩토리"
  - "updateRefreshToken(refreshToken): 새 refresh token으로 교체"
  - "markSynced(): lastSyncedAt = now() — 결제 메일 조회 완료 시 (GMAIL-004 analyzeGmailPayments)"
  - "조회: GmailConnectionGetService.findGmailConnection(User) → Optional<GmailConnection> — 활성 연결. 내 정보 조회(USER-002, E-01 gmailLinked · E-03 gmailEmail)에서 사용"
  - "생성: GmailConnectionCreateService.saveGmailConnection — Gmail 연동(GMAIL-001). 이미 활성 연결이 있으면 기존 토큰 revoke(실패 무시) · softDelete 후 새 행"
  - "softDelete(): Gmail 연결 해제 (E-03b, GMAIL-003) → BaseEntity 위임. Google token revoke 성공 후 실행 (실패 시 연결 유지)"
  - "상태: GmailConnectionStatus(NOT_CONNECTED / CONNECTED) — 활성 연결 유무로 판단, 컬럼 없음 (노션 FAILED 제외, 2026-11-22)"
  - "Google 연동: GmailOAuthClient(domain 인터페이스) / GoogleGmailOAuthClientAdapter(external) — 인증 코드 교환 · revoke"

notes:
  - "Google 로그인 인증과 Gmail 접근 권한은 별도 절차. 로그인 계정과 다른 Google 계정을 연결할 수 있음"
  - "회원 탈퇴 시 Gmail token revoke(실패해도 계속) 후 함께 Soft Delete (ERD 8장, USER-001 반영 2026-11-22)"
