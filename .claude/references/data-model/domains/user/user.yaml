# User Entity
# Last Updated: 2026-11-21 (NOTIFICATION-001 platform 컬럼)
# Source: docs/ERD.md v1.1 §4.1 users

entity: USER
description: 회원. Apple/Google 소셜 로그인으로 가입합니다. D-3 점검 알림 설정과 푸시 토큰을 보유합니다.
table: users
domain: User
extends: BaseEntity

columns:
  - social_provider:
      type: VARCHAR(10)
      nullable: false
      enum: SocialProvider
      description: "소셜 로그인 제공자. @Enumerated(EnumType.STRING). 마이페이지 'Apple로 로그인' / 'Google로 로그인' 표시 (E-01)"
  - social_id:
      type: VARCHAR(255)
      nullable: false
      description: "소셜 제공자의 사용자 식별자 (Google: sub, Apple: sub). 탈퇴 시 익명화"
  - email:
      type: VARCHAR(255)
      nullable: true
      description: "소셜 계정 이메일 (E-01 표시). Apple은 비공개 relay 주소일 수 있음. 탈퇴 시 NULL"
  - name:
      type: VARCHAR(100)
      nullable: true
      description: "소셜 계정 사용자 이름 (Google: name 클레임, Apple: 앱이 첫 로그인 때 보낸 fullName). 제공되지 않으면 NULL. 탈퇴 시 NULL"
  - apple_refresh_token:
      type: VARCHAR(512)
      nullable: true
      converter: EncryptedStringConverter (AES-256-GCM)
      description: "Apple authorizationCode 교환으로 받은 refresh token (탈퇴 시 revoke용). Apple 회원만 값 있음, 로그인마다 갱신. 암호화 저장. 탈퇴 시 NULL"
  - push_token:
      type: VARCHAR(255)
      nullable: true
      description: "FCM 등록 토큰. 회원당 1개 (마지막으로 등록한 기기). OS 알림 권한을 허용하면 클라이언트가 등록. 로그아웃·탈퇴 시 NULL"
  - platform:
      type: VARCHAR(10)
      nullable: true
      enum: Platform
      description: "푸시 토큰을 등록한 기기 종류. @Enumerated(EnumType.STRING). 토큰 등록 때 함께 저장, 로그아웃·탈퇴 시 토큰과 함께 NULL (NOTIFICATION-001)"
  - is_check_notification_enabled:
      type: BOOLEAN
      nullable: false
      default: true
      description: "결제 3일 전 점검 알림(N-01, D-3) 수신 여부 = 알림 설정 API의 paymentReminderEnabled (E-05 토글, 변경 즉시 저장). 결제 1일 전 알림 · 해지 확인 알림(N-02)은 이 값과 관계없이 발송"

enums:
  SocialProvider:
    - APPLE
    - GOOGLE
  Platform:
    - IOS
    - ANDROID

constraints:
  - "UNIQUE (social_provider, social_id) — uk_users_social_provider_social_id"
  - "회원 조회는 항상 deleted = false 조건 (예: findBySocialProviderAndSocialIdAndDeletedFalse)"

business_logic:
  - "create(socialProvider, socialId, email, name): 정적 팩토리 메서드. isCheckNotificationEnabled = true"
  - "updateAppleRefreshToken(appleRefreshToken): Apple 로그인 시 교환한 refresh token으로 교체 (AUTH-003)"
  - "updatePushToken(pushToken, platform): 푸시 토큰 · 기기 종류 등록·교체 (기존 값 덮어씀, NOTIFICATION-001)"
  - "clearPushToken(): 로그아웃 시 pushToken = null, platform = null (E-06) — 로그아웃 API(Auth)에서 호출 예정"
  - "changeCheckNotification(enabled): D-3 점검 알림 설정 변경 (E-05)"
  - "withdraw(): 회원 탈퇴 (E-08, USER-001). softDelete() 호출 + socialId = 'withdrawn_{id}', email = null, name = null, appleRefreshToken = null, pushToken = null, platform = null"

notes:
  - "탈퇴 처리(익명화): Hard Delete 금지 규칙에 따라 Soft Delete. UNIQUE는 유지하고, 탈퇴 시 social_id를 'withdrawn_{id}'로 덮어써 같은 소셜 계정의 재가입이 새 행으로 생성되도록 함"
  - "탈퇴 시 연관 데이터(subscriptions, subscription_checks, subscription_check_cancel_reasons, notifications, gmail_connections)도 같은 트랜잭션에서 Soft Delete (ERD 8장). 외부 연동 해제(Apple revoke, Gmail token revoke)는 그 전에 실행하며, 재시도 때 이미 해제된 토큰의 revoke 실패는 무시"
  - "OS 알림 권한 상태는 저장하지 않음. push_token 유무로 발송 여부 판단"
  - "is_check_notification_enabled는 @ColumnDefault(\"true\") — 기존 회원 행에 컬럼이 추가될 때도 true로 채워짐"
