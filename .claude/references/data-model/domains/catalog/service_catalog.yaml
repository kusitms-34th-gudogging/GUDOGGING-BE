# ServiceCatalog Entity
# Last Updated: 2026-11-17
# Source: docs/ERD.md v1.1 §4.3 services

entity: SERVICE_CATALOG
description: 사전 등록 서비스 (서비스 DB). 구독 등록 시 서비스 목록·검색(A-02), 카테고리 기본값(A-03), 웹·직접 결제 해지 안내(X-04/X-05)에 사용하는 마스터 데이터. 운영자가 관리합니다.
table: services
domain: Catalog
extends: BaseEntity

columns:
  - name:
      type: VARCHAR(50)
      nullable: false
      description: "서비스명 (예: 넷플릭스)"
  - name_en:
      type: VARCHAR(50)
      nullable: true
      description: "영문 서비스명 (예: Netflix). 한/영 서비스명 매핑 검색 (A-02)"
  - search_keywords:
      type: VARCHAR(255)
      nullable: true
      description: "별칭·검색 키워드, 쉼표로 구분 (예: '넷플,netflix')"
  - category:
      type: VARCHAR(30)
      nullable: false
      enum: Category
      description: "카테고리. @Enumerated(EnumType.STRING). A-03 카테고리 기본값"
  - logo_url:
      type: VARCHAR(500)
      nullable: true
      description: "서비스 로고 URL. NULL이면 클라이언트 기본 이미지"
  - object_particle:
      type: VARCHAR(1)
      nullable: true
      description: "목적격 조사('을'/'를') 지정값. 영문으로 끝나는 서비스명에만 사용 (X-06). NULL이면 '를'"
  - cancel_url:
      type: VARCHAR(500)
      nullable: true
      description: "웹·직접 결제 해지 페이지 링크. NULL이면 해지 링크 없음 안내(X-05)"
  - sort_order:
      type: INT
      nullable: false
      default: 0
      description: "A-02 '전체' 목록 노출 순서 (오름차순)"
  - is_active:
      type: BOOLEAN
      nullable: false
      default: true
      description: "서비스 목록 노출 여부"

enums:
  Category:
    shared_by: "Subscription, SubscriptionCheck (catalog 도메인에 정의하고 공용으로 사용)"
    fields: "displayName (String, @Getter @AllArgsConstructor) — 아래 표시명. 카테고리명 검색(CATALOG-001)에 사용"
    values:
      - VIDEO_OTT: "영상·OTT"
      - MUSIC: "음악"
      - SHOPPING_DELIVERY: "쇼핑·배달 멤버십"
      - EDUCATION: "교육·학습"
      - PRODUCTIVITY_AI: "생산성·AI"
      - ENTERTAINMENT: "엔터테인먼트"
      - ETC: "기타 — 직접 입력 서비스와 카테고리가 없는 서비스의 기본값"

indexes:
  - "idx_services_name (name)"
  - "idx_services_category (category)"

constraints:
  - "조회는 항상 deleted = false AND is_active = true 조건"

business_logic:
  - "create(name, nameEn, searchKeywords, category, logoUrl, sortOrder): 정적 팩토리. object_particle, cancel_url은 NULL, is_active = true. 주로 UseCase 테스트 픽스처에 사용 (테스트 가이드: 엔티티는 정적 팩토리로 생성)"
  - "create(name, nameEn, searchKeywords, category, logoUrl, cancelUrl, sortOrder): cancel_url을 지정하는 오버로드 (SUBSCRIPTION-006). 위 6개 인자 버전은 cancelUrl = null로 위임. 서비스 시드(services_seed.csv)는 nameEn·searchKeywords = null로 호출"
  - "updateFromSeed(category, logoUrl, cancelUrl, sortOrder): 시드 CSV 동기화용 도메인 메서드. CSV에 있는 컬럼 4개만 갱신하고 나머지 컬럼은 유지 (SUBSCRIPTION-006)"

notes:
  - "클래스명: 스프링 @Service 어노테이션과 이름이 겹치지 않도록 ServiceCatalog로 명명 (테이블명은 services 유지, @Table(name = \"services\"))"
  - "운영자가 SQL로 관리하는 마스터 데이터. 생성/수정 API는 MVP 범위 아님"
  - "요금제·기본 가격은 다루지 않음. 결제 금액은 사용자가 직접 입력 (ERD 10.1 #7)"
  - "검색은 서비스 수가 적어 전체 목록을 메모리에 올려 애플리케이션에서 처리 (초성 검색 포함)"
  - "사용자가 이미 등록한(ACTIVE) 서비스는 A-02 목록에서 제외"
  - "서비스 검색(A-02)은 CATALOG-001에서 구현 — domain/catalog/domain/search/ServiceSearchKeyword (정규화·초성·점수 정렬), 조회는 ServiceCatalogRepository.findAllByIsActiveTrueAndDeletedFalseOrderBySortOrderAscNameAsc()"
  - "구독 등록(SUBSCRIPTION-001)의 serviceId 검증은 ServiceCatalogGetService.findActiveServicesByIds → findAllByIdInAndIsActiveTrueAndDeletedFalse(ids). 없거나 비활성이면 CatalogErrorCode.SERVICE_NOT_FOUND (40301)"
  - "해지 안내 문구(steps · caution)와 App Store/Google Play 링크는 DB에 저장하지 않고 CancelGuideType enum 상수로 관리 (SUBSCRIPTION-006). cancel_guide · cancel_notice 컬럼은 제거됨 — ddl-auto=update는 컬럼을 지우지 않으므로 기존 DB(로컬·dev·운영)에서 수동 실행: ALTER TABLE services DROP COLUMN cancel_guide, DROP COLUMN cancel_notice;"
  - "서비스 시드 동기화: src/main/resources/seed/services_seed.csv(92행, name,category,logo_url,cancel_url,sort_order)를 ServiceCatalogSeedRunner(ApplicationRunner)가 앱 시작 시마다 읽어 CatalogUseCase.seedServices로 name 기준 동기화 — DB에 없는 이름은 추가, 있는 이름은 CSV 컬럼 4개(category, logo_url, cancel_url, sort_order)만 갱신(updateFromSeed). name_en · search_keywords · object_particle · is_active와 CSV에 없는 서비스는 건드리지 않고 삭제·비활성화도 하지 않음. CSV 4개 컬럼은 CSV가 원본이므로 SQL로 직접 고치면 다음 기동 때 덮어써짐(수정은 CSV로). 서비스명 변경은 새 서비스로 추가되므로 SQL로 처리. object_particle은 CSV에 없으므로 영문으로 끝나는 서비스는 '를'로 처리됨 — 필요하면 SQL로 채움"
  - "목적격 조사 선택은 Subscription.objectParticle() — 한글이면 받침 자동 판별, 영문 등은 object_particle 값(없으면 '를'). 해지 링크 유무 분기는 Subscription.cancelGuideType() (SUBSCRIPTION-006)"
