# Bundle (Reference Data — DB 테이블 없음)
# Last Updated: 2026-11-21 (CATALOG-003)
# Source: 구글 시트 '서비스 DB' > '번들 상품 목록', 화면설계서 CHK-008 설명 4번

entity: BUNDLE
description: >
  절약 제안(번들 추천)에 쓰는 결합 · 할인 상품, 카드, 통신 요금제 목록. 읽기 전용 고정 데이터라 DB 테이블 없이
  src/main/resources/seed/bundles_seed.tsv를 앱 시작 시 읽어 메모리에 보관한다 (TsvBundleRepository).
storage: "seed/bundles_seed.tsv (탭 구분, 260행) — 시트가 바뀌면 같은 규칙으로 다시 변환해 재배포"
domain: Catalog
model: "record Bundle (domain/catalog/domain/bundle)"

columns:
  - name: "상품명"
  - recommend_type: "BundleRecommendType — FIXED(확정 절약) / MAX(최대 절약 · 카드) / BENEFIT(혜택 소개 · 통신 요금제) / EXCLUDED(제외)"
  - provider_type: "BundleProviderType — PLATFORM / TELECOM / CARD"
  - monthly_price: "상품 월 가격 (카드는 빈 값)"
  - condition: "적용 조건"
  - tag1: "태그1 — 제공사 · 상품군"
  - tag2: "태그2 — 핵심 혜택 (BENEFIT은 큰 숫자 대신 표시)"
  - fixed_services: "고정 포함 서비스 (요금제 이름, | 구분). BENEFIT은 '포함된 서비스' 중 서비스 목록에 있는 이름"
  - choice_a_services: "택1 그룹 A"
  - choice_b_services: "택1 그룹 B"
  - applied_prices: "서비스별 적용가 '요금제=월 금액' (| 구분)"
  - discounts: "카드 할인 'ALL=30%' / 'A=50%|B=3000' / 'FIXED=10%|A=50%' / '{Category}=10%' — %는 할인율, 숫자만은 할인액(원)"

conversion_rules:
  - "통신 요금제(BENEFIT)는 그룹 칸이 비어 있어 '포함된 서비스' 칸으로 연결 (146개 중 130개, 나머지 16개는 연결 서비스 없음 → 후보 아님)"
  - "'Claude Max' → 'Claude Max 5x', 'Claude Max 20x' (서비스 목록이 요금제로 나뉨)"
  - "카드 할인 'AI 10% / 멤버십 50%' → PRODUCTIVITY_AI=10%, SHOPPING_DELIVERY=50%"
  - "서비스 목록에 없는 포함 서비스(모아진 · 교보문고 sam · 라이너 등)는 그대로 두고 계산에서 0원"

business_logic:
  - "Bundle.includesSummary(): 카드 둘째 줄 '포함 내용' — 고정 포함 ' + ', 택1은 첫 번째 그룹만 ' · ' + ' 택1'(각 최대 2개), 남는 서비스(3개째 · 두 번째 택1 그룹)가 있으면 ' 등'. 같은 서비스 요금제 여러 개는 첫 단어(서비스 이름) 하나로. 예: 'Netflix · YouTube Premium 등 택1' (2026-11-21 합의 — 시트 '포함된 서비스' 원문은 너무 길어 쓰지 않음)"
  - "Bundle.includes(serviceName): 고정 · 택1 A · 택1 B 중 하나라도 같은 이름이면 true"
  - "BundleGetService.findBundlesIncluding(serviceName): EXCLUDED 제외, includes인 상품 — 점검 결과 절약 제안 후보 (CHECK-005)"

notes:
  - "저장 방식 = DB 없이 TSV + 메모리 (2026-11-21 합의) — 마이그레이션 · soft delete 누적 없음"
  - "'쿠팡 와우 멤버십'은 FIXED지만 포함 서비스 칸이 비어 있어(서비스별 적용가만 있음) 후보가 되지 않음 — 시트 확인 필요"
