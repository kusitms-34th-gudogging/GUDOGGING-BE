# Subscription Entity
# Last Updated: 2026-11-19 (billing_anchor_changed_on 제거 → subscription_billing_histories, ERD v1.7 / SUBSCRIPTION-007 해지 완료 · SUBSCRIPTION-008 재등록, started_on 추가)
# Source: docs/ERD.md v1.7 §4.4 subscriptions, §4.4.1 subscription_billing_histories, §6 계산 규칙

entity: SUBSCRIPTION
description: 사용자가 등록한 구독. 결제 금액·주기·기준 결제일·결제한 곳과 구독 상태(구독 중/구독 종료)를 보유하며, 결제일·환산 금액은 저장하지 않고 계산합니다.
table: subscriptions
domain: Subscription
extends: BaseEntity

relationships:
  - user:
      type: "@ManyToOne(fetch = FetchType.LAZY)"
      target: User
      join_column: user_id
      nullable: false
  - serviceCatalog:
      type: "@ManyToOne(fetch = FetchType.LAZY)"
      target: ServiceCatalog
      join_column: service_id
      nullable: true
      description: "사전 등록 서비스. 직접 입력 서비스(A-03s)는 NULL"

columns:
  - user_id:
      type: BINARY(16)
      nullable: false
      fk: users.id
      description: "회원 FK"
  - service_id:
      type: BINARY(16)
      nullable: true
      fk: services.id
      description: "사전 등록 서비스 FK. 직접 입력 서비스는 NULL"
  - name:
      type: VARCHAR(50)
      nullable: false
      description: "서비스명. 사전 등록 서비스는 services.name 스냅샷(수정 불가), 직접 입력은 1~30자"
  - category:
      type: VARCHAR(30)
      nullable: false
      enum: Category
      description: "카테고리 (catalog/service_catalog.yaml 참고). 사전 등록은 서비스 카테고리, 직접 입력은 ETC가 기본값. 사용자가 변경 가능"
  - amount:
      type: INT
      nullable: false
      description: "1회 결제 금액(원). 0보다 커야 함"
  - billing_cycle_value:
      type: TINYINT
      nullable: false
      default: 1
      description: "결제 주기 숫자 (1~31)"
  - billing_cycle_unit:
      type: VARCHAR(10)
      nullable: false
      default: MONTH
      enum: BillingCycleUnit
      description: "결제 주기 단위. @Enumerated(EnumType.STRING)"
  - billing_anchor_on:
      type: DATE
      nullable: false
      description: "현재 조건의 결제 기준일. 사용자가 등록·편집 때 입력한 '다음 결제일'(과거 날짜 불가). 결제일은 이 날짜 + k × 주기(k ≥ 0)로 계산하고 그 전에는 결제일이 없음. 수정 전 조건의 결제는 subscription_billing_histories(subscription_billing_history.yaml)"
  - payment_method:
      type: VARCHAR(20)
      nullable: false
      default: WEB_DIRECT
      enum: PaymentMethod
      description: "결제한 곳. @Enumerated(EnumType.STRING). 해지 안내 분기에 사용"
  - status:
      type: VARCHAR(10)
      nullable: false
      default: ACTIVE
      enum: SubscriptionStatus
      description: "구독 상태. @Enumerated(EnumType.STRING)"
  - canceled_on:
      type: DATE
      nullable: true
      description: "해지일 — 해지 완료 확인 모달(X-06)에서 '해지 완료'를 누른 날짜. ACTIVE면 NULL"
  - is_steady_use:
      type: BOOLEAN
      nullable: false
      default: false
      description: "'꾸준히 쓰는 구독' (M-03 토글). true이면 D-3 점검 알림과 홈 점검 유도에서 제외. D-1 결제 알림은 그대로 발송"
  - registration_source:
      type: VARCHAR(20)
      nullable: false
      enum: RegistrationSource
      description: "등록 경로. @Enumerated(EnumType.STRING)"
  - started_on:
      type: DATE
      nullable: false
      description: "구독 시작일. 등록 시 = 등록일(@PrePersist에서 LocalDate.now()), 재등록 시 = 재등록일 (SUBSCRIPTION-008). 결제 횟수 · 금액, 캘린더 상태는 이 날짜부터 계산"

  - active_service_id:
      type: "BINARY(16) GENERATED ALWAYS AS (CASE WHEN status = 'ACTIVE' AND deleted = FALSE THEN service_id END) VIRTUAL"
      nullable: true
      description: "중복 등록 고유 제약 전용 계산 컬럼. 미삭제 ACTIVE면 service_id, 아니면 NULL. 엔티티 필드 activeServiceId(UUID)는 insertable = false, updatable = false (애플리케이션은 쓰지 않음)"

enums:
  BillingCycleUnit:
    - DAY: "일"
    - WEEK: "주"
    - MONTH: "개월"
    - YEAR: "년"
  PaymentMethod:
    - WEB_DIRECT: "웹·직접 결제 (통신사 결제 포함) — cancel_url 있으면 X-04, 없으면 X-05"
    - APP_STORE: "App Store — X-01"
    - GOOGLE_PLAY: "Google Play — X-03"
  SubscriptionStatus:
    - ACTIVE: "구독 중"
    - ENDED: "구독 종료"
  RegistrationSource:
    - MANUAL: "직접 등록"
    - SCREENSHOT: "스크린샷"
    - GMAIL: "Gmail"

indexes:
  - "idx_subscriptions_user_status (user_id, status)"
  - "idx_subscriptions_service_id (service_id)"
  - "uk_subscriptions_user_active_service UNIQUE (user_id, active_service_id) — 이름은 Subscription.ACTIVE_SERVICE_UNIQUE_CONSTRAINT"

constraints:
  - "amount > 0, billing_cycle_value 1~31, 직접 입력 서비스명 1~30자, billing_anchor_on 과거 불가 — 요청 DTO에서 검증 (엔티티는 검증하지 않음)"
  - "편집(updatePaymentInfo, updateCustomName)·해지(cancel)는 ACTIVE 구독만(해지는 ENDED면 40406), 재등록(reactivate)은 ENDED 구독만(ACTIVE면 40407), 서비스명 수정은 직접 입력 서비스만 — UseCase에서 검증 후 엔티티 메서드 호출"
  - "같은 회원이 같은 service_id를 ACTIVE 상태로 중복 등록 불가 — 애플리케이션에서 검증 (A-02, A-09, A-13). 직접 등록은 SubscriptionUseCase.createSubscriptions에서 SubscriptionGetService.findActiveServiceIds(user)로 검사 (40401). 동시 등록은 uk_subscriptions_user_active_service가 막고, SubscriptionCreateService.createSubscriptions(saveAllAndFlush)가 이 제약 충돌을 DuplicateSubscriptionException(40401)으로 변환. 종료 · 삭제된 구독과 직접 입력 구독은 active_service_id가 NULL이라 제한하지 않음"
  - "조회는 항상 deleted = false 조건"

business_logic:
  - "createFromCatalog(user, serviceCatalog, category, amount, cycleValue, cycleUnit, billingAnchorOn, paymentMethod, registrationSource): 사전 등록 서비스 정적 팩토리. name = serviceCatalog.name 스냅샷, status = ACTIVE"
  - "createCustom(user, name, category, amount, cycleValue, cycleUnit, billingAnchorOn, paymentMethod, registrationSource): 직접 입력 서비스 정적 팩토리. serviceCatalog = null, status = ACTIVE"
  - "updatePaymentInfo(category, amount, cycleValue, cycleUnit, nextBillingDate, paymentMethod, today) → Optional<SubscriptionBillingHistory>: 구독 정보 편집 (M-06). 금액 · 주기 · 다음 결제일(= nextBillingOn(today))이 그대로면 category · paymentMethod만 바꾸고 기준일 유지(월말 유지) · 이력 없음. 바뀌면 지금 조건으로 결제한 적이 있을 때(billingAnchorOn ≤ today, 새 다음 결제일이 today면 ≤ today − 1) 지금 조건을 ended_on = today 이력으로 반환하고 billingAnchorOn = nextBillingDate. UseCase가 SubscriptionBillingHistoryCreateService로 저장"
  - "updateCustomName(name): 직접 입력 서비스명 수정 (M-06)"
  - "changeSteadyUse(enabled): 꾸준히 쓰는 구독 토글 (M-03)"
  - "cancel(today): 해지 완료 (X-06, SUBSCRIPTION-007). status = ENDED, canceledOn = today"
  - "reactivate(billingAnchorOn, today): 구독 종료 구독 재등록 (M-05, SUBSCRIPTION-008). status = ACTIVE, canceledOn = null, billingAnchorOn = 새 다음 결제일, startedOn = today"
  - "softDelete(): 구독 삭제 (M-02.3, C-04) → BaseEntity 위임"
  - "monthlyAmount(): 월 환산 금액 (ERD 6.1) — MONTH n: amount/n · YEAR n: amount/(12n) · WEEK n: amount×52/(12n) · DAY n: amount×365/(12n), 원 단위 반올림(HALF_UP)"
  - "billingCycle(): 현재 조건 BillingCycle(billingCycleValue, billingCycleUnit, billingAnchorOn) — domain/subscription/domain/billing. 결제일 = 기준일 + k × 주기(k ≥ 0), 매번 기준일에서 계산(MONTH · YEAR는 plusMonths)해 월말 결제일 유지. countBetween은 반복 없이 인덱스 차이로 계산"
  - "nextBillingOn(base): 현재 조건으로 base 이상인 첫 결제일 (ERD 6.2). 이력은 모두 오늘까지 끝났으므로 오늘 이후 다음 결제일(목록 · 수정 응답)은 이 값"
  - "startedOn(): 구독 시작일 = started_on (등록일, 재등록하면 재등록일). BillingSchedule의 결제 횟수 · 금액은 이 날짜부터 센다"
  - "지금까지 결제 횟수 · 금액과 과거 날짜 기준 다음 결제일은 BillingSchedule.of(subscription, 결제 조건 이력) — paidCount(today) · totalPaidAmount(today)(결제일마다 그때 금액) · nextBillingOn(base)(base가 이력 ended_on 전이면 그 조건부터). 엔티티에 두지 않음 (이력 필요)"
  - "cancelGuideType(): 해지 안내 4분기 (X-01/X-03/X-04/X-05) — APP_STORE · GOOGLE_PLAY는 결제 경로로, WEB_DIRECT는 serviceCatalog.cancelUrl이 비어 있지 않으면 WEB_WITH_URL, 아니면(직접 입력 구독 포함) WEB_WITHOUT_URL (SUBSCRIPTION-006)"
  - "objectParticle(): 서비스명 뒤 목적격 조사 — 마지막 글자가 한글 음절이면 받침 유무로 '을'/'를', 그 외는 serviceCatalog.objectParticle, 없으면 '를' (SUBSCRIPTION-006)"


notes:
  - "구독 시작일은 started_on 컬럼 (SUBSCRIPTION-008에서 추가, 노션 ERD 반영). 이전 결정(ERD 10.1 #2: created_at 사용)은 재등록 때 쉬었던 기간이 결제 횟수 · 캘린더에 들어가는 문제로 변경 (2026-11-18)"
  - "[감수] 재등록하면 재등록 전 기간의 결제 횟수 · 금액은 '지금까지 결제'에서 빠지고 캘린더에서도 보이지 않음 (2026-11-18 합의)"
  - "직접 일괄 등록(A-04 → A-05)은 SUBSCRIPTION-001에서 구현 — POST /api/v1/subscriptions, registration_source = MANUAL, 전체 성공/전체 실패, SubscriptionCreateService.createSubscriptions → saveAllAndFlush()"
  - "재등록(M-05 '재등록하기'): 새 행을 만들지 않고 같은 행을 ACTIVE로 되살림 — subscriptionId · 점검 기록 유지, canceled_on = NULL, billing_anchor_on = 새 다음 결제일, 시작일(started_on) = 재등록일 (SUBSCRIPTION-008, 2026-11-18 합의)"
  - "구독 삭제 시 해당 subscription_checks, subscription_check_cancel_reasons, notifications, subscription_billing_histories도 함께 Soft Delete (ERD 8장) — UseCase에서 각 도메인 서비스를 통해 처리"
  - "홈 연 금액(H-02)은 예외적으로 등록일과 관계없이 올해 1/1~12/31 전체를 계산하며 ACTIVE 구독만 포함 (ERD 6.3)"
  - "저장하지 않는 값: 다음 결제일, D-day, 월/연 환산 금액, 결제 예정액, 캘린더 결제일 (ERD 6장)"
  - "다음 결제일·기간 내 결제일·월 환산·지금까지 결제 금액은 SUBSCRIPTION-002에서 구현 (위 business_logic). 연 환산·캘린더 상태·해지 안내 분기 계산(ERD 6장)은 기능 구현 시 추가. 계산·검색·표시 로직은 엔티티에 두지 않음 — 해당 기능 스펙 구현 시 추가 (2026-11-16 결정, 기존 User/Post 방식)"
