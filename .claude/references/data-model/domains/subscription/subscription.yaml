# Subscription Entity
# Last Updated: 2026-11-18 (active_service_id 계산 컬럼 + 동시 등록 고유 제약)
# Source: docs/ERD.md v1.1 §4.4 subscriptions, §6 계산 규칙

entity: SUBSCRIPTION
description: 사용자가 등록한 구독. 결제 금액·주기·기준 결제일·결제한 곳과 구독 상태(구독 중/구독 종료)를 보유하며, 결제일·환산 금액은 저장하지 않고 계산합니다.
table: subscriptions
domain: Subscription
extends: BaseEntity

relationships:
  - user:
      type: "@ManyToOne(fetch = FetchType.LAZY)"
      target: User
      join_column: user_id
      nullable: false
  - serviceCatalog:
      type: "@ManyToOne(fetch = FetchType.LAZY)"
      target: ServiceCatalog
      join_column: service_id
      nullable: true
      description: "사전 등록 서비스. 직접 입력 서비스(A-03s)는 NULL"

columns:
  - user_id:
      type: BINARY(16)
      nullable: false
      fk: users.id
      description: "회원 FK"
  - service_id:
      type: BINARY(16)
      nullable: true
      fk: services.id
      description: "사전 등록 서비스 FK. 직접 입력 서비스는 NULL"
  - name:
      type: VARCHAR(50)
      nullable: false
      description: "서비스명. 사전 등록 서비스는 services.name 스냅샷(수정 불가), 직접 입력은 1~30자"
  - category:
      type: VARCHAR(30)
      nullable: false
      enum: Category
      description: "카테고리 (catalog/service_catalog.yaml 참고). 사전 등록은 서비스 카테고리, 직접 입력은 ETC가 기본값. 사용자가 변경 가능"
  - amount:
      type: INT
      nullable: false
      description: "1회 결제 금액(원). 0보다 커야 함"
  - billing_cycle_value:
      type: TINYINT
      nullable: false
      default: 1
      description: "결제 주기 숫자 (1~31)"
  - billing_cycle_unit:
      type: VARCHAR(10)
      nullable: false
      default: MONTH
      enum: BillingCycleUnit
      description: "결제 주기 단위. @Enumerated(EnumType.STRING)"
  - billing_anchor_on:
      type: DATE
      nullable: false
      description: "결제 기준일. 사용자가 등록·편집 때 입력한 '다음 결제일'(과거 날짜 불가). 다음/이전 결제일은 이 날짜 ± k × 주기로 계산하되, billing_anchor_changed_on(NULL이면 등록일)부터 이 날짜 전까지는 결제일이 아님"
  - billing_anchor_changed_on:
      type: DATE
      nullable: true
      description: "결제 기준일을 마지막으로 정한 날(updatePaymentInfo의 today). NULL이면 등록일(startedOn). 그보다 앞선 − k 결제일은 수정 전 결제 기록으로 유지"
  - payment_method:
      type: VARCHAR(20)
      nullable: false
      default: WEB_DIRECT
      enum: PaymentMethod
      description: "결제한 곳. @Enumerated(EnumType.STRING). 해지 안내 분기에 사용"
  - status:
      type: VARCHAR(10)
      nullable: false
      default: ACTIVE
      enum: SubscriptionStatus
      description: "구독 상태. @Enumerated(EnumType.STRING)"
  - canceled_on:
      type: DATE
      nullable: true
      description: "해지일 — 해지 완료 확인 모달(X-06)에서 '해지 완료'를 누른 날짜. ACTIVE면 NULL"
  - is_steady_use:
      type: BOOLEAN
      nullable: false
      default: false
      description: "'꾸준히 쓰는 구독' (M-03 토글). true이면 D-3 점검 알림과 홈 점검 유도에서 제외. D-1 결제 알림은 그대로 발송"
  - registration_source:
      type: VARCHAR(20)
      nullable: false
      enum: RegistrationSource
      description: "등록 경로. @Enumerated(EnumType.STRING)"
  - active_service_id:
      type: "BINARY(16) GENERATED ALWAYS AS (CASE WHEN status = 'ACTIVE' AND deleted = FALSE THEN service_id END) VIRTUAL"
      nullable: true
      description: "중복 등록 고유 제약 전용 계산 컬럼. 미삭제 ACTIVE면 service_id, 아니면 NULL. 엔티티 필드 activeServiceId(UUID)는 insertable = false, updatable = false (애플리케이션은 쓰지 않음)"

enums:
  BillingCycleUnit:
    - DAY: "일"
    - WEEK: "주"
    - MONTH: "개월"
    - YEAR: "년"
  PaymentMethod:
    - WEB_DIRECT: "웹·직접 결제 (통신사 결제 포함) — cancel_url 있으면 X-04, 없으면 X-05"
    - APP_STORE: "App Store — X-01"
    - GOOGLE_PLAY: "Google Play — X-03"
  SubscriptionStatus:
    - ACTIVE: "구독 중"
    - ENDED: "구독 종료"
  RegistrationSource:
    - MANUAL: "직접 등록"
    - SCREENSHOT: "스크린샷"
    - GMAIL: "Gmail"

indexes:
  - "idx_subscriptions_user_status (user_id, status)"
  - "idx_subscriptions_service_id (service_id)"
  - "uk_subscriptions_user_active_service UNIQUE (user_id, active_service_id) — 이름은 Subscription.ACTIVE_SERVICE_UNIQUE_CONSTRAINT"

constraints:
  - "amount > 0, billing_cycle_value 1~31, 직접 입력 서비스명 1~30자, billing_anchor_on 과거 불가 — 요청 DTO에서 검증 (엔티티는 검증하지 않음)"
  - "편집(updatePaymentInfo, updateCustomName)·해지(cancel)는 ACTIVE 구독만, 서비스명 수정은 직접 입력 서비스만 — 도메인 서비스/UseCase에서 검증 후 엔티티 메서드 호출"
  - "같은 회원이 같은 service_id를 ACTIVE 상태로 중복 등록 불가 — 애플리케이션에서 검증 (A-02, A-09, A-13). 직접 등록은 SubscriptionUseCase.createSubscriptions에서 SubscriptionGetService.findActiveServiceIds(user)로 검사 (40401). 동시 등록은 uk_subscriptions_user_active_service가 막고, SubscriptionCreateService.createSubscriptions(saveAllAndFlush)가 이 제약 충돌을 DuplicateSubscriptionException(40401)으로 변환. 종료 · 삭제된 구독과 직접 입력 구독은 active_service_id가 NULL이라 제한하지 않음"
  - "조회는 항상 deleted = false 조건"

business_logic:
  - "createFromCatalog(user, serviceCatalog, category, amount, cycleValue, cycleUnit, billingAnchorOn, paymentMethod, registrationSource): 사전 등록 서비스 정적 팩토리. name = serviceCatalog.name 스냅샷, status = ACTIVE"
  - "createCustom(user, name, category, amount, cycleValue, cycleUnit, billingAnchorOn, paymentMethod, registrationSource): 직접 입력 서비스 정적 팩토리. serviceCatalog = null, status = ACTIVE"
  - "updatePaymentInfo(category, amount, cycleValue, cycleUnit, billingAnchorOn, paymentMethod, today): 구독 정보 편집 (M-06). billingAnchorChangedOn = today"
  - "updateCustomName(name): 직접 입력 서비스명 수정 (M-06)"
  - "changeSteadyUse(enabled): 꾸준히 쓰는 구독 토글 (M-03)"
  - "cancel(today): 해지 완료 (X-06). status = ENDED, canceledOn = today"
  - "softDelete(): 구독 삭제 (M-02.3, C-04) → BaseEntity 위임"
  - "monthlyAmount(): 월 환산 금액 (ERD 6.1) — MONTH n: amount/n · YEAR n: amount/(12n) · WEEK n: amount×52/(12n) · DAY n: amount×365/(12n), 원 단위 반올림(HALF_UP)"
  - "nextBillingOn(base): billingAnchorOn + k × 주기(k는 음수 포함 정수) 중 base 이상인 가장 이른 날짜 (ERD 6.2). 매번 기준일에서 계산(MONTH · YEAR는 plusMonths)해 월말 결제일 유지"
  - "startedOn(): 구독 시작일 = created_at 날짜"
  - "billingDatesBetween(from, to): from ~ to (양끝 포함) 사이 결제일 목록"
  - "paidCount(today) / totalPaidAmount(today): 등록일 ~ (ENDED면 canceledOn, ACTIVE면 today) 결제 횟수 / 횟수 × amount"


notes:
  - "구독 시작일 컬럼 없음 — 등록일(created_at)을 사용 (ERD 10.1 #2)"
  - "직접 일괄 등록(A-04 → A-05)은 SUBSCRIPTION-001에서 구현 — POST /api/v1/subscriptions, registration_source = MANUAL, 전체 성공/전체 실패, SubscriptionCreateService.createSubscriptions → saveAllAndFlush()"
  - "재등록(M-05 '재등록하기'): 기존 ENDED 행은 그대로 두고 새 행 생성 (시작일 = 재등록일)"
  - "구독 삭제 시 해당 subscription_checks, subscription_check_cancel_reasons, notifications도 함께 Soft Delete (ERD 8장) — UseCase에서 각 도메인 서비스를 통해 처리"
  - "홈 연 금액(H-02)은 예외적으로 등록일과 관계없이 올해 1/1~12/31 전체를 계산하며 ACTIVE 구독만 포함 (ERD 6.3)"
  - "저장하지 않는 값: 다음 결제일, D-day, 월/연 환산 금액, 결제 예정액, 캘린더 결제일 (ERD 6장)"
  - "다음 결제일·기간 내 결제일·월 환산·지금까지 결제 금액은 SUBSCRIPTION-002에서 구현 (위 business_logic). 연 환산·캘린더 상태·해지 안내 분기 계산(ERD 6장)은 기능 구현 시 추가. 계산·검색·표시 로직은 엔티티에 두지 않음 — 해당 기능 스펙 구현 시 추가 (2026-11-16 결정, 기존 User/Post 방식)"
