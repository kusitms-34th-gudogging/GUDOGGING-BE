# Testing Guide
# Last Updated: 2026-11-03

meta:
  title: Testing Guide
  type: Convention
  scope: Testing standards and practices

framework:
  testing: JUnit 5
  language: Korean test descriptions
  strategy: Unit tests with mocks (Mockito)

test_structure:
  style:
    required: JUnit 5 with @Test, @DisplayName, @Nested
    hierarchy:
      class: 테스트 대상 클래스 (e.g., PostGetServiceTest)
      nested: 테스트 대상 메서드 또는 기능 (@Nested)
      method: 기대 결과 (~한다, ~를 반환한다, ~예외를 던진다)

    example: |
      @ExtendWith(MockitoExtension.class)
      @DisplayName("PostGetService")
      class PostGetServiceTest {

          @Mock
          private PostRepository postRepository;

          @InjectMocks
          private PostGetService postGetService;

          @Nested
          @DisplayName("getPost")
          class GetPost {

              @Test
              @DisplayName("존재하는 Post ID가 주어지면 Post를 반환한다")
              void returnsPostWhenExists() {
                  // given
                  UUID postId = UUID.randomUUID();
                  Post post = Post.create("테스트 제목", "테스트 본문", "작성자");
                  given(postRepository.findByIdAndDeletedFalse(postId)).willReturn(Optional.of(post));

                  // when
                  Post result = postGetService.getPost(postId);

                  // then
                  assertThat(result.getTitle()).isEqualTo("테스트 제목");
              }

              @Test
              @DisplayName("존재하지 않는 ID가 주어지면 예외를 던진다")
              void throwsWhenNotFound() {
                  // given
                  UUID postId = UUID.randomUUID();
                  given(postRepository.findByIdAndDeletedFalse(postId)).willReturn(Optional.empty());

                  // when & then
                  assertThatThrownBy(() -> postGetService.getPost(postId))
                      .isInstanceOf(ApplicationException.class);
              }
          }
      }

test_annotations:
  unit:
    annotation: "@ExtendWith(MockitoExtension.class)"
    use_for: Service, UseCase layer tests
    composition:
      - "@ExtendWith(MockitoExtension.class)"
      - "@Mock for dependencies"
      - "@InjectMocks for the target class"

    benefits:
      - Fast execution (no Spring context)
      - Isolated unit behavior
      - Easy to control mock responses
      - Clear single-responsibility tests

coding_patterns:
  constructor_injection:
    do: |
      @ExtendWith(MockitoExtension.class)
      class SomeServiceTest {
          @Mock
          private SomeRepository someRepository;

          @InjectMocks
          private SomeService someService;
      }
    dont: |
      @Autowired
      private SomeRepository someRepository;

  test_data:
    pattern: |
      @Test
      @DisplayName("유효한 Post가 주어지면 저장된 Post를 반환한다")
      void createPost() {
          // given
          Post post = Post.create("테스트 제목", "테스트 본문", "작성자");
          given(postRepository.save(post)).willReturn(post);

          // when
          Post saved = postCreateService.createPost(post);

          // then
          assertThat(saved.getTitle()).isEqualTo("테스트 제목");
      }
    rules:
      - Create entities via static factory method (Entity.create(...)) — constructors are private
      - Use UUID.randomUUID() for IDs (BaseEntity id is UUID, never Long literals like 1L)
      - Clear, descriptive variable names
      - given/when/then structure
      - One assertion theme per test

  assertions:
    use: AssertJ (fluent style)
    examples:
      - assertThat(result).isNotNull()
      - assertThat(result.getName()).isEqualTo("유튜브 프리미엄")
      - assertThat(result.getAmount()).isGreaterThan(0)
      - assertThatThrownBy(() -> ...).isInstanceOf(ApplicationException.class)

    common_assertions:
      - isEqualTo: equality
      - isNotNull: null check
      - isGreaterThan: comparison
      - isInstanceOf: type check
      - assertThatThrownBy: exception

    forbidden:
      - assertEquals(expected, actual)  # use AssertJ instead
      - assertNotNull(value)             # use AssertJ instead

file_naming:
  pattern: "{TargetClass}Test.java"
  examples:
    - SubscriptionGetServiceTest.java
    - SubscriptionUseCaseTest.java
    - SubscriptionCheckCreateServiceTest.java
  rule: Class name MUST match file name
  suffix: Use "Test" (not "Spec")

directory_structure:
  path: src/test/java/com/subscribers/gudogging/
  layout: |
    domain/
      subscription/
        application/
          usecase/
            SubscriptionUseCaseTest.java
        domain/
          service/
            SubscriptionGetServiceTest.java

  rules:
    - Mirror main package structure
    - Focus on UseCase and Service (Domain) tests
    - No controller tests
    - No integration tests (unit tests only)

best_practices:
  - rule: Unit tests only
    description: Test each class in isolation using Mockito mocks
    benefit: Fast, reliable, easy to maintain

  - rule: Test isolation
    description: Each test method is independent — no shared mutable state

  - rule: Clear test intent
    description: Korean @DisplayName, @Nested hierarchy
    implementation: One scenario per @Test method

  - rule: Simple test code
    description: Keep test methods concise, one assertion theme per test
    implementation: Avoid complex logic in tests — if setup is complex, extract helper

  - rule: AAA pattern
    description: Always structure as given / when / then

forbidden:
  - "Integration tests (unit tests only)"
  - "English test names (use Korean @DisplayName)"
  - "JUnit 4 (use JUnit 5)"
  - "Field injection in tests (use @Mock / @InjectMocks)"
  - "Controller layer tests"
  - "H2 or TestContainers (no DB tests — mock the repository)"

example_unit_test: |
  @ExtendWith(MockitoExtension.class)
  @DisplayName("PostCreateService")
  class PostCreateServiceTest {

      @Mock
      private PostRepository postRepository;

      @InjectMocks
      private PostCreateService postCreateService;

      @Nested
      @DisplayName("createPost")
      class CreatePost {

          @Test
          @DisplayName("유효한 Post가 주어지면 저장하고 반환한다")
          void savesAndReturnsPost() {
              // given
              Post post = Post.create("테스트 제목", "테스트 본문", "작성자");
              given(postRepository.save(post)).willReturn(post);

              // when
              Post saved = postCreateService.createPost(post);

              // then
              assertThat(saved).isNotNull();
              assertThat(saved.getTitle()).isEqualTo("테스트 제목");
              assertThat(saved.getAuthorName()).isEqualTo("작성자");
          }
      }
  }
