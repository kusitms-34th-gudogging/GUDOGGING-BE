# 개발 서버용 (app + MySQL + Redis 한 서버). 서버의 /home/ubuntu/gudogging 에서 .env 와 함께 실행.
# 배포는 deploy-dev.yml 이 APP_IMAGE 를 지정해 pull / up 한다.
# 수동 실행: docker compose -f docker-compose.dev.yml up -d

services:
  mysql:
    image: mysql:8.4
    container_name: gudogging-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1(TCP)로 확인: 최초 초기화 중 임시 서버(네트워크 비활성)를 healthy 로 오인하지 않도록
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: gudogging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    image: ${APP_IMAGE:-ghcr.io/kusitms-34th-gudogging/gudogging-be:dev}
    container_name: gudogging-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
