# 운영 DB 서버용 (MySQL + Redis). 서버의 /home/ubuntu/gudogging 에서 .env 와 함께 실행.
# 실행: docker compose -f docker-compose.prod-db.yml up -d
# 포트는 사설 IP(192.168.0.11)에만 바인딩 → 가비아 내부망의 운영 앱 서버만 접근 (보안 그룹으로 이중 제한)
#
# 서버 .env 필요 항목: MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD, REDIS_PASSWORD, TZ

# 컨테이너 로그 자동 정리: 파일 20MB × 최대 5개, 넘으면 오래된 것부터 삭제 (기본값은 무제한으로 쌓임)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    logging: *default-logging
    image: mysql:8.4
    container_name: gudogging-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    ports:
      - "192.168.0.11:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1(TCP)로 확인: 최초 초기화 중 임시 서버(네트워크 비활성)를 healthy 로 오인하지 않도록
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: gudogging-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # redis-cli 가 이 값으로 자동 인증 (healthcheck 에서 비밀번호를 명령줄에 노출하지 않음)
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "192.168.0.11:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
