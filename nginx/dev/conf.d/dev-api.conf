# dev-api.gudogging.com → Spring Boot (gudogging-app:8080) — 개발 서버

# 앱 컨테이너가 아직 없어도 Nginx 가 뜨도록 요청 시점에 이름 해석 (Docker 내장 DNS)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name dev-api.gudogging.com;

    # Let's Encrypt 인증서 갱신용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev-api.gudogging.com;

    ssl_certificate     /etc/letsencrypt/live/dev-api.gudogging.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.gudogging.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    location / {
        set $upstream http://app:8080;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
