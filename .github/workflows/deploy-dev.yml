name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 배포가 겹치지 않도록 순차 실행 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kusitms-34th-gudogging/gudogging-be

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: docker-compose.dev.yml
          target: /home/ubuntu/gudogging

      - name: Deploy & health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,APP_IMAGE
          script: |
            set -e
            cd /home/ubuntu/gudogging
            export APP_IMAGE

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.dev.yml pull app
            docker compose -f docker-compose.dev.yml up -d
            docker logout ghcr.io

            # 헬스체크: 최대 약 150초 (최초 배포 시 MySQL 초기화 시간 포함)
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v3/api-docs || true)
              if [ "$code" = "200" ]; then
                echo "Health check passed ($i)"
                docker image prune -f
                exit 0
              fi
              echo "Waiting for app... ($i/30, status=$code)"
              sleep 5
            done

            echo "Health check failed. app logs:"
            docker compose -f docker-compose.dev.yml ps
            docker compose -f docker-compose.dev.yml logs --tail 200 app
            exit 1
