name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# 배포가 겹치지 않도록 순차 실행 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kusitms-34th-gudogging/gudogging-be

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 서버 .env 는 Secret DEV_ENV_FILE(.env 전체 내용)로 관리. 변수 추가 시 Secret 만 수정하면 다음 배포에 반영
      - name: Check & prepare .env
        env:
          ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then echo "::error::Secret DEV_ENV_FILE 이 비어 있음"; exit 1; fi
          printf '%s\n' "$ENV_FILE" > "$RUNNER_TEMP/app.env"
          bash .github/scripts/check-env.sh "$RUNNER_TEMP/app.env" \
            src/main/resources/application.yaml docker-compose.dev.yml
          ENV_B64=$(base64 -w0 "$RUNNER_TEMP/app.env")
          echo "::add-mask::$ENV_B64"
          echo "ENV_B64=$ENV_B64" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/app.env"

      - name: Copy compose & nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: docker-compose.dev.yml,nginx/dev/conf.d/dev-api.conf
          target: /home/ubuntu/gudogging

      - name: Deploy & health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,APP_IMAGE,ENV_B64
          script: |
            set -e
            cd /home/ubuntu/gudogging
            export APP_IMAGE

            # Secret 내용으로 .env 갱신 (기존 파일은 .env.bak 로 백업)
            [ -f .env ] && cp -p .env .env.bak
            (umask 077 && echo "$ENV_B64" | base64 -d > .env.new && mv .env.new .env)
            chmod 600 .env .env.bak 2>/dev/null || true

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.dev.yml pull app
            docker compose -f docker-compose.dev.yml up -d
            docker logout ghcr.io
            docker exec gudogging-nginx nginx -s reload || true

            # 헬스체크: Nginx(HTTPS) 경유, DB·Redis 연결 포함. 최대 약 150초
            for i in $(seq 1 30); do
              code=$(curl -sk -o /dev/null -w '%{http_code}' \
                --resolve dev-api.gudogging.com:443:127.0.0.1 \
                https://dev-api.gudogging.com/actuator/health || true)
              if [ "$code" = "200" ]; then
                echo "Health check passed ($i)"
                docker image prune -f
                exit 0
              fi
              echo "Waiting for app... ($i/30, status=$code)"
              sleep 5
            done

            echo "Health check failed. app logs:"
            docker compose -f docker-compose.dev.yml ps
            docker compose -f docker-compose.dev.yml logs --tail 200 app
            exit 1
