name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kusitms-34th-gudogging/gudogging-be

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Settings > Environments > production 에서 Required reviewers 를 지정하면 승인 후에만 실행됨
    environment:
      name: production
      url: https://api.gudogging.com
    steps:
      - uses: actions/checkout@v4

      # 서버 .env 는 Secret PROD_ENV_FILE(.env 전체 내용)로 관리. 변수 추가 시 Secret 만 수정하면 다음 배포에 반영
      - name: Check & prepare .env
        env:
          ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then echo "::error::Secret PROD_ENV_FILE 이 비어 있음"; exit 1; fi
          printf '%s\n' "$ENV_FILE" > "$RUNNER_TEMP/app.env"
          bash .github/scripts/check-env.sh "$RUNNER_TEMP/app.env" \
            src/main/resources/application.yaml src/main/resources/application-prod.yaml docker-compose.prod.yml
          ENV_B64=$(base64 -w0 "$RUNNER_TEMP/app.env")
          echo "::add-mask::$ENV_B64"
          echo "ENV_B64=$ENV_B64" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/app.env"

      - name: Copy compose & nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: docker-compose.prod.yml,nginx/conf.d/api.conf
          target: /home/ubuntu/gudogging

      - name: Deploy, health check & rollback
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          NEW_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          IMAGE_REPO: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,NEW_IMAGE,IMAGE_REPO,ENV_B64
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/gudogging
            COMPOSE="docker compose -f docker-compose.prod.yml"

            # Secret 내용으로 .env 갱신 (기존 파일은 .env.bak 로 백업)
            [ -f .env ] && cp -p .env .env.bak
            (umask 077 && echo "$ENV_B64" | base64 -d > .env.new && mv .env.new .env)
            chmod 600 .env .env.bak 2>/dev/null || true

            # 롤백용: 현재 실행 중인 이미지 기록 (최초 배포면 비어 있음)
            PREV_IMAGE=$(docker inspect --format '{{.Config.Image}}' gudogging-app 2>/dev/null || true)
            echo "Previous image: ${PREV_IMAGE:-none}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            APP_IMAGE="$NEW_IMAGE" $COMPOSE pull app
            docker logout ghcr.io

            APP_IMAGE="$NEW_IMAGE" $COMPOSE up -d
            docker exec gudogging-nginx nginx -s reload || true

            # Nginx(HTTPS) 경유로 헬스체크 (DB·Redis 연결 포함), 최대 약 150초
            health() {
              for i in $(seq 1 30); do
                code=$(curl -sk -o /dev/null -w '%{http_code}' \
                  --resolve api.gudogging.com:443:127.0.0.1 \
                  https://api.gudogging.com/actuator/health || true)
                if [ "$code" = "200" ]; then echo "Health check passed ($i)"; return 0; fi
                echo "Waiting for app... ($i/30, status=$code)"
                sleep 5
              done
              return 1
            }

            if health; then
              # 정리: 최신 3개 커밋 이미지만 남김 (롤백 대비)
              docker images "$IMAGE_REPO" --format '{{.Repository}}:{{.Tag}}' \
                | grep -v ':prod$' | tail -n +4 | xargs -r docker rmi || true
              docker image prune -f
              exit 0
            fi

            echo "Health check failed. app logs:"
            $COMPOSE logs --tail 200 app

            if [ -n "$PREV_IMAGE" ] && [ "$PREV_IMAGE" != "$NEW_IMAGE" ]; then
              echo "Rolling back to $PREV_IMAGE"
              APP_IMAGE="$PREV_IMAGE" $COMPOSE up -d app
              if health; then echo "Rollback succeeded"; else echo "Rollback health check also failed"; fi
            else
              echo "No previous image to roll back to"
            fi
            exit 1
