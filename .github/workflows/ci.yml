name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GudoggingApplicationTests(@SpringBootTest)가 실제 컨텍스트를 띄우므로 MySQL, Redis 필요
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gudogging
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5

    env:
      DB_URL: jdbc:mysql://localhost:3306/gudogging?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: root
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      GOOGLE_CLIENT_IDS: ci-dummy-client-id
      # CI 전용 더미 값 (실제 환경과 무관)
      JWT_SECRET: Y2ktb25seS1kdW1teS1zZWNyZXQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0wMTIzNDU2Nzg5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
